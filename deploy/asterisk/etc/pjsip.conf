; Asterisk PJSIP — транк оператора + WebRTC-софтфон для LeadDrive.
; Значения сняты с боевого 3CX 2026-07-30, см. docs/voip-migration-trunk-dossier.md
;
; ШАБЛОН: ${TRUNK_PASSWORD}, ${WEBRTC_PASSWORD}, ${EXTERNAL_IP} подставляет
; entrypoint.sh при старте. Пароли в репозиторий не попадают.

;=============================================================== ТРАНСПОРТЫ

; SIP наружу к оператору. Порт 5070, а НЕ 5060 — 5060 занят живым 3CX
; на этой же машине.
[transport-udp]
type = transport
protocol = udp
bind = 0.0.0.0:5070
external_media_address = ${EXTERNAL_IP}
external_signaling_address = ${EXTERNAL_IP}

; WSS — то, ради чего всё затевалось: софтфон внутри LeadDrive.
; Именно этого 3CX не давал (сторонние WebRTC-клиенты заблокированы).
[transport-wss]
type = transport
protocol = wss
bind = 0.0.0.0:8089
external_media_address = ${EXTERNAL_IP}
external_signaling_address = ${EXTERNAL_IP}

;=================================================================== ТРАНК

[trunk-registration]
type = registration
transport = transport-udp
outbound_auth = trunk-auth
server_uri = sip:109.235.199.60:4959
client_uri = sip:994995111103@109.235.199.60:4959
contact_user = 994995111103
; 3CX держал Re-Register timeout 180 — повторяем, оператор к нему привык.
expiration = 180
retry_interval = 60
forbidden_retry_interval = 600
max_retries = 0

[trunk-auth]
type = auth
auth_type = userpass
username = 994995111103
password = ${TRUNK_PASSWORD}

[trunk-aor]
type = aor
contact = sip:109.235.199.60:4959
qualify_frequency = 60

[trunk]
type = endpoint
transport = transport-udp
context = from-trunk
aors = trunk-aor
outbound_auth = trunk-auth
from_user = 994995111103
from_domain = 109.235.199.60
; Оператор отдаёт ТОЛЬКО PCMA. Ничего больше не предлагаем, чтобы не
; ловить отказы при согласовании кодеков.
disallow = all
allow = alaw
; Оператор указал DTMF = Auto: Asterisk сам выберет RFC2833, если он
; согласован в SDP, и упадёт на inband, если нет. Важно для ИИ-оператора —
; цифры (номера, суммы, даты) надёжнее собирать тонами, чем распознаванием.
dtmf_mode = auto
; SRTP у оператора выключен — медиа открытое, как и было на 3CX.
media_encryption = no
direct_media = no
rtp_symmetric = yes
force_rport = yes
rewrite_contact = yes
; Видео на транке отключено, как в 3CX.
allow_subscribe = no

; Входящий трафик приходит с IP оператора — сопоставляем его с транком,
; иначе Asterisk не поймёт, чей это вызов, и бросит в анонимный контекст.
[trunk-identify]
type = identify
endpoint = trunk
match = 109.235.199.60

;====================================================== СОФТФОН В LEADDRIVE

; Экстеншен, которым регистрируется вкладка CRM через SIP.js по WSS.
; По одному такому на каждого менеджера; ниже — образец для первого.
[webrtc-template](!)
type = endpoint
transport = transport-wss
context = from-internal
disallow = all
allow = opus,alaw
; WebRTC обязателен: DTLS-SRTP, ICE, rtcp-mux. Без webrtc=yes браузер
; не соединится.
webrtc = yes
use_avpf = yes
media_encryption = dtls
dtls_verify = fingerprint
dtls_setup = actpass
ice_support = yes
media_use_received_transport = yes
rtcp_mux = yes
direct_media = no

[1001](webrtc-template)
auth = 1001-auth
aors = 1001-aor
callerid = LeadDrive Agent <994995111103>

[1001-auth]
type = auth
auth_type = userpass
username = 1001
password = ${WEBRTC_PASSWORD}

[1001-aor]
type = aor
max_contacts = 2
remove_existing = yes
