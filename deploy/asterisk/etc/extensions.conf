; Диалплан LeadDrive.
;
; Главная задача этого файла — нормализация номера. Оператор пропускает
; наружу ТОЛЬКО формат 0XXXXXXXXX (10 цифр, начинается с нуля), а CRM
; хранит контакты в E.164 (+994XXXXXXXXX). Именно на этом расхождении
; звонки не уходили на 3CX — там правило было prefix=0, length=10.

[globals]
TRUNK = PJSIP/trunk
; Куда AudioSocket отдаёт звук ИИ-конвейеру. Слушает наш сервис.
AI_AUDIOSOCKET = 127.0.0.1:8090

;======================================================= ИСХОДЯЩИЕ ИЗ CRM

[from-internal]
; --- Азербайджанские номера в любом из трёх видов приводим к 0XXXXXXXXX ---

; +994512060838 -> 0512060838   (то, что реально шлёт CRM сегодня)
exten => _[+]994XXXXXXXXX,1,NoOp(E.164 -> нацформат: ${EXTEN})
 same => n,Set(DEST=0${EXTEN:4})
 same => n,Goto(place-call,${DEST},1)

; 994512060838 -> 0512060838    (то же, но без плюса)
exten => _994XXXXXXXXX,1,NoOp(994 без плюса -> нацформат: ${EXTEN})
 same => n,Set(DEST=0${EXTEN:3})
 same => n,Goto(place-call,${DEST},1)

; 512060838 -> 0512060838       (9 цифр без нуля и без кода страны)
exten => _XXXXXXXXX,1,NoOp(9 цифр -> добавляем 0: ${EXTEN})
 same => n,Set(DEST=0${EXTEN})
 same => n,Goto(place-call,${DEST},1)

; 0512060838 — уже правильный формат, ничего не трогаем
exten => _0XXXXXXXXX,1,NoOp(уже нацформат: ${EXTEN})
 same => n,Set(DEST=${EXTEN})
 same => n,Goto(place-call,${DEST},1)

; --- Внутренние: менеджер менеджеру ---
exten => _10XX,1,Dial(PJSIP/${EXTEN},30)
 same => n,Hangup()

; Всё остальное — под правило оператора не подходит, режем сразу с
; понятной причиной, а не молчаливым таймаутом.
exten => _.,1,NoOp(ОТКАЗ: ${EXTEN} не приводится к формату 0XXXXXXXXX)
 same => n,Playback(silence/1)
 same => n,Hangup(28)

[place-call]
; Единая точка набора наружу. Всё, что сюда попало, уже нормализовано.
exten => _X.,1,NoOp(Набор через транк: ${EXTEN})
 same => n,Set(CALLERID(num)=994995111103)
 same => n,Dial(${TRUNK}/${EXTEN},60)
 same => n,NoOp(Результат: ${DIALSTATUS})
 same => n,Hangup()

;=========================================================== ВХОДЯЩИЕ

[from-trunk]
; DID 994995111103 — на 3CX уходил в Ring Group 800.
exten => 994995111103,1,NoOp(Входящий на DID от ${CALLERID(num)})
 same => n,Goto(inbound-route,s,1)

; Оператор может присылать номер и в других видах — ловим всё.
exten => _.,1,NoOp(Входящий, DID=${EXTEN}, от ${CALLERID(num)})
 same => n,Goto(inbound-route,s,1)

[inbound-route]
exten => s,1,Answer()
 same => n,Set(CDR(userfield)=inbound)
 ; Пока просто звоним первому софтфону. Позже здесь встанет очередь
 ; агентов, а до неё — ИИ-оператор (см. контекст ai-operator).
 same => n,Dial(PJSIP/1001,30)
 same => n,Hangup()

;=========================================== ИИ-ОПЕРАТОР (заглушка)

[ai-operator]
; AudioSocket отдаёт сырой PCM 16 бит в обе стороны по TCP — это и есть
; точка подключения распознавания и синтеза. UUID уникален на звонок,
; по нему наш сервис сопоставляет поток с записью в CRM.
;
; ВНИМАНИЕ: транк отдаёт 8 кГц (PCMA) — это потолок качества для ASR,
; шире не станет. См. §6 досье.
exten => s,1,NoOp(ИИ-оператор: старт)
 same => n,Answer()
 same => n,Set(CALL_UUID=${UUID()})
 same => n,AudioSocket(${CALL_UUID},${AI_AUDIOSOCKET})
 same => n,Hangup()
