name: Workforce Android foundation

on:
  pull_request:
    paths:
      - "apps/workforce-android/**"
      - ".github/workflows/workforce-android.yml"
  push:
    branches: [main]
    paths:
      - "apps/workforce-android/**"
      - ".github/workflows/workforce-android.yml"

permissions:
  contents: read

concurrency:
  group: workforce-android-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  debug-foundation:
    name: Android debug lint and unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle 9.5.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"
      - name: Verify debug foundation
        run: gradle --no-daemon -p apps/workforce-android :app:lintDebug :app:testDebugUnitTest

# This workflow intentionally does not build a signed release, upload to Play,
# deploy the web service or access signing/production secrets. Those steps need
# separate owner-recorded application identity and release evidence.
