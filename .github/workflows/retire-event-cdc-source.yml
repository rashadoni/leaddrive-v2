name: Retire event CDC source on production

# Read-only report of the production CDC source (slot, publication, CDC role).
#
# Inspect only. Apply was removed on 2026-10-25: a session acting on an
# earlier owner decision dispatched it at 14:42 UTC and dropped the live slot
# after the owner had decided to keep Kafka ("Kafka оставляем"). Retiring the
# source needs the owner's direct word on the same day and runs by hand on
# the host (see "Kafka остаётся" in CLAUDE.md and retire-cdc-source.sh), never
# from a button anyone holding the GitHub token can press.
# Dispatch-only and on the production-deploy lock; it never runs from a push.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "inspect — только посмотреть (снять CDC отсюда нельзя)"
        type: choice
        options: [inspect]
        default: inspect

permissions:
  contents: read

jobs:
  retire:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: production
    # Shares the production lock with deploys and waits its turn behind them
    # without replacing a pending deploy (same as event-platform-readiness.yml).
    # The first dispatch, 2026-10-25, used the default single pending slot and
    # was replaced by a deploy while main kept deploying.
    concurrency:
      group: production-deploy
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Validate inputs
        env:
          MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          [ "$MODE" = inspect ] || { echo "::error::only inspect runs from GitHub; see CLAUDE.md «Kafka остаётся»"; exit 1; }
          bash -n scripts/event-platform/retire-cdc-source.sh

      - name: Setup pinned production SSH
        uses: ./.github/actions/setup-production-ssh
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
          server-host: ${{ secrets.SERVER_HOST }}
          known-hosts: ${{ secrets.SERVER_SSH_KNOWN_HOSTS }}

      - name: Run on production
        env:
          MODE: ${{ inputs.mode }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          set -euo pipefail
          [ "$MODE" = inspect ] || exit 1
          ssh -o ConnectTimeout=30 -o ServerAliveInterval=15 -i ~/.ssh/deploy_key \
            "$SERVER_USER@$SERVER_HOST" "bash -s -- inspect" \
            < scripts/event-platform/retire-cdc-source.sh

      - name: Cleanup SSH material
        if: always()
        run: rm -f ~/.ssh/deploy_key ~/.ssh/known_hosts ~/.ssh/config
