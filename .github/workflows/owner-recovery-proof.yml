name: Owner-operated recovery proof

# Explicit owner-only encrypted data candidate/restore receipt. No canonical
# recipient/env change, independent certificate, log genesis or timer activation.
# Exact-main, serialized Actions is the only production entrypoint.

on:
  workflow_dispatch:
    inputs:
      operation:
        description: "Owner-only data backup/technical restore proof"
        required: true
        type: choice
        options:
          - run-owner-backup
          - certify-owner-restore
      owner_recipient:
        description: "Public native age recipient for one-shot owner backup; empty for restore certification"
        required: false
        type: string
      expected_main_sha:
        description: "Exact current 40-character main SHA"
        required: true
        type: string
      evidence_main_sha:
        description: "Earlier main SHA the owner key receipt (backup) or candidate (certification) is bound to; empty = this run's SHA. Accepted only if recovery code is unchanged since then"
        required: false
        type: string
      confirmation:
        description: "Exact owner-operation confirmation phrase from the runbook"
        required: true
        type: string
      recipient_sha256:
        description: "SHA-256 of the exact public age recipient; never enter the private identity"
        required: false
        type: string
      key_custody_attestation:
        description: "Exact OWNER_OPERATED_ONLINE_CUSTODY_ACCEPTED policy acknowledgement"
        required: false
        type: string
      evidence_ref:
        description: "Non-secret ticket or offline evidence reference"
        required: false
        type: string
      evidence_at_utc:
        description: "Exact signed-evidence timestamp in UTC RFC3339 format"
        required: false
        type: string
      offline_operator:
        description: "Owner principal; must equal the authenticated Actions actor"
        required: false
        type: string
      candidate_sha256:
        description: "Candidate digest emitted by run-owner-backup"
        required: false
        type: string
      offline_evidence_bundle_base64:
        description: "Base64 bundle emitted by an offline verifier; contains no private key"
        required: false
        type: string

permissions:
  contents: read
  actions: read

jobs:
  commission:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    environment: production
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    steps:
      - name: Checkout dispatched revision
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Require protected main-only production environment
        uses: ./.github/actions/assert-production-environment-protection
        with:
          github-token: ${{ github.token }}

      - name: Bind operation to the exact current main revision
        env:
          EXPECTED_MAIN_SHA: ${{ inputs.expected_main_sha }}
          IN_OWNER_RECIPIENT: ${{ inputs.owner_recipient }}
          IN_OPERATION: ${{ inputs.operation }}
          IN_CONFIRMATION: ${{ inputs.confirmation }}
          IN_RECIPIENT_SHA256: ${{ inputs.recipient_sha256 }}
          IN_KEY_ATTESTATION: ${{ inputs.key_custody_attestation }}
          IN_EVIDENCE_REF: ${{ inputs.evidence_ref }}
          IN_EVIDENCE_AT: ${{ inputs.evidence_at_utc }}
          IN_OFFLINE_OPERATOR: ${{ inputs.offline_operator }}
          IN_CANDIDATE_SHA256: ${{ inputs.candidate_sha256 }}
          IN_OFFLINE_EVIDENCE_BUNDLE: ${{ inputs.offline_evidence_bundle_base64 }}
          IN_EVIDENCE_MAIN_SHA: ${{ inputs.evidence_main_sha }}
        run: |
          set -euo pipefail
          [ "$GITHUB_REF" = refs/heads/main ] || exit 1
          [[ "$EXPECTED_MAIN_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
          git fetch --no-tags --depth=1 origin refs/heads/main
          CURRENT_MAIN_SHA="$(git rev-parse FETCH_HEAD)"
          [ "$GITHUB_SHA" = "$CURRENT_MAIN_SHA" ] && [ "$EXPECTED_MAIN_SHA" = "$CURRENT_MAIN_SHA" ] || exit 1
          # Evidence produced on an earlier main stays usable only while the
          # recovery code is byte-identical (scripts/backup/evidence-main-window.sh).
          EVIDENCE_MAIN_SHA="${IN_EVIDENCE_MAIN_SHA:-$GITHUB_SHA}"
          [[ "$EVIDENCE_MAIN_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
          if [ "$EVIDENCE_MAIN_SHA" != "$GITHUB_SHA" ]; then
            git fetch --no-tags --depth=400 origin refs/heads/main
            bash scripts/backup/evidence-main-window.sh "$EVIDENCE_MAIN_SHA" "$GITHUB_SHA" || {
              echo "::error::Evidence main SHA is not an unchanged-recovery-code ancestor of this main"
              exit 1
            }
          fi
          printf 'EVIDENCE_MAIN_SHA=%s\n' "$EVIDENCE_MAIN_SHA" >>"$GITHUB_ENV"
          case "$IN_OPERATION" in
            run-owner-backup)
              [ "$IN_CONFIRMATION" = CREATE_OWNER_BACKUP_ON_13_140_132_245 ] || exit 1
              [[ "$IN_OWNER_RECIPIENT" =~ ^age1[0-9a-z]{58}$ ]] || exit 1
              [ "$(printf '%s' "$IN_OWNER_RECIPIENT" | sha256sum | awk '{print $1}')" = "$IN_RECIPIENT_SHA256" ] || exit 1
              [ -z "$IN_CANDIDATE_SHA256" ] || exit 1
              ;;
            certify-owner-restore)
              [ "$IN_CONFIRMATION" = CERTIFY_OWNER_RESTORE_ON_13_140_132_245 ] || exit 1
              [ -z "$IN_OWNER_RECIPIENT" ] && [[ "$IN_CANDIDATE_SHA256" =~ ^[0-9a-f]{64}$ ]] || exit 1
              ;;
            *) exit 1 ;;
          esac
          [[ "$IN_RECIPIENT_SHA256" =~ ^[0-9a-f]{64}$ ]] || exit 1
          [ "$IN_KEY_ATTESTATION" = OWNER_OPERATED_ONLINE_CUSTODY_ACCEPTED ] || exit 1
          [ "$IN_OFFLINE_OPERATOR" = "$GITHUB_ACTOR" ] || exit 1
          [[ "$IN_EVIDENCE_REF" =~ ^[A-Za-z0-9][A-Za-z0-9._:/-]{0,199}$ ]] || exit 1
          [[ "$IN_EVIDENCE_AT" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$ ]] || exit 1
          [[ "$IN_OFFLINE_EVIDENCE_BUNDLE" =~ ^[A-Za-z0-9+/=]+$ ]] && [ "${#IN_OFFLINE_EVIDENCE_BUNDLE}" -le 60000 ] || exit 1

      - name: Setup pinned production SSH
        uses: ./.github/actions/setup-production-ssh
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
          server-host: ${{ secrets.SERVER_HOST }}
          known-hosts: ${{ secrets.SERVER_SSH_KNOWN_HOSTS }}

      - name: Create protected remote input stage
        run: |
          set -euo pipefail
          REMOTE_STAGE_DIR="$(ssh -o ConnectTimeout=30 -i ~/.ssh/deploy_key \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} \
            'set -euo pipefail; [ "$(id -u)" = 0 ]; umask 077; stage="$(mktemp -d /var/tmp/leaddrive-backup-commission-stage.XXXXXXXXXXXX)"; chmod 0700 "$stage"; [ "$(stat -c "%U:%G:%a" "$stage")" = root:root:700 ]; printf "%s" "$stage"')"
          [[ "$REMOTE_STAGE_DIR" =~ ^/var/tmp/leaddrive-backup-commission-stage\.[A-Za-z0-9]{6,64}$ ]] || {
            echo "::error::Production host returned an unsafe commissioning stage path"
            exit 1
          }
          printf 'REMOTE_STAGE_DIR=%s\n' "$REMOTE_STAGE_DIR" >>"$GITHUB_ENV"

      - name: Stage owner evidence and owner-only signer allowlist
        env:
          EVIDENCE_BUNDLE_BASE64: ${{ inputs.offline_evidence_bundle_base64 }}
          OFFLINE_ALLOWED_SIGNERS: ${{ secrets.BACKUP_OWNER_ALLOWED_SIGNERS }}
        run: |
          set -euo pipefail
          STAGE_DIR="$RUNNER_TEMP/leaddrive-backup-evidence-$GITHUB_RUN_ID"
          install -d -m 0700 "$STAGE_DIR"
          printf '%s' "$EVIDENCE_BUNDLE_BASE64" \
            | base64 --decode >"$STAGE_DIR/evidence.tar"
          ENTRIES="$(tar -tf "$STAGE_DIR/evidence.tar")"
          [ "$ENTRIES" = $'evidence.env\nevidence.env.sig' ] || {
            echo "::error::Offline evidence bundle has an unexpected layout"
            exit 1
          }
          tar -tvf "$STAGE_DIR/evidence.tar" \
            | awk '$1 !~ /^-/ { unsafe=1 } END { exit unsafe }' || {
              echo "::error::Offline evidence bundle contains a link or special file"
              exit 1
            }
          printf '%s\n' "$OFFLINE_ALLOWED_SIGNERS" >"$STAGE_DIR/allowed_signers"
          awk '
            NF != 3 || $1 !~ /^[A-Za-z0-9][A-Za-z0-9_.@-]{0,79}$/ \
              || $2 != "ssh-ed25519" || $3 !~ /^AAAA[A-Za-z0-9+\/=]+$/ { bad=1 }
            END { if (NR < 1 || bad) exit 1 }
          ' "$STAGE_DIR/allowed_signers" || {
            echo "::error::BACKUP_OWNER_ALLOWED_SIGNERS must contain strict principal/key records"
            exit 1
          }
          chmod 0600 "$STAGE_DIR/evidence.tar" "$STAGE_DIR/allowed_signers"
          scp -i ~/.ssh/deploy_key \
            "$STAGE_DIR/evidence.tar" \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:"$REMOTE_STAGE_DIR/evidence.tar"
          scp -i ~/.ssh/deploy_key \
            "$STAGE_DIR/allowed_signers" \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:"$REMOTE_STAGE_DIR/allowed-signers"

      - name: Stage and verify owner key-readability proof
        if: ${{ inputs.operation == 'run-owner-backup' }}
        env:
          RECIPIENT_SHA256: ${{ inputs.recipient_sha256 }}
        run: |
          set -euo pipefail
          STAGE_DIR="$RUNNER_TEMP/leaddrive-backup-evidence-$GITHUB_RUN_ID"
          tar -xOf "$STAGE_DIR/evidence.tar" evidence.env >"$STAGE_DIR/owner-key.env"
          tar -xOf "$STAGE_DIR/evidence.tar" evidence.env.sig >"$STAGE_DIR/owner-key.env.sig"
          chmod 0600 "$STAGE_DIR/owner-key.env" "$STAGE_DIR/owner-key.env.sig"
          node scripts/backup/owner-key-proof.mjs verify \
            "$STAGE_DIR/owner-key.env" "$STAGE_DIR/owner-key.env.sig" \
            "$STAGE_DIR/allowed_signers" "$RECIPIENT_SHA256" "$EVIDENCE_MAIN_SHA" "$GITHUB_ACTOR"
          install -m 0600 scripts/backup/owner-key-proof.mjs "$STAGE_DIR/owner-key-proof.mjs"
          for FILE in owner-key.env owner-key.env.sig owner-key-proof.mjs; do
            scp -i ~/.ssh/deploy_key "$STAGE_DIR/$FILE" \
              ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:"$REMOTE_STAGE_DIR/$FILE"
          done

      - name: Stage exact-main backup programs
        if: ${{ inputs.operation == 'run-owner-backup' }}
        run: |
          set -euo pipefail
          STAGE_DIR="$RUNNER_TEMP/leaddrive-backup-code-$GITHUB_RUN_ID"
          install -d -m 0700 "$STAGE_DIR"
          LC_ALL=C sort -cu ops/backup/recovery-program-set.files
          mapfile -t RECOVERY_PROGRAM_FILES < ops/backup/recovery-program-set.files
          scripts/backup/hash-recovery-db-contract.sh --manifest "$GITHUB_WORKSPACE" \
            >"$STAGE_DIR/recovery-db-contract.tsv"
          RECOVERY_DB_CONTRACT_SHA="$(sha256sum "$STAGE_DIR/recovery-db-contract.tsv" | awk '{print $1}')"
          [ "$RECOVERY_DB_CONTRACT_SHA" = \
            "$(scripts/backup/hash-recovery-db-contract.sh "$GITHUB_WORKSPACE")" ] || {
            echo "::error::Recovery DB contract manifest is inconsistent"
            exit 1
          }
          [[ "$RECOVERY_DB_CONTRACT_SHA" =~ ^[0-9a-f]{64}$ ]] || {
            echo "::error::Recovery DB contract digest is invalid"
            exit 1
          }
          printf '%s\n' "$RECOVERY_DB_CONTRACT_SHA" >"$STAGE_DIR/recovery-db-contract.sha256"
          tar -C . -cf "$STAGE_DIR/backup-code.tar" \
            ops/backup/recovery-program-set.files \
            "${RECOVERY_PROGRAM_FILES[@]}" \
            -C "$STAGE_DIR" recovery-db-contract.tsv recovery-db-contract.sha256
          EXPECTED_ENTRIES="$(printf '%s\n' \
            ops/backup/recovery-program-set.files \
            "${RECOVERY_PROGRAM_FILES[@]}" \
            recovery-db-contract.tsv \
            recovery-db-contract.sha256)"
          [ "$(tar -tf "$STAGE_DIR/backup-code.tar")" = "$EXPECTED_ENTRIES" ] || {
            echo "::error::Exact-main backup program bundle has an unexpected layout"
            exit 1
          }
          EXPECTED_SET_SHA="$(scripts/backup/hash-recovery-program-set.sh "$GITHUB_WORKSPACE")"
          [[ "$EXPECTED_SET_SHA" =~ ^[0-9a-f]{64}$ ]] || {
            echo "::error::Recovery program set digest is invalid"
            exit 1
          }
          chmod 0600 "$STAGE_DIR/backup-code.tar"
          scp -i ~/.ssh/deploy_key \
            "$STAGE_DIR/backup-code.tar" \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:"$REMOTE_STAGE_DIR/backup-code.tar"

      - name: Execute one bounded commissioning stage
        env:
          OWNER_RECIPIENT: ${{ inputs.owner_recipient }}
          OPERATION: ${{ inputs.operation }}
          CONFIRMATION: ${{ inputs.confirmation }}
          EXPECTED_MAIN_SHA: ${{ inputs.expected_main_sha }}
          RECIPIENT_SHA256: ${{ inputs.recipient_sha256 }}
          KEY_ATTESTATION: ${{ inputs.key_custody_attestation }}
          EVIDENCE_REF: ${{ inputs.evidence_ref }}
          EVIDENCE_AT: ${{ inputs.evidence_at_utc }}
          OFFLINE_OPERATOR: ${{ inputs.offline_operator }}
          CANDIDATE_SHA256: ${{ inputs.candidate_sha256 }}
        run: |
          set -euo pipefail
          # OpenSSH joins its command arguments into one remote shell string.
          # Passing the values as separate local argv entries therefore drops
          # empty inputs and shifts the server-side positional parameters.
          # Quote every value into one explicit command so empty optional
          # evidence fields remain present and untrusted text stays inert.
          REMOTE_COMMAND="bash -s --"
          for ARG in \
            "$OPERATION" "$CONFIRMATION" "$EXPECTED_MAIN_SHA" \
            "$GITHUB_ACTOR" "$GITHUB_RUN_ID" "$RECIPIENT_SHA256" \
            "$KEY_ATTESTATION" "$EVIDENCE_REF" "$EVIDENCE_AT" \
            "$OFFLINE_OPERATOR" "$CANDIDATE_SHA256" "$REMOTE_STAGE_DIR" "$OWNER_RECIPIENT" \
            "$EVIDENCE_MAIN_SHA"; do
            printf -v QUOTED_ARG '%q' "$ARG"
            REMOTE_COMMAND+=" $QUOTED_ARG"
          done
          ssh -o ConnectTimeout=30 -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=4 -i ~/.ssh/deploy_key \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} \
            "$REMOTE_COMMAND" \
            < scripts/backup/commission-production-backup.sh

      - name: Cleanup
        if: always()
        run: |
          if [ -f ~/.ssh/deploy_key ]; then
            if [[ "${REMOTE_STAGE_DIR:-}" =~ ^/var/tmp/leaddrive-backup-commission-stage\.[A-Za-z0-9]{6,64}$ ]]; then
              ssh -o ConnectTimeout=15 -i ~/.ssh/deploy_key \
                ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} \
                "rm -rf -- '$REMOTE_STAGE_DIR'" >/dev/null 2>&1 || true
            fi
          fi
          rm -f ~/.ssh/deploy_key
          rm -rf -- "$RUNNER_TEMP/leaddrive-backup-evidence-$GITHUB_RUN_ID"
          rm -rf -- "$RUNNER_TEMP/leaddrive-backup-code-$GITHUB_RUN_ID"
          rm -f -- "$RUNNER_TEMP/leaddrive-healthchecks-$GITHUB_RUN_ID.env"
