name: Workforce manager Today browser evidence

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "scripts/workforce-crm-lifecycle-evidence.mjs"
      - "src/lib/crm-product-availability.ts"
      - ".github/workflows/workforce-manager-today-browser-evidence.yml"
      - "scripts/workforce-manager-today-browser-evidence.mjs"
      - "scripts/workforce-native-browser-zoom.mjs"
      - "scripts/ci/fixtures/workforce-native-zoom-extension/**"
      - "src/app/layout.tsx"
      - "src/app/globals.css"
      - "src/lib/workforce/actor.ts"
      - "src/lib/workforce/employee-today.ts"
      - "src/lib/workforce/timesheet*.ts"
      - "scripts/_rls.mjs"
      - "scripts/ci/fixtures/workforce-manager-today-browser.sql"
      - "scripts/ci/fixtures/workforce-manager-today-snapshot-browser.sql"
      - "src/lib/workforce/snapshot-writer.ts"
      - "src/lib/workforce/policy-definition.ts"
      - "src/lib/workforce/policy-resolution.ts"
      - "src/lib/workforce/geofence-evaluation.ts"
      - "prisma/migrations/20260828223000_workforce_h3_foundation/migration.sql"
      - "prisma/migrations/20260830110000_workforce_shift_default_timeline/migration.sql"
      - "prisma/migrations/20260830120000_workforce_workday_schedule_snapshots/migration.sql"
      - "prisma/migrations/20260830130000_workforce_employee_team_membership_history/migration.sql"
      - "prisma/migrations/20260901080000_workforce_team_default_shift_timeline/migration.sql"
      - "src/__tests__/workforce-manager-today-browser-evidence*.test.*"
      - "src/app/(dashboard)/workforce/page.tsx"
      - "src/components/workforce/workforce-manager-today.tsx"
      - "src/components/workforce/workforce-workbench.tsx"
      - "src/components/ui/button.tsx"
      - "src/components/ui/badge.tsx"
      - "src/app/api/v1/workforce/today/route.ts"
      - "src/lib/workforce/manager-today.ts"
      - "src/lib/workforce/today-read-access.ts"
      - "src/lib/workforce/exception*.ts"
      - "src/lib/workforce/access*.ts"
      - "src/lib/workforce/shift*.ts"
      - "src/lib/workforce/team-membership.ts"
      - "src/lib/workforce/calendar.ts"
      - "src/lib/workforce/granular-access-rollout.ts"
      - "src/lib/workforce/sensitive-response.ts"
      - "src/lib/with-workforce-rls-auth.ts"
      - "src/lib/with-rls.ts"
      - "src/lib/auth.ts"
      - "src/lib/api-auth.ts"
      - "src/lib/permissions.ts"
      - "src/lib/user-module-access.ts"
      - "src/lib/mtm-settings.ts"
      - "src/lib/mtm/mobile-week.ts"
      - "src/lib/timezone.ts"
      - "src/lib/modules.ts"
      - "src/lib/tenant-capabilities.ts"
      - "src/components/providers.tsx"
      - "src/app/(dashboard)/layout.tsx"
      - "src/proxy.ts"
      - "messages/*.json"
      - "prisma/schema.prisma"
  workflow_dispatch:

concurrency:
  group: workforce-manager-today-browser-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  manager-today-browser:
    name: "CRM lifecycle — Authenticated Workforce manager Today browser evidence"
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CI: "true"
      NODE_ENV: development
      NODE_OPTIONS: --max-old-space-size=6144
      NEXT_TELEMETRY_DISABLED: "1"
      LEADDRIVE_DISABLE_SERVICE_WORKER: "1"
      WF_MANAGER_TODAY_BROWSER: "1"
      WF_MANAGER_TODAY_BROWSER_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      WF_MANAGER_TODAY_BROWSER_OUTPUT_DIR: artifacts/workforce-manager-today-browser
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: workforce_manager_today_browser
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432
        options: >-
          --health-cmd "pg_isready -U postgres -d workforce_manager_today_browser"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      # The normal pull_request checkout is GitHub's candidate/base merge.
      # Preserve the distinct PR head and GITHUB_SHA in the evidence receipt.
      - name: Checkout candidate
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Resolve isolated ports and masked application secrets
        env:
          PG_PORT: ${{ job.services.postgres.ports['5432'] }}
        shell: bash
        run: |
          test -n "$PG_PORT" || { echo "::error::Postgres service port is missing"; exit 1; }
          [[ "$WF_MANAGER_TODAY_BROWSER_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
          APP_PORT="$(python3 -c 'import socket; s = socket.socket(); s.bind(("127.0.0.1", 0)); print(s.getsockname()[1])')"
          WF_DATABASE_PASSWORD="$(openssl rand -hex 24)"
          WF_AUTH_SECRET="$(openssl rand -hex 32)"
          WF_PII_SECRET="$(openssl rand -hex 32)"
          echo "::add-mask::$WF_DATABASE_PASSWORD"
          echo "::add-mask::$WF_AUTH_SECRET"
          echo "::add-mask::$WF_PII_SECRET"
          {
            echo "ADMIN_DATABASE_URL=postgresql://postgres:postgres@127.0.0.1:${PG_PORT}/workforce_manager_today_browser"
            echo "EVENT_PLATFORM_TEST_DATABASE_URL=postgresql://postgres:postgres@127.0.0.1:${PG_PORT}/workforce_manager_today_browser"
            echo "DATABASE_URL=postgresql://wf_manager_today_browser:${WF_DATABASE_PASSWORD}@127.0.0.1:${PG_PORT}/workforce_manager_today_browser"
            echo "WF_MANAGER_TODAY_BROWSER_DATABASE_PASSWORD=$WF_DATABASE_PASSWORD"
            echo "APP_PORT=$APP_PORT"
            echo "NEXTAUTH_URL=http://localhost:${APP_PORT}"
            echo "AUTH_URL=http://localhost:${APP_PORT}"
            echo "APP_URL=http://localhost:${APP_PORT}"
            echo "NEXT_PUBLIC_APP_URL=http://localhost:${APP_PORT}"
            echo "NEXT_PUBLIC_MARKETING_URL=http://localhost:${APP_PORT}"
            echo "WF_MANAGER_TODAY_BROWSER_BASE_URL=http://localhost:${APP_PORT}"
            echo "WF_MANAGER_TODAY_BROWSER_APP_LOG=${RUNNER_TEMP}/workforce-manager-today-browser-app.log"
            echo "AUTH_SECRET=$WF_AUTH_SECRET"
            echo "NEXTAUTH_SECRET=$WF_AUTH_SECRET"
            echo "TENANT_PII_MASTER_KEY=$WF_PII_SECRET"
          } >> "$GITHUB_ENV"
          mkdir -p "$WF_MANAGER_TODAY_BROWSER_OUTPUT_DIR"
          python3 - <<'PY'
          import json, os, pathlib
          receipt = {
              "stage": "workflow-preparing",
              "headSha": os.environ["WF_MANAGER_TODAY_BROWSER_HEAD_SHA"],
              "ciSha": os.environ["GITHUB_SHA"],
              "runId": os.environ["GITHUB_RUN_ID"],
              "runAttempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "runtime": "ephemeral-next-dev",
              "productionMutation": False,
          }
          target = pathlib.Path(os.environ["WF_MANAGER_TODAY_BROWSER_OUTPUT_DIR"]) / "workflow-context.json"
          target.write_text(json.dumps(receipt, indent=2) + "\n")
          PY

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm

      - name: Install candidate dependencies
        run: npm ci

      - name: Create candidate schema and restricted application role
        shell: bash
        run: |
          psql "$ADMIN_DATABASE_URL" -X -v ON_ERROR_STOP=1 \
            -c 'CREATE EXTENSION IF NOT EXISTS vector'
          DATABASE_URL="$ADMIN_DATABASE_URL" npx prisma db push --skip-generate
          psql "$ADMIN_DATABASE_URL" -X -v ON_ERROR_STOP=1 \
            --set=app_password="$WF_MANAGER_TODAY_BROWSER_DATABASE_PASSWORD" \
            -f scripts/ci/fixtures/workforce-manager-today-browser.sql
          # Manager-only snapshot guards; the shared report fixture is unchanged.
          psql "$ADMIN_DATABASE_URL" -X -v ON_ERROR_STOP=1 \
            -f scripts/ci/fixtures/workforce-manager-today-snapshot-browser.sql
          npx prisma generate

      - name: Install Chromium on hosted Ubuntu
        run: npx playwright install --with-deps chromium

      - name: Verify shipped CRM lifecycle (today)
        shell: bash
        run: |
          test "$CI" = true && test "$WF_MANAGER_TODAY_BROWSER" = 1
          # The log stays transient on the ephemeral runner. The harness emits
          # sanitized JSON/screenshots; cookies, passwords and raw logs are not
          # uploaded as evidence.
          node node_modules/next/dist/bin/next dev --hostname 127.0.0.1 --port "$APP_PORT" > "$WF_MANAGER_TODAY_BROWSER_APP_LOG" 2>&1 &
          WF_APP_PID=$!
          cleanup() {
            kill "$WF_APP_PID" 2>/dev/null || true
            wait "$WF_APP_PID" 2>/dev/null || true
          }
          trap cleanup EXIT
          for attempt in $(seq 1 90); do
            if curl -fsS --max-time 5 "${WF_MANAGER_TODAY_BROWSER_BASE_URL}/api/v1/ping" >/dev/null 2>&1; then
              break
            fi
            if ! kill -0 "$WF_APP_PID" 2>/dev/null || [ "$attempt" -eq 90 ]; then
              echo "::error::Isolated manager Today browser application did not become ready"
              exit 1
            fi
            sleep 2
          done
          node scripts/workforce-crm-lifecycle-evidence.mjs today

      - name: Preserve non-secret workflow failure receipt
        if: failure()
        shell: bash
        run: |
          mkdir -p "$WF_MANAGER_TODAY_BROWSER_OUTPUT_DIR"
          python3 - <<'PY'
          import json, os, pathlib
          receipt = {
              "status": "FAILED",
              "headSha": os.environ["WF_MANAGER_TODAY_BROWSER_HEAD_SHA"],
              "ciSha": os.environ["GITHUB_SHA"],
              "runId": os.environ["GITHUB_RUN_ID"],
              "runAttempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "runtime": "ephemeral-next-dev",
          }
          target = pathlib.Path(os.environ["WF_MANAGER_TODAY_BROWSER_OUTPUT_DIR"]) / "workflow-failure.json"
          target.write_text(json.dumps(receipt, indent=2) + "\n")
          PY

      - name: Upload sanitized manager Today evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workforce-manager-today-browser-${{ github.sha }}-${{ github.run_attempt }}
          path: artifacts/workforce-manager-today-browser
          if-no-files-found: error
          retention-days: 14
