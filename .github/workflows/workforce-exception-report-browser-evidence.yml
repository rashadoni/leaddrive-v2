          node node_modules/next/dist/bin/next dev --hostname 127.0.0.1 --port "$APP_PORT" > "$WF_EMPLOYEE_CORRECTION_BROWSER_APP_LOG" 2>&1 &
          WF_APP_PID=$!
          cleanup() {
