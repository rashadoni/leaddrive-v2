        run: |
          mkdir -p "$WF_EMPLOYEE_CORRECTION_BROWSER_OUTPUT_DIR"
          python3 - <<'PY'
          import json, os, pathlib
          receipt = {
              "status": "FAILED",
              "headSha": os.environ["WF_EMPLOYEE_CORRECTION_BROWSER_HEAD_SHA"],
              "ciSha": os.environ["GITHUB_SHA"],
              "runId": os.environ["GITHUB_RUN_ID"],
              "runAttempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "runtime": "ephemeral-next-dev",
          }
          target = pathlib.Path(os.environ["WF_EMPLOYEE_CORRECTION_BROWSER_OUTPUT_DIR"]) / "workflow-failure.json"
          target.write_text(json.dumps(receipt, indent=2) + "\n")
          PY

      - name: Upload sanitized employee correction evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workforce-employee-correction-browser-${{ github.sha }}-${{ github.run_attempt }}
          path: artifacts/workforce-employee-correction-browser
          if-no-files-found: error
          retention-days: 14
