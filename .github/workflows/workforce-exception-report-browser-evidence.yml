            -f scripts/ci/fixtures/workforce-manager-today-browser.sql
          psql "$ADMIN_DATABASE_URL" -X -v ON_ERROR_STOP=1 \
            -f scripts/ci/fixtures/workforce-exception-classification-browser.sql
          npx prisma generate

      - name: Install Chromium on hosted Ubuntu
        run: npx playwright install --with-deps chromium

      - name: Run real authenticated aggregate report scenarios
        shell: bash
