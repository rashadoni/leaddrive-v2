name: Ensure Meta App Review user

# Creates or rotates one dedicated admin inside the existing leaddrive
# sandbox tenant. The generated password never crosses GitHub Actions.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  ensure-user:
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pinned production SSH
        uses: ./.github/actions/setup-production-ssh
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
          server-host: ${{ secrets.SERVER_HOST }}
          known-hosts: ${{ secrets.SERVER_SSH_KNOWN_HOSTS }}

      - name: Upload locked reviewer script
        run: |
          ssh -o ConnectTimeout=30 -i ~/.ssh/deploy_key \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} \
            "mkdir -p /opt/leaddrive-v2/.next/standalone/scripts"
          scp -o ConnectTimeout=30 -i ~/.ssh/deploy_key \
            scripts/_rls.mjs scripts/password-policy.mjs scripts/ensure-meta-review-user.mjs \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/opt/leaddrive-v2/.next/standalone/scripts/

      - name: Create or rotate reviewer
        run: |
          ssh -o ConnectTimeout=30 -o ServerAliveInterval=15 -i ~/.ssh/deploy_key \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} \
            "bash -s" <<'REMOTE'
          set -euo pipefail
          APP_DIR="/opt/leaddrive-v2"
          APP_ENV_FILE="${APP_ENV_FILE:-/etc/leaddrive/app.env}"
          SCRIPT="$APP_DIR/.next/standalone/scripts/ensure-meta-review-user.mjs"
          [ -f "$SCRIPT" ] || { echo "FATAL: reviewer script missing"; exit 1; }
          [ -f "$APP_ENV_FILE" ] || { echo "FATAL: canonical app env missing"; exit 1; }

          read_env() {
            sed -n "s/^[[:space:]]*\(export[[:space:]]\+\)\?$1[[:space:]]*=[[:space:]]*//p" "$APP_ENV_FILE" \
              | head -1 | sed -e 's/^"\(.*\)"$/\1/' -e "s/^'\(.*\)'\$/\1/"
          }
          DATABASE_URL="$(read_env DATABASE_URL)"
          [ -n "$DATABASE_URL" ] || { echo "FATAL: DATABASE_URL missing"; exit 1; }

          cd "$APP_DIR"
          DATABASE_URL="$DATABASE_URL" CONFIRM_PROD="meta-review:leaddrive" \
            node "$SCRIPT"
          REMOTE

      - name: Smoke public endpoint
        run: |
          curl --fail --silent --show-error --max-time 15 \
            https://app.leaddrivecrm.org/api/v1/ping >/dev/null

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
