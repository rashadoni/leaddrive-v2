name: Set social app secrets on prod

# Operator job: deliver the TikTok Login Kit and/or Instagram-Login app
# credentials from GitHub repo secrets to the canonical production app env, then
# restart PM2 with the updated environment.
#
# Why this path: TikTok's OAuth start route reads TIKTOK_CLIENT_KEY/SECRET
# from env only (no per-tenant card exists), and a shared Instagram-Login app
# can also live in env. Secrets never appear in logs — the job prints only
# which keys were set/skipped.
#
# Usage:
#   1. Repo Settings → Secrets and variables → Actions → add any of:
#      TIKTOK_CLIENT_KEY, TIKTOK_CLIENT_SECRET,
#      INSTAGRAM_APP_ID, INSTAGRAM_APP_SECRET, INSTAGRAM_WEBHOOK_VERIFY_TOKEN,
#      GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET, YOUTUBE_REDIRECT_URI,
#      TWITTER_CLIENT_ID, TWITTER_CLIENT_SECRET, TWITTER_REDIRECT_URI
#   2. Run this workflow (dispatch only — it is inert without the secrets;
#      keys whose secret is unset/empty are skipped, existing app-env values are
#      REPLACED so rotation works).

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  set-secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Setup pinned production SSH
        uses: ./.github/actions/setup-production-ssh
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
          server-host: ${{ secrets.SERVER_HOST }}
          known-hosts: ${{ secrets.SERVER_SSH_KNOWN_HOSTS }}

      - name: Write app secrets to canonical app env and restart PM2
        env:
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          INSTAGRAM_APP_ID: ${{ secrets.INSTAGRAM_APP_ID }}
          INSTAGRAM_APP_SECRET: ${{ secrets.INSTAGRAM_APP_SECRET }}
          INSTAGRAM_WEBHOOK_VERIFY_TOKEN: ${{ secrets.INSTAGRAM_WEBHOOK_VERIFY_TOKEN }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          YOUTUBE_REDIRECT_URI: ${{ secrets.YOUTUBE_REDIRECT_URI }}
          TWITTER_CLIENT_ID: ${{ secrets.TWITTER_CLIENT_ID }}
          TWITTER_CLIENT_SECRET: ${{ secrets.TWITTER_CLIENT_SECRET }}
          TWITTER_REDIRECT_URI: ${{ secrets.TWITTER_REDIRECT_URI }}
        run: |
          ssh -o ConnectTimeout=30 -o ServerAliveInterval=15 -i ~/.ssh/deploy_key \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} \
            "TIKTOK_CLIENT_KEY='$TIKTOK_CLIENT_KEY' TIKTOK_CLIENT_SECRET='$TIKTOK_CLIENT_SECRET' INSTAGRAM_APP_ID='$INSTAGRAM_APP_ID' INSTAGRAM_APP_SECRET='$INSTAGRAM_APP_SECRET' INSTAGRAM_WEBHOOK_VERIFY_TOKEN='$INSTAGRAM_WEBHOOK_VERIFY_TOKEN' GOOGLE_CLIENT_ID='$GOOGLE_CLIENT_ID' GOOGLE_CLIENT_SECRET='$GOOGLE_CLIENT_SECRET' YOUTUBE_REDIRECT_URI='$YOUTUBE_REDIRECT_URI' TWITTER_CLIENT_ID='$TWITTER_CLIENT_ID' TWITTER_CLIENT_SECRET='$TWITTER_CLIENT_SECRET' TWITTER_REDIRECT_URI='$TWITTER_REDIRECT_URI' bash -s" <<'REMOTE'
          set -euo pipefail
          APP_DIR="/opt/leaddrive-v2"
          APP_ENV_FILE="${APP_ENV_FILE:-/etc/leaddrive/app.env}"
          ENV="$APP_ENV_FILE"
          ENV_DIR="$(dirname -- "$ENV")"
          APP_ENV_LOCK_FILE="${APP_ENV_LOCK_FILE:-/run/lock/leaddrive-app-env.lock}"
          [ -d "$ENV_DIR" ] && [ ! -L "$ENV_DIR" ] || { echo "FATAL: app env parent $ENV_DIR missing or is a symlink"; exit 1; }
          [ "$(stat -c '%U:%G' "$ENV_DIR")" = "root:root" ] || { echo "FATAL: app env parent must be owned by root:root"; exit 1; }
          ENV_DIR_MODE="$(stat -c '%a' "$ENV_DIR")"
          (( (8#$ENV_DIR_MODE & 8#022) == 0 )) || { echo "FATAL: app env parent must not be group- or world-writable"; exit 1; }
          [ -f "$ENV" ] && [ ! -L "$ENV" ] || { echo "FATAL: canonical app env $ENV missing or is a symlink"; exit 1; }
          [ "$(stat -c '%U:%G:%a' "$ENV")" = "root:root:600" ] || { echo "FATAL: canonical app env must be root:root mode 0600"; exit 1; }
          [ -d "$(dirname -- "$APP_ENV_LOCK_FILE")" ] || { echo "FATAL: app-env lock parent missing"; exit 1; }
          exec 9>"$APP_ENV_LOCK_FILE"
          flock -w 120 9 || { echo "FATAL: another canonical app-env update is running"; exit 1; }

          changed_keys=()
          ENV_STAGE=""
          cleanup() { [ -z "$ENV_STAGE" ] || rm -f -- "$ENV_STAGE"; }
          trap cleanup EXIT
          ensure_env_stage() {
            [ -n "$ENV_STAGE" ] && return
            ENV_STAGE="$(mktemp "$ENV_DIR/.app.env.social.XXXXXX")"
            cp --preserve=mode,ownership "$ENV" "$ENV_STAGE"
          }
          upsert_env() {
            local key="$1" value="$2"
            if [ -z "$value" ]; then
              echo "$key: secret not set — skipped"
              return
            fi
            # Replace-or-append so key rotation works; values never echo.
            ensure_env_stage
            sed -i "/^[[:space:]]*\(export[[:space:]]\+\)\?${key}=/d" "$ENV_STAGE"
            printf '%s=%s\n' "$key" "$value" >> "$ENV_STAGE"
            echo "$key: staged for canonical app env"
            changed_keys+=("$key")
          }
          upsert_env TIKTOK_CLIENT_KEY "$TIKTOK_CLIENT_KEY"
          upsert_env TIKTOK_CLIENT_SECRET "$TIKTOK_CLIENT_SECRET"
          upsert_env INSTAGRAM_APP_ID "$INSTAGRAM_APP_ID"
          upsert_env INSTAGRAM_APP_SECRET "$INSTAGRAM_APP_SECRET"
          upsert_env INSTAGRAM_WEBHOOK_VERIFY_TOKEN "$INSTAGRAM_WEBHOOK_VERIFY_TOKEN"
          upsert_env GOOGLE_CLIENT_ID "$GOOGLE_CLIENT_ID"
          upsert_env GOOGLE_CLIENT_SECRET "$GOOGLE_CLIENT_SECRET"
          upsert_env YOUTUBE_REDIRECT_URI "$YOUTUBE_REDIRECT_URI"
          upsert_env TWITTER_CLIENT_ID "$TWITTER_CLIENT_ID"
          upsert_env TWITTER_CLIENT_SECRET "$TWITTER_CLIENT_SECRET"
          upsert_env TWITTER_REDIRECT_URI "$TWITTER_REDIRECT_URI"

          if [ "${#changed_keys[@]}" -gt 0 ]; then
            # ENV_STAGE was created in $ENV_DIR, so this replace cannot cross
            # a filesystem boundary or leave a partially written app env.
            mv -f "$ENV_STAGE" "$ENV"
            ENV_STAGE=""
            # PM2 inherited env at start; --update-env merges the current shell
            # env over it — the vars are already exported in this ssh session.
            export TIKTOK_CLIENT_KEY TIKTOK_CLIENT_SECRET INSTAGRAM_APP_ID INSTAGRAM_APP_SECRET INSTAGRAM_WEBHOOK_VERIFY_TOKEN GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET YOUTUBE_REDIRECT_URI TWITTER_CLIENT_ID TWITTER_CLIENT_SECRET TWITTER_REDIRECT_URI
            pm2 restart leaddrive-v2 --update-env >/dev/null
            echo "PM2 restarted with updated env (${changed_keys[*]})"
            echo "--- health ---"
            sleep 12
            curl -sS -o /dev/null -w "ping HTTP %{http_code}\n" --max-time 15 \
              "https://app.leaddrivecrm.org/api/v1/ping" || true
          else
            echo "No secrets provided — nothing changed, PM2 restart skipped"
          fi
          REMOTE

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
