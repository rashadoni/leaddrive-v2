name: Voice Realtime section evaluation (retired)

# The former live evaluator called the OpenAI Realtime API. It stays as an
# explicit failing tombstone so an old runbook or bookmark cannot silently
# spend against, or validate, the provider removed from browser voice.
on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-latest
    steps:
      - name: Refuse the retired evaluator
        run: |
          echo "::error::The OpenAI Realtime evaluator is retired; add a Gemini Live evaluator before re-enabling."
          exit 1
