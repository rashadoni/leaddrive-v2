name: Ensure Social Monitoring smoke user

# Creates or refreshes one dedicated, read-only production smoke account.
# The server generates a policy-compliant temporary password, hashes it with
# bcrypt cost 12, and writes it to a unique root-only file. No credential or
# password hash crosses GitHub Actions; the job log contains only the file path.
on:
  workflow_dispatch:
    inputs:
      slug:
        description: "Tenant slug"
        required: true
        default: "brandprotection"
      email:
        description: "Dedicated social-smoke email inside the tenant"
        required: true
        default: "social-smoke@brandprotection.leaddrivecrm.org"

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  ensure-user:
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Validate inputs
        env:
          IN_SLUG: ${{ inputs.slug }}
          IN_EMAIL: ${{ inputs.email }}
        run: |
          SLUG_RE='^[a-z0-9]([a-z0-9-]{0,78}[a-z0-9])?$'
          EMAIL_RE='^social-smoke@[A-Za-z0-9]([A-Za-z0-9-]{0,61}[A-Za-z0-9])?(\.[A-Za-z0-9]([A-Za-z0-9-]{0,61}[A-Za-z0-9])?)+$'
          [[ "$IN_SLUG" =~ $SLUG_RE ]] \
            || { echo "FATAL: slug has an unexpected shape"; exit 1; }
          [[ "$IN_EMAIL" =~ $EMAIL_RE ]] \
            || { echo "FATAL: email must use the social-smoke local part"; exit 1; }

      - name: Setup pinned production SSH
        uses: ./.github/actions/setup-production-ssh
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
          server-host: ${{ secrets.SERVER_HOST }}
          known-hosts: ${{ secrets.SERVER_SSH_KNOWN_HOSTS }}

      - name: Upload script to server
        run: |
          ssh -o ConnectTimeout=30 -i ~/.ssh/deploy_key \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} \
            "mkdir -p /opt/leaddrive-v2/.next/standalone/scripts"
          scp -o ConnectTimeout=30 -i ~/.ssh/deploy_key \
            scripts/_rls.mjs scripts/password-policy.mjs scripts/ensure-social-smoke-user.mjs \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/opt/leaddrive-v2/.next/standalone/scripts/

      - name: Run on server
        env:
          SMOKE_SLUG: ${{ inputs.slug }}
          SMOKE_EMAIL: ${{ inputs.email }}
        run: |
          ssh -o ConnectTimeout=30 -o ServerAliveInterval=15 -i ~/.ssh/deploy_key \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} \
            "SMOKE_SLUG='$SMOKE_SLUG' SMOKE_EMAIL='$SMOKE_EMAIL' bash -s" <<'REMOTE'
          set -euo pipefail
          APP_DIR="/opt/leaddrive-v2"
          APP_ENV_FILE="${APP_ENV_FILE:-/etc/leaddrive/app.env}"
          SCRIPT="$APP_DIR/.next/standalone/scripts/ensure-social-smoke-user.mjs"
          [ -f "$SCRIPT" ] || { echo "FATAL: $SCRIPT missing"; exit 1; }
          [ -f "$APP_ENV_FILE" ] || { echo "FATAL: canonical app env missing"; exit 1; }

          read_env() {
            sed -n "s/^[[:space:]]*\(export[[:space:]]\+\)\?$1[[:space:]]*=[[:space:]]*//p" "$APP_ENV_FILE" \
              | head -1 | sed -e 's/^"\(.*\)"$/\1/' -e "s/^'\(.*\)'\$/\1/"
          }
          DATABASE_URL="$(read_env DATABASE_URL)"
          [ -n "$DATABASE_URL" ] || { echo "FATAL: DATABASE_URL not found in canonical app env"; exit 1; }

          cd "$APP_DIR"
          DATABASE_URL="$DATABASE_URL" CONFIRM_PROD=1 \
          SMOKE_SLUG="$SMOKE_SLUG" SMOKE_EMAIL="$SMOKE_EMAIL" node "$SCRIPT"
          REMOTE

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
