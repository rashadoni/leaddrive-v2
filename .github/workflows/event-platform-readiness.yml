name: Event platform read-only readiness

on:
  workflow_dispatch:
    inputs:
      admission_mode:
        description: Read-only inventory admission; default still requires the current-main live marker.
        type: choice
        options: [current-main, deployed-release]
        default: current-main
      deployed_sha:
        description: Optional canonical live SHA; requires deployed-release mode and its successful normal deploy run.
        type: string
        default: ''
      deploy_run_id:
        description: Optional successful push/main deploy.yml run ID for exactly deployed_sha.
        type: string
        default: ''

permissions:
  contents: read
  actions: read

jobs:
  inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: production
    # Keep the shared lock through SSH/inventory, without replacing another
    # pending deploy when this observability-only job enters the queue.
    concurrency:
      group: production-deploy
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Require protected production route
        uses: ./.github/actions/assert-production-environment-protection
        with:
          github-token: ${{ github.token }}

      - name: Admit current main and verified live release
        id: admission
        env:
          GH_TOKEN: ${{ github.token }}
          INSPECTION_ADMISSION_MODE: ${{ inputs.admission_mode }}
          INSPECTION_DEPLOYED_SHA: ${{ inputs.deployed_sha }}
          INSPECTION_DEPLOY_RUN_ID: ${{ inputs.deploy_run_id }}
        run: |
          set -euo pipefail
          EXPECTED_DEPLOY_SHA="$(node scripts/event-platform/admit-production-inventory.mjs)"
          [[ "$EXPECTED_DEPLOY_SHA" =~ ^[0-9a-f]{40}$ ]]
          printf 'expected_deploy_sha=%s\n' "$EXPECTED_DEPLOY_SHA" >> "$GITHUB_OUTPUT"
          bash -n scripts/event-platform/inspect-production.sh
          node --test --test-concurrency=1 scripts/event-platform/inspect-production.test.mjs scripts/event-platform/inventory-admission.test.mjs scripts/event-platform/inventory-admission-policy.test.mjs

      - name: Setup pinned production SSH
        uses: ./.github/actions/setup-production-ssh
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
          server-host: ${{ secrets.SERVER_HOST }}
          known-hosts: ${{ secrets.SERVER_SSH_KNOWN_HOSTS }}

      - name: Inspect aggregate readiness without changing production
        env:
          EXPECTED_DEPLOY_SHA: ${{ steps.admission.outputs.expected_deploy_sha }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_DEPLOY_SHA" =~ ^[0-9a-f]{40}$ ]]
          ssh -o ConnectTimeout=20 -i ~/.ssh/deploy_key \
            "$SERVER_USER@$SERVER_HOST" \
            "EXPECTED_DEPLOY_SHA='$EXPECTED_DEPLOY_SHA' bash -s" \
            < scripts/event-platform/inspect-production.sh

      - name: Cleanup SSH material
        if: always()
        run: rm -f ~/.ssh/deploy_key ~/.ssh/known_hosts ~/.ssh/config
