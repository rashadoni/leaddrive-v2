name: Identity snapshot PostgreSQL contract

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/identity/**'
      - 'scripts/server-deploy.sh'
      - 'scripts/booking/release-contract.test.mjs'
      - '.github/workflows/deploy.yml'
      - 'src/lib/mtm/attendance-identity-error.ts'
      - 'src/lib/mtm/attendance-request-http.ts'
      - 'src/components/mtm/attendance-add-employee.tsx'
      - 'src/__tests__/mtm-attendance-identity-error.test.ts'
      - 'src/__tests__/mtm-attendance-employees-ui.test.ts'
      - '.github/workflows/identity-snapshot-contract.yml'
      - '.github/workflows/identity-runtime-commission.yml'
      - 'prisma/schema.prisma'
      - 'prisma/migrations/20261103120000_identity_foundation/**'
      - 'prisma/migrations/20261103121000_identity_contact_revision/**'
      - 'prisma/migrations/20261103122000_identity_proof_authority/**'
      - 'prisma/migrations/20261103123000_identity_legacy_write_fence/**'
      - 'prisma/migrations/20261103124000_identity_staged_credential_revision/**'
      - 'prisma/migrations/20261103125000_identity_activation_receipt/**'
      - 'prisma/migrations/20261103126000_identity_common_password_recovery/**'
      - 'prisma/migrations/20261103127000_identity_onboarding_intent/**'
      - 'prisma/migrations/20261103128000_identity_onboarding_time/**'
      - 'src/lib/identity/**'
      - 'src/app/api/v1/identity/**'
      - 'src/__tests__/identity-application-enrollment-http.test.ts'
      - 'src/__tests__/identity-mobile-login-http.test.ts'
      - 'src/__tests__/identity-mobile-recovery-http.test.ts'
      - 'src/lib/mtm/whatsapp-login-code*'
      - 'src/proxy.ts'
      - 'src/app/api/v1/mtm/mobile/profile/**'
      - 'src/lib/tenant-capabilities.ts'
      - 'src/lib/modules.ts'
      - 'src/lib/crm-product-availability.ts'
      - 'src/lib/mtm/attendance-feature.ts'
      - 'src/lib/mobile-auth.ts'
      - 'src/lib/auth.ts'
      - 'src/lib/prisma.ts'
      - 'src/lib/plan-limits.ts'
      - 'src/__tests__/lib-lead-segment-contact.test.ts'
      - 'src/app/api/v1/auth/forgot-password/**'
      - 'src/app/api/v1/auth/reset-password/**'
      - 'src/app/api/v1/users/me/change-password/**'
      - 'src/__tests__/api-auth.test.ts'
      - 'src/__tests__/one-time-token.test.ts'
      - 'src/__tests__/api-users-me-change-password.test.ts'
      - 'src/app/api/v1/users/**'
      - 'src/__tests__/api-users-role-validation.test.ts'
      - 'src/app/api/v1/admin/tenants/**/reset-password/**'
      - 'src/__tests__/api-users-reset-password.test.ts'
      - 'src/__tests__/admin-tenant-password-reset.test.ts'
      - 'src/__tests__/account-management-session-only.test.ts'
      - 'src/__tests__/auth-session-invalidation.test.ts'
      - 'src/__tests__/shared-privacy-auth-callbacks.test.ts'
      - 'src/lib/mtm-audit.ts'
      - 'src/app/api/v1/mtm/agents/**'
      - 'src/__tests__/api-mtm-agents.test.ts'
      - 'src/lib/mtm/mobile-login-*.ts'
      - 'src/app/api/v1/mtm/mobile/auth/**'
      - 'src/__tests__/mtm-password-setup-phone.test.ts'
      - 'src/__tests__/api-mtm-misc.test.ts'
      - 'src/__tests__/api-mtm-audit.test.ts'
      - 'src/__tests__/mtm-mobile-login-code-postgres.test.ts'
      - 'src/__tests__/mobile-auth-scope.test.ts'
      - 'src/__tests__/mobile-auth-office-attendance.test.ts'
      - 'src/__tests__/lib-whatsapp-portal-mobile-slack.test.ts'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: identity-snapshot-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  postgres-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: identity_snapshot_contract_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: identity-contract-admin-only
        ports: [5432/tcp]
        options: >-
          --health-cmd "pg_isready -U postgres -d identity_snapshot_contract_test"
          --health-interval 5s --health-timeout 5s --health-retries 15
    env:
      CI: 'true'
      IDENTITY_CONTRACT_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.IDENTITY_CONTRACT_HEAD_SHA }}
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm
      - name: Bind source and run focused unit checks
        run: |
          test "$(git rev-parse HEAD)" = "$IDENTITY_CONTRACT_HEAD_SHA"
          node scripts/ci/check-github-runner-policy.mjs
          node --test scripts/identity/preflight.test.mjs scripts/identity/snapshot.test.mjs scripts/identity/postgres-contract.test.mjs scripts/identity/compile-foundation.test.mjs
          git diff --check
      - run: npm ci
      - run: npx prisma validate && npx prisma generate
        env:
          DATABASE_URL: postgresql://postgres:identity-contract-admin-only@127.0.0.1:${{ job.services.postgres.ports[5432] }}/identity_snapshot_contract_test
      - name: Identity release admission and real PostgreSQL drain
        run: node --test scripts/identity/release-contract.test.mjs scripts/booking/release-contract.test.mjs
        env:
          IDENTITY_RELEASE_TEST_DATABASE_URL: postgresql://postgres:identity-contract-admin-only@127.0.0.1:${{ job.services.postgres.ports[5432] }}/identity_snapshot_contract_test
      - name: Actual Prisma, PostgreSQL, RLS and concurrent snapshot
        run: node scripts/identity/postgres-contract.mjs
        env:
          IDENTITY_CONTRACT_DATABASE_URL: postgresql://postgres:identity-contract-admin-only@127.0.0.1:${{ job.services.postgres.ports[5432] }}/identity_snapshot_contract_test
          EVENT_PLATFORM_TEST_DATABASE_URL: postgresql://postgres:identity-contract-admin-only@127.0.0.1:${{ job.services.postgres.ports[5432] }}/identity_snapshot_contract_test
          IDENTITY_CONTRACT_RECEIPT: ${{ runner.temp }}/identity-snapshot-contract.json
      - name: Focused identity types and independent application unit checks
        run: |
          node scripts/identity/compile-foundation.mjs
          VITEST_MAX_WORKERS=1 npx vitest run src/__tests__/identity-self-bootstrap-http.test.ts src/__tests__/identity-self-bootstrap-ui.test.ts src/lib/identity/directory-contact.test.ts src/lib/identity/onboarding-contract.test.ts src/__tests__/identity-mobile-recovery-http.test.ts src/lib/identity/mobile-recovery-runtime.test.ts src/lib/mtm/whatsapp-login-code.test.ts src/lib/identity/recovery-authority.test.ts src/lib/identity/activation-runtime.test.ts src/__tests__/mtm-attendance-identity-error.test.ts src/__tests__/mtm-attendance-employees-ui.test.ts src/__tests__/identity-application-enrollment-http.test.ts src/__tests__/identity-mobile-login-http.test.ts src/lib/identity/contract.test.ts src/lib/identity/phone-proof.test.ts src/lib/identity/proof-authority.test.ts src/lib/identity/runtime-keys.test.ts src/lib/identity/mobile-runtime.test.ts src/lib/identity/credential-setup.test.ts src/lib/identity/phone-proof-dispatch.test.ts src/lib/identity/mobile-session-contract.test.ts src/lib/identity/mobile-session.test.ts src/lib/identity/tenant-policy.test.ts src/lib/identity/crm-session.test.ts src/__tests__/rls-bypass-classifier.test.ts src/__tests__/tenant-capabilities.test.ts src/__tests__/attendance-feature.test.ts src/__tests__/mobile-auth-scope.test.ts src/__tests__/mobile-auth-office-attendance.test.ts src/__tests__/lib-whatsapp-portal-mobile-slack.test.ts src/__tests__/api-mtm-misc.test.ts src/__tests__/mtm-password-setup-phone.test.ts src/__tests__/api-mtm-audit.test.ts src/__tests__/api-mtm-agents.test.ts src/__tests__/lib-lead-segment-contact.test.ts src/__tests__/auth-session-invalidation.test.ts src/__tests__/shared-privacy-auth-callbacks.test.ts src/__tests__/api-users-reset-password.test.ts src/__tests__/api-users-role-validation.test.ts src/__tests__/admin-tenant-password-reset.test.ts src/__tests__/account-management-session-only.test.ts src/__tests__/api-auth.test.ts src/__tests__/one-time-token.test.ts src/__tests__/api-users-me-change-password.test.ts
      - name: Runtime commissioning key and filesystem safety
        run: node --test scripts/identity/commission-runtime.test.mjs scripts/identity/commission-database.test.mjs
        env:
          IDENTITY_COMMISSION_TEST_DATABASE_URL: postgresql://postgres:identity-contract-admin-only@127.0.0.1:${{ job.services.postgres.ports[5432] }}/identity_snapshot_contract_test
      - name: Actual additive identity migration, tenant isolation and phone races
        run: node scripts/identity/foundation-contract.mjs
        env:
          IDENTITY_CONTRACT_DATABASE_URL: postgresql://postgres:identity-contract-admin-only@127.0.0.1:${{ job.services.postgres.ports[5432] }}/identity_snapshot_contract_test
          EVENT_PLATFORM_TEST_DATABASE_URL: postgresql://postgres:identity-contract-admin-only@127.0.0.1:${{ job.services.postgres.ports[5432] }}/identity_snapshot_contract_test
          IDENTITY_FOUNDATION_BUILD: ${{ runner.temp }}/identity-foundation/identity
          IDENTITY_FOUNDATION_RECEIPT: ${{ runner.temp }}/identity-foundation-contract.json
      - name: Retain sanitized result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: identity-snapshot-${{ env.IDENTITY_CONTRACT_HEAD_SHA }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/identity-snapshot-contract.json
            ${{ runner.temp }}/identity-foundation-contract.json
          if-no-files-found: warn
          retention-days: 14
