name: Prepare Route Field native fixture

# Explicitly creates one separately owned fictional tenant. No credentials leave the server.
on:
  pull_request:
    paths:
      - "scripts/mtm-route-field-fixture.ts"
      - "scripts/build-mtm-route-field-controller.mjs"
      - "src/__tests__/mtm-route-field-fixture*.test.ts"
      - ".github/workflows/mtm-route-field-fixture.yml"
  workflow_dispatch:
    inputs:
      expected_main_sha:
        description: "Exact current and already deployed 40-character main SHA"
        type: string
        required: true

permissions:
  contents: read
  actions: read

jobs:
  verify-controller:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: route-field-fixture-verify-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    env:
      DATABASE_URL: postgresql://postgres:fixture-only@127.0.0.1:5432/postgres
    services:
      postgres:
        image: mirror.gcr.io/pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: fixture-only
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v6
      - name: Require exact current main before an operational controller run
        if: github.event_name == 'workflow_dispatch'
        env:
          EXPECTED_MAIN_SHA: ${{ inputs.expected_main_sha }}
        run: |
          set -euo pipefail
          [ "$GITHUB_REF" = refs/heads/main ]
          [[ "$EXPECTED_MAIN_SHA" =~ ^[0-9a-f]{40}$ ]]
          git fetch --no-tags --depth=1 origin refs/heads/main
          [ "$EXPECTED_MAIN_SHA" = "$GITHUB_SHA" ]
          [ "$EXPECTED_MAIN_SHA" = "$(git rev-parse FETCH_HEAD)" ]
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx prisma generate
      - name: Prove ownership fences, output privacy and full-schema fixture transactions
        env:
          RF_FIXTURE_TEST_DATABASE_URL: postgresql://postgres:fixture-only@127.0.0.1:5432/postgres
          RF_FIXTURE_DB_GATE: required
          VITEST_MAX_WORKERS: 1
        run: npx vitest run src/__tests__/mtm-route-field-fixture.test.ts src/__tests__/mtm-route-field-fixture-postgres.test.ts
      - name: Bundle the reviewed controller with existing secure file helpers
        run: node scripts/build-mtm-route-field-controller.mjs route-field-fixture-controller.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: route-field-fixture-controller-${{ github.sha }}
          path: route-field-fixture-controller.cjs
          retention-days: 1
          if-no-files-found: error

  production-route-field-fixture:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: verify-controller
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: production
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/assert-production-environment-protection
        with:
          github-token: ${{ github.token }}
      - name: Recheck current main after waiting for the production lock
        env:
          EXPECTED_MAIN_SHA: ${{ inputs.expected_main_sha }}
        run: |
          set -euo pipefail
          [ "$GITHUB_REF" = refs/heads/main ]
          [[ "$EXPECTED_MAIN_SHA" =~ ^[0-9a-f]{40}$ ]]
          git fetch --no-tags --depth=1 origin refs/heads/main
          [ "$EXPECTED_MAIN_SHA" = "$GITHUB_SHA" ]
          [ "$EXPECTED_MAIN_SHA" = "$(git rev-parse FETCH_HEAD)" ]
      - uses: actions/download-artifact@v4
        with:
          name: route-field-fixture-controller-${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: ./.github/actions/setup-production-ssh
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
          server-host: ${{ secrets.SERVER_HOST }}
          known-hosts: ${{ secrets.SERVER_SSH_KNOWN_HOSTS }}
      - name: Run the bounded insert-only Route Field fixture preparation
        env:
          EXPECTED_MAIN_SHA: ${{ inputs.expected_main_sha }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          set -euo pipefail
          [ "$SERVER_HOST" = 13.140.132.245 ] && [ "$SERVER_USER" = root ]
          [[ "$EXPECTED_MAIN_SHA" =~ ^[0-9a-f]{40}$ ]]
          RAW_OUTPUT="$(mktemp)"
          trap 'rm -f "$RAW_OUTPUT"' EXIT
          mkdir -p evidence
          set +e
          ssh -T -o ConnectTimeout=10 -o LogLevel=ERROR -i ~/.ssh/deploy_key \
            "$SERVER_USER@$SERVER_HOST" \
            "NODE_NO_WARNINGS=1 node - --prepare-route-field-fixture '$EXPECTED_MAIN_SHA'" \
            < route-field-fixture-controller.cjs > "$RAW_OUTPUT" 2>/dev/null
          REMOTE_STATUS=$?
          set -e
          node route-field-fixture-controller.cjs --validate-route-field-output < "$RAW_OUTPUT" > evidence/route-field-fixture.json || {
            rm -f evidence/route-field-fixture.json
            echo '::error::Route Field controller returned no valid sanitized evidence'
            exit 1
          }
          cat evidence/route-field-fixture.json
          [ "$REMOTE_STATUS" -eq 0 ]
          node -e 'if (require("./evidence/route-field-fixture.json").status !== "PASS") process.exit(1)'
      - name: Retain only allowlisted fictional-tenant counts and source revision
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: route-field-fixture-evidence-${{ github.sha }}
          path: evidence/route-field-fixture.json
          retention-days: 14
          if-no-files-found: ignore
