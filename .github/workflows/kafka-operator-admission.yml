name: Kafka operator admission isolated proof
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'ops/event-platform/operator/**'
      - 'scripts/event-platform/operator-*.mjs'
      - 'scripts/event-platform/operator-fund-snapshot.sql'
      - '.github/workflows/kafka-operator-admission.yml'
permissions:
  contents: read
concurrency:
  group: kafka-operator-admission-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  admission-postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16.13-alpine@sha256:4941ef97aaa2633ce9808f7766f8b8d746dd039ce8c51ca6da185c3dc63ab579
        env:
          POSTGRES_USER: control_test_admin
          POSTGRES_PASSWORD: operator-fixture-only
          POSTGRES_DB: kafka_operator_test
          POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U control_test_admin -d kafka_operator_test"
          --health-interval 5s --health-timeout 3s --health-retries 15
          --memory 384m --memory-swap 384m --pids-limit 128
    env:
      LD_OPERATOR_DISPOSABLE: '1'
      PGHOST: 127.0.0.1
      PGUSER: control_test_admin
      PGDATABASE: kafka_operator_test
      PGPASSWORD: operator-fixture-only
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate scripts and offline alert receipts
        run: |
          node --check scripts/event-platform/operator-admission.integration.mjs
          node --test scripts/event-platform/operator-alert-evidence.test.mjs scripts/event-platform/operator-recovery-evidence.test.mjs scripts/event-platform/operator-fund-snapshot.test.mjs scripts/event-platform/operator-fund-canary.test.mjs scripts/event-platform/operator-stop-evidence.test.mjs scripts/event-platform/operator-admission-guard.test.mjs scripts/event-platform/operator-fund-verifier.test.mjs scripts/event-platform/operator-alert-http.test.mjs scripts/event-platform/operator-restore-guard.test.mjs
      - name: Real disposable notification delivery and independent read-back
        run: node --test scripts/event-platform/operator-notification.integration.mjs

      - name: Real named-login PostgreSQL admissions and races
        env:
          PGPORT: ${{ job.services.postgres.ports[5432] }}
        run: node --test scripts/event-platform/operator-admission.integration.mjs

      - name: Own staged COMMIT and shadow-pointer follow-on proof
        env:
          PGPORT: ${{ job.services.postgres.ports[5432] }}
        run: node --test scripts/event-platform/operator-shadow-composition.integration.mjs

      - name: Single-use observer stop challenges in actual PostgreSQL
        env:
          PGPORT: ${{ job.services.postgres.ports[5432] }}
        run: node --test scripts/event-platform/operator-stop-challenges.integration.mjs

      - name: Install bounded reducer proof dependencies
        run: npm ci --prefix ops/event-platform/operator/fixtures --no-audit --no-fund
      - name: Compile the existing canonical Fund reducer for this proof
        run: |
          ops/event-platform/operator/fixtures/node_modules/.bin/esbuild src/lib/event-platform/fund-balance-reducer.ts --bundle --platform=node --format=esm --outfile="$RUNNER_TEMP/operator-canonical-reducer.mjs" --alias:zod="$PWD/ops/event-platform/operator/fixtures/node_modules/zod"
      - name: Read-only evidence against actual Fund migrations and restricted RLS
        env:
          PGPORT: ${{ job.services.postgres.ports[5432] }}
          LD_OPERATOR_REDUCER_MODULE: ${{ runner.temp }}/operator-canonical-reducer.mjs
        run: node --test scripts/event-platform/operator-fund-snapshot.integration.mjs

      - name: Tenant source-write barrier against actual Fund migrations
        env:
          PGPORT: ${{ job.services.postgres.ports[5432] }}
        run: node --test scripts/event-platform/operator-source-barrier.integration.mjs

      - name: Isolated authenticated Fund transition composition
        env:
          PGPORT: ${{ job.services.postgres.ports[5432] }}
          LD_OPERATOR_REDUCER_MODULE: ${{ runner.temp }}/operator-canonical-reducer.mjs
        run: node --test scripts/event-platform/operator-fund-transition.integration.mjs

      - name: Independent physical restore and restricted canonical parity
        env:
          PGPORT: ${{ job.services.postgres.ports[5432] }}
          LD_OPERATOR_REDUCER_MODULE: ${{ runner.temp }}/operator-canonical-reducer.mjs
        run: node --test scripts/event-platform/operator-fund-restore.integration.mjs
