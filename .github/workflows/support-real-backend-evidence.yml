name: Support real backend evidence
on:
  push:
    branches: [codex/support-real-backend-evidence, codex/support-portal-audit-fix]
    paths:
      - ".github/workflows/support-real-backend-evidence.yml"
      - "scripts/support-backend-*.mjs"
      - "scripts/ci/tests/support-backend-*.test.mjs"
      - "docs/support-portal-user-audit-fix-evidence-2026-10-04.md"
      - "src/app/api/v1/portal-users/route.ts"
      - "src/__tests__/api-portal-users.test.ts"
      - "prisma/schema.prisma"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: support-real-backend-${{ github.ref }}
  cancel-in-progress: true
jobs:
  real-backend:
    if: github.repository == 'rashadoni/leaddrive-v2' && (github.ref == 'refs/heads/codex/support-real-backend-evidence' || github.ref == 'refs/heads/codex/support-portal-audit-fix')
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm ci
      - name: Prepare isolated development log transport
        shell: bash
        run: |
          set -euo pipefail
          stage="temporary-directory"
          trap 'mkdir -p artifacts/support-backend; printf "{\"status\":\"SETUP_FAIL\",\"stage\":\"%s\",\"databaseStarted\":false,\"casesRun\":0}\n" "$stage" > artifacts/support-backend/receipt.json' ERR
          fixture_deps="$(mktemp -d "$RUNNER_TEMP/support-log-transport.XXXXXX")"
          stage="install-pinned-transport"
          npm install --prefix "$fixture_deps" --ignore-scripts --no-audit --no-fund --save-exact pino-pretty@13.1.1
          stage="verify-pinned-integrity"
          node -e 'const p=require(process.argv[1]);if(p.packages["node_modules/pino-pretty"].integrity!=="sha512-TNNEOg0eA0u+/WuqH0MH0Xui7uqVk9D74ESOpjtebSQYbNWJk/dIxCXIxFsNfeN53JmtWqYHP2OrIZjT/CBEnA==")process.exit(1)' "$fixture_deps/package-lock.json"
          stage="verify-root-transport-absent"
          test ! -e node_modules/pino-pretty
          stage="link-pinned-transport"
          ln -s "$fixture_deps/node_modules/pino-pretty" node_modules/pino-pretty
          stage="construct-development-logger"
          node -e 'const pino=require("pino");const log=pino({transport:{target:require.resolve("pino-pretty")}});log.flush()'
      - name: Verify isolated harness guards
        run: |
          node scripts/ci/check-github-runner-policy.mjs
          node --test scripts/ci/tests/support-backend-evidence-guards.test.mjs scripts/ci/tests/support-backend-evidence-process.test.mjs
          git diff --exit-code
          test -z "$(git status --porcelain)"
      - name: Start disposable loopback PostgreSQL
        shell: bash
        run: |
          set -euo pipefail
          password="$(openssl rand -hex 32)"
          echo "::add-mask::$password"
          name="support-backend-${{ github.run_id }}-${{ github.run_attempt }}"
          docker run --detach --name "$name" \
            --publish 127.0.0.1::5432 \
            --env POSTGRES_PASSWORD="$password" \
            --env POSTGRES_DB=postgres \
            pgvector/pgvector:pg16 >/dev/null
          port="$(docker port "$name" 5432/tcp)"
          port="${port##*:}"
          url="postgresql://postgres:$password@127.0.0.1:$port/postgres"
          echo "::add-mask::$url"
          printf 'SUPPORT_BACKEND_ADMIN_URL=%s\n' "$url" >> "$GITHUB_ENV"
          for attempt in $(seq 1 60); do
            if docker exec "$name" pg_isready -U postgres -d postgres >/dev/null 2>&1; then exit 0; fi
            sleep 1
          done
          echo "Disposable PostgreSQL did not become ready"
          exit 1
      - name: Execute ten real API and database cases
        env:
          CI: "true"
          NODE_ENV: test
          SUPPORT_BACKEND_EVIDENCE: fresh-postgres-v1
          SUPPORT_BACKEND_HEAD_SHA: ${{ github.sha }}
        run: node scripts/support-backend-evidence.mjs
      - name: Stop disposable database
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          name="support-backend-${{ github.run_id }}-${{ github.run_attempt }}"
          if docker container inspect "$name" >/dev/null 2>&1; then
            docker rm --force --volumes "$name" >/dev/null
          fi
          if docker container inspect "$name" >/dev/null 2>&1; then
            echo "Disposable database cleanup failed"
            exit 1
          fi
          echo "Disposable database container absent"
      - name: Upload sanitized receipt only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: support-real-backend-${{ github.sha }}-${{ github.run_attempt }}
          path: artifacts/support-backend/receipt.json
          if-no-files-found: error
          retention-days: 14
