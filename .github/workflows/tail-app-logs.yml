name: Inspect production safely

# Read-only diagnostics: print the tail of the leaddrive-v2 PM2 error log,
# report backup-gate readiness with every configured value redacted, inspect
# anonymized PostgreSQL TLS metadata, or list bounded log-source metadata
# without reading any log contents, or report bounded Support rollout counts
# without exposing organization features, settings, credentials or category names.
# The Support readiness view exports only process/log metadata and aggregate
# matching INFO evidence from a bounded sample; it never exports raw logs.
# Dispatch-only: editing this workflow must not create an implicit production
# connection.

on:
  workflow_dispatch:
    inputs:
      view:
        description: "Read-only diagnostic to run"
        required: true
        default: "logs"
        type: choice
        options:
          - logs
          - backup-readiness
          - backup-log-inventory
          - postgres-tls-metadata
          - postgres-san-scratch-audit
          - support-ux-rollout
          - support-ux-readiness
          - support-ux-observation
      support_tenant:
        description: "Optional exact tenant slug for Support rollout metadata; empty returns anonymous aggregate counts"
        required: false
        default: ""
        type: string
      support_day:
        description: "Completed Asia/Baku day (YYYY-MM-DD) for the selected tenant's bounded Support handler metrics"
        required: false
        default: ""
        type: string
      lines:
        description: "How many log lines to tail"
        required: false
        default: "200"
      expected_main_sha:
        description: "Exact current 40-character main SHA"
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  tail:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: production
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    steps:
      - name: Checkout dispatched revision
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: Require independently protected production environment
        uses: ./.github/actions/assert-production-environment-protection
        with:
          github-token: ${{ github.token }}
      - name: Bind diagnostic to the exact current main revision
        env:
          EXPECTED_MAIN_SHA: ${{ inputs.expected_main_sha }}
        run: |
          set -euo pipefail
          [ "$GITHUB_REF" = "refs/heads/main" ] || {
            echo "::error::Production diagnostics may only be dispatched from main"
            exit 1
          }
          [[ "$EXPECTED_MAIN_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::expected_main_sha must be an exact lowercase Git SHA"
            exit 1
          }
          git fetch --no-tags --depth=1 origin refs/heads/main
          CURRENT_MAIN_SHA="$(git rev-parse FETCH_HEAD)"
          [ "$GITHUB_SHA" = "$CURRENT_MAIN_SHA" ] \
            && [ "$EXPECTED_MAIN_SHA" = "$CURRENT_MAIN_SHA" ] || {
              echo "::error::Dispatch revision is not the exact current main head"
              exit 1
            }
      # Inputs become part of a remote command line — reject anything outside the
      # strict shape before it gets near a shell (F-37). The value is
      # interpolated into a quoted string the REMOTE shell parses, so a single
      # quote in it closes the quoting and the rest runs as root on production.
      - name: Validate inputs
        env:
          IN_LINES: ${{ inputs.lines }}
        run: |
          set -euo pipefail
          LINES_RE='^[0-9]{1,5}$'
          [[ "$IN_LINES" =~ $LINES_RE ]] \
            || { echo "FATAL: lines must be 1-5 digits"; exit 1; }
          [ "$IN_LINES" -ge 1 ] && [ "$IN_LINES" -le 1000 ] \
            || { echo "FATAL: lines must be between 1 and 1000"; exit 1; }

      - name: Verify Support rollout diagnostic before production access
        if: ${{ inputs.view == 'support-ux-rollout' }}
        run: PYTHONDONTWRITEBYTECODE=1 python3 -I .github/scripts/test_inspect_support_ux_rollout.py
      - name: Verify Support observation diagnostic before production access
        if: ${{ inputs.view == 'support-ux-observation' }}
        run: node --test .github/scripts/test-inspect-support-ux-observation.mjs .github/scripts/test-support-ux-observation-artifact.mjs
      - name: Verify Support readiness diagnostic before production access
        if: ${{ inputs.view == 'support-ux-readiness' }}
        run: node --test .github/scripts/test-inspect-support-ux-readiness.mjs
      - name: Setup pinned production SSH
        uses: ./.github/actions/setup-production-ssh
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
          server-host: ${{ secrets.SERVER_HOST }}
          known-hosts: ${{ secrets.SERVER_SSH_KNOWN_HOSTS }}
      - name: Inspect bounded Support logging readiness without selecting a tenant
        if: ${{ inputs.view == 'support-ux-readiness' }}
        run: |
          set -euo pipefail
          set +e
          DIAGNOSTIC_OUTPUT="$(
            ssh -T -o ConnectTimeout=10 -o LogLevel=ERROR -i ~/.ssh/deploy_key \
              ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} \
              'NODE_NO_WARNINGS=1 node --input-type=module -' \
              < .github/scripts/inspect-support-ux-readiness.mjs 2>/dev/null
          )"
          DIAGNOSTIC_STATUS=$?
          set -e
          printf '%s' "$DIAGNOSTIC_OUTPUT" \
            | node .github/scripts/inspect-support-ux-readiness.mjs --validate-output
          [ "$DIAGNOSTIC_STATUS" -eq 0 ] || {
            echo "::error::Read-only Support readiness inspection failed"
            exit "$DIAGNOSTIC_STATUS"
          }
      - name: Inspect bounded Support rollout metadata
        if: ${{ inputs.view == 'support-ux-rollout' }}
        env:
          SUPPORT_UX_TENANT: ${{ inputs.support_tenant }}
        run: |
          set -euo pipefail
          if [ -n "$SUPPORT_UX_TENANT" ]; then
            SLUG_RE='^[a-z0-9]([a-z0-9-]{0,78}[a-z0-9])?$'
            [[ "$SUPPORT_UX_TENANT" =~ $SLUG_RE ]] || {
              echo "::error::Support tenant slug has an invalid shape"
              exit 1
            }
          fi
          set +e
          DIAGNOSTIC_OUTPUT="$(
            ssh -T -o ConnectTimeout=10 -o LogLevel=ERROR -i ~/.ssh/deploy_key \
              ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} \
              "SUPPORT_UX_TENANT='$SUPPORT_UX_TENANT' PYTHONDONTWRITEBYTECODE=1 python3 -I -" \
              < .github/scripts/inspect_support_ux_rollout.py 2>/dev/null
          )"
          DIAGNOSTIC_STATUS=$?
          set -e
          printf '%s' "$DIAGNOSTIC_OUTPUT" \
            | python3 -I .github/scripts/inspect_support_ux_rollout.py --validate-output
          [ "$DIAGNOSTIC_STATUS" -eq 0 ] || {
            echo "::error::Read-only Support rollout inspection failed"
            exit "$DIAGNOSTIC_STATUS"
          }
      - name: Collect bounded Support handler metrics for one completed day
        if: ${{ inputs.view == 'support-ux-observation' }}
        env:
          SUPPORT_UX_TENANT: ${{ inputs.support_tenant }}
          SUPPORT_UX_DAY: ${{ inputs.support_day }}
          EXPECTED_MAIN_SHA: ${{ inputs.expected_main_sha }}
        run: |
          set -euo pipefail
          SLUG_RE='^[a-z0-9]([a-z0-9-]{0,78}[a-z0-9])?$'
          DAY_RE='^[0-9]{4}-[0-9]{2}-[0-9]{2}$'
          [[ "$SUPPORT_UX_TENANT" =~ $SLUG_RE ]] \
            && [[ "$SUPPORT_UX_DAY" =~ $DAY_RE ]] || {
              echo "::error::Support observation requires an exact tenant slug and completed day"
              exit 1
            }
          set +e
          DIAGNOSTIC_OUTPUT="$(
            ssh -T -o ConnectTimeout=10 -o LogLevel=ERROR -i ~/.ssh/deploy_key \
              ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} \
              "SUPPORT_UX_TENANT='$SUPPORT_UX_TENANT' SUPPORT_UX_DAY='$SUPPORT_UX_DAY' NODE_NO_WARNINGS=1 node --input-type=module -" \
              < .github/scripts/inspect-support-ux-observation.mjs 2>/dev/null
          )"
          DIAGNOSTIC_STATUS=$?
          set -e
          printf '%s' "$DIAGNOSTIC_OUTPUT" \
            | node .github/scripts/inspect-support-ux-observation.mjs --validate-output > "$RUNNER_TEMP/support-ux-observation-validated.json"
          [ "$DIAGNOSTIC_STATUS" -eq 0 ] || {
            echo "::error::Read-only Support observation collection failed"
            exit "$DIAGNOSTIC_STATUS"
          }
          # Only the existing strict validator's projection reaches this helper.
          # Never upload DIAGNOSTIC_OUTPUT, process environment or any log file.
          node .github/scripts/support-ux-observation-artifact.mjs \
            < "$RUNNER_TEMP/support-ux-observation-validated.json"
      - name: Retain sanitized Support observation evidence
        if: ${{ success() && inputs.view == 'support-ux-observation' }}
        uses: actions/upload-artifact@v4
        with:
          name: support-ux-observation-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/support-ux-observation-evidence/result.json
          if-no-files-found: error
          retention-days: 30
      - name: Tail PM2 logs
        if: ${{ inputs.view == 'logs' }}
        env:
          LINES: ${{ inputs.lines || '200' }}
        run: |
          ssh -o ConnectTimeout=30 -i ~/.ssh/deploy_key \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} \
            "LINES='$LINES' bash -s" <<'REMOTE'
          set -uo pipefail
          echo "=== pm2 status ==="
          pm2 jlist 2>/dev/null | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{JSON.parse(s).forEach(p=>console.log(p.name, p.pm2_env.status, 'restarts='+p.pm2_env.restart_time, 'uptime='+new Date(p.pm2_env.pm_uptime).toISOString()))}catch(e){console.log('(jlist parse failed)')}})" 2>/dev/null || pm2 status 2>/dev/null | head -20
          echo ""
          echo "=== last $LINES error-log lines (leaddrive-v2) ==="
          pm2 logs leaddrive-v2 --err --lines "$LINES" --nostream 2>/dev/null | tail -"$LINES"
          REMOTE
      - name: Report PostgreSQL backup readiness
        if: ${{ inputs.view == 'backup-readiness' }}
        run: |
          ssh -o ConnectTimeout=30 -i ~/.ssh/deploy_key \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} \
            'bash -s' < scripts/backup/report-production-readiness.sh
      - name: Inspect anonymized PostgreSQL TLS metadata
        if: ${{ inputs.view == 'postgres-tls-metadata' }}
        run: |
          set -euo pipefail
          export LC_ALL=C
          set +e
          DIAGNOSTIC_OUTPUT="$(
            ssh -T -o ConnectTimeout=30 -o LogLevel=ERROR -i ~/.ssh/deploy_key \
              ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} \
              'PYTHONDONTWRITEBYTECODE=1 python3 -I -' \
              < .github/scripts/inspect_postgres_tls_metadata.py 2>/dev/null
          )"
          DIAGNOSTIC_STATUS=$?
          set -e

          mapfile -t DIAGNOSTIC_LINES <<<"$DIAGNOSTIC_OUTPUT"
          LINE_RE='^endpoint=(source|restore-scratch) address_type=(local|private|public|unknown) provider=(self-hosted|azure-postgresql|gcp-cloud-sql|digitalocean|aws-rds|aiven|supabase|neon|render|railway|heroku|contabo|unknown) port=([1-9][0-9]{0,4}|invalid) tls=(available|not-supported|unreachable|handshake-failed|protocol-error|not-applicable|not-tested) issuer=(self-signed|unavailable|(public-ca|private-or-untrusted):(lets-encrypt|digicert|amazon-trust-services|google-trust-services|sectigo|aiven|digitalocean|microsoft|globalsign|entrust|other)) san_dns=([0-9]+|unavailable) san_ip=([0-9]+|unavailable) san_wildcard=([0-9]+|unavailable) san_endpoint_match=(yes|no|unknown|unavailable) fingerprint_sha256_prefix=([0-9a-f]{12}|unavailable)$'
          [ "${#DIAGNOSTIC_LINES[@]}" -eq 2 ] \
            && [[ "${DIAGNOSTIC_LINES[0]}" =~ $LINE_RE ]] \
            && [[ "${DIAGNOSTIC_LINES[1]}" =~ $LINE_RE ]] \
            && [[ "${DIAGNOSTIC_LINES[0]}" == endpoint=source\ * ]] \
            && [[ "${DIAGNOSTIC_LINES[1]}" == endpoint=restore-scratch\ * ]] || {
              echo "::error::Anonymized diagnostic output failed schema validation"
              exit 1
            }

          for line in "${DIAGNOSTIC_LINES[@]}"; do
            port="${line#* port=}"
            port="${port%% *}"
            [ "$port" = invalid ] || {
              [ "$port" -ge 1 ] && [ "$port" -le 65535 ] || {
                echo "::error::Anonymized diagnostic output contained an invalid port"
                exit 1
              }
            }
          done

          printf '%s\n' "${DIAGNOSTIC_LINES[@]}"
          [ "$DIAGNOSTIC_STATUS" -eq 0 ] || {
            echo "::error::Production diagnostic did not complete"
            exit "$DIAGNOSTIC_STATUS"
          }
      - name: Audit anonymized source SAN and scratch launcher
        if: ${{ inputs.view == 'postgres-san-scratch-audit' }}
        run: |
          set -euo pipefail
          export LC_ALL=C
          set +e
          DIAGNOSTIC_OUTPUT="$(
            ssh -T -o ConnectTimeout=30 -o LogLevel=ERROR -i ~/.ssh/deploy_key \
              ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} \
              'PYTHONDONTWRITEBYTECODE=1 python3 -I - san-scratch-audit' \
              < .github/scripts/inspect_postgres_tls_metadata.py 2>/dev/null
          )"
          DIAGNOSTIC_STATUS=$?
          set -e

          mapfile -t DIAGNOSTIC_LINES <<<"$DIAGNOSTIC_OUTPUT"
          SOURCE_RE='^source_san dns_san_count=([0-9]+|unavailable) san_matches_server_name=(yes|no|unavailable) san_resolves_local=(yes|no|unavailable) verify_full_at_source_endpoint=(yes|no|unavailable) verify_full_via_san_name=(yes|no|unavailable) client_hostaddr_configured=(yes|no|unavailable) effective_verify_full=(yes|no|unavailable) remediation_without_postgres_restart=(direct-dns|client-hostaddr-required|not-proven)$'
          SCRATCH_RE='^scratch port=([1-9][0-9]{0,4}|invalid) launch_mechanism=(separate-postgresql-cluster|docker-compose|docker|custom-systemd|ambiguous|not-configured|unknown) definition=(present|absent|unknown) runtime_state=(running|stopped|not-created|absent|unknown) cluster_probe=(present|absent|unknown) docker_probe=(present|absent|unknown) compose_probe=(present|absent|unknown) systemd_probe=(present|absent|unknown)$'
          [ "${#DIAGNOSTIC_LINES[@]}" -eq 2 ] \
            && [[ "${DIAGNOSTIC_LINES[0]}" =~ $SOURCE_RE ]] \
            && [[ "${DIAGNOSTIC_LINES[1]}" =~ $SCRATCH_RE ]] || {
              echo "::error::Anonymized diagnostic output failed schema validation"
              exit 1
            }

          port="${DIAGNOSTIC_LINES[1]#* port=}"
          port="${port%% *}"
          [ "$port" = invalid ] || {
            [ "$port" -ge 1 ] && [ "$port" -le 65535 ] || {
              echo "::error::Anonymized diagnostic output contained an invalid port"
              exit 1
            }
          }

          printf '%s\n' "${DIAGNOSTIC_LINES[@]}"
          [ "$DIAGNOSTIC_STATUS" -eq 0 ] || {
            echo "::error::Production diagnostic did not complete"
            exit "$DIAGNOSTIC_STATUS"
          }
      - name: Inventory backup log sources without reading contents
        if: ${{ inputs.view == 'backup-log-inventory' }}
        run: |
          ssh -o ConnectTimeout=30 -i ~/.ssh/deploy_key \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} \
            'bash -s' <<'REMOTE'
          set -euo pipefail
          export LC_ALL=C

          echo "=== host ==="
          hostname
          uname -srmo

          echo "=== PM2 log authorities ==="
          pm2 jlist 2>/dev/null | node -e '
            let input = ""
            process.stdin.on("data", chunk => { input += chunk })
            process.stdin.on("end", () => {
              const app = JSON.parse(input).find(item => item.name === "leaddrive-v2")
              if (!app) throw new Error("leaddrive-v2 PM2 process is absent")
              for (const key of ["pm_out_log_path", "pm_err_log_path"]) {
                const value = app.pm2_env?.[key]
                if (typeof value !== "string" || !value.startsWith("/")) {
                  throw new Error(`unsafe or missing ${key}`)
                }
                console.log(`${key}=${value}`)
              }
            })
          '

          echo "=== /var/log top-level metadata ==="
          find /var/log -xdev -mindepth 1 -maxdepth 1 \
            -printf '%y\t%m\t%u:%g\t%s\t%p\n' | sort | sed -n '1,240p'

          echo "=== reviewed candidate directories ==="
          for directory in \
            /var/lib/leaddrive-v2-logs \
            /var/log/nginx \
            /var/log/postgresql \
            /var/log/letsencrypt \
            /var/log/journal; do
            if [ ! -e "$directory" ]; then
              echo "MISSING $directory"
              continue
            fi
            stat -c 'ROOT\t%F\t%a\t%U:%G\t%s\t%n' "$directory"
            find "$directory" -xdev -mindepth 1 -maxdepth 1 \
              -printf 'ENTRY\t%y\t%m\t%u:%g\t%s\t%p\n' | sort | sed -n '1,240p'
          done

          echo "=== persistent journal capacity ==="
          journalctl --disk-usage
          REMOTE
      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/deploy_key
