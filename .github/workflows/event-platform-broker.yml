name: Event platform broker driver

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'ops/event-platform/driver/**'
      - 'ops/event-platform/test/**'
      - 'scripts/event-platform/test-broker-driver.ts'
      - 'scripts/event-platform/test-broker-postgres.ts'
      - 'scripts/event-platform/fixtures/**'
      - 'scripts/event-platform/test-stack*'
      - 'src/lib/event-platform/**'
      - 'src/__tests__/event-platform-fund-shadow-postgres.test.ts'
      - 'src/__tests__/event-platform-fund-shadow-fixture.test.ts'
      - 'src/__tests__/fixtures/fund-shadow-postgres.ts'
      - 'src/__tests__/event-platform-broker-fixture.test.ts'
      - 'src/__tests__/event-platform-worker-process.test.ts'
      - 'src/__tests__/event-platform-worker-session.test.ts'
      - 'src/__tests__/event-platform-worker-admission.test.ts'
      - 'src/__tests__/event-platform-worker-artifact.test.ts'
      - 'scripts/ci/fixtures/fund-shadow/**'
      - 'scripts/ci/test-event-platform-migrations.mjs'
      - 'prisma/migrations/**'
      - 'prisma/schema.prisma'
      - 'package-lock.json'
      - '.github/workflows/event-platform-broker.yml'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: event-platform-broker-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  broker-driver:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    # Existing broker/SQL proof measured18min; three extra direct-JVM drills
    # retain a bounded sequential phase without racing the previous20min cap.
    timeout-minutes: 25
    concurrency:
      group: event-platform-disposable-integration
      cancel-in-progress: false
      queue: max
    env:
      LD_EVENT_STACK_DISPOSABLE: '1'
      LD_EVENT_STACK_DRIVER: '1'
      LD_EVENT_STACK_COMBINED: '1'
      LD_EVENT_STACK_PROJECT: ld-event-test-${{ github.run_id }}-${{ github.run_attempt }}
    services:
      fund-postgres:
        # Separate disposable loopback service for the real Prisma adapter;
        # Kafka/Connect/Registry keep their private no-host-port network.
        image: postgres:16.13-alpine@sha256:4941ef97aaa2633ce9808f7766f8b8d746dd039ce8c51ca6da185c3dc63ab579
        env:
          POSTGRES_DB: event_platform_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432
        options: >-
          --memory 512m --memory-swap 512m --cpus 1
          --health-cmd "pg_isready -U postgres -d event_platform_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install only the locked disposable TS runner
        run: npm ci --prefix ops/event-platform/driver --ignore-scripts
      - name: Install locked application test dependencies
        run: npm ci --include=dev
      - name: Generate the actual Prisma client (no application build)
        run: npx prisma generate --schema prisma/schema.prisma
      - name: Strictly typecheck the combined fixture against the actual client
        run: >-
          npx tsc --noEmit --skipLibCheck --strict --target ES2017 --lib ESNext
          --module commonjs --moduleResolution node --esModuleInterop --types node
          node_modules/next/types/global.d.ts
          src/__tests__/fixtures/fund-shadow-postgres.ts
          scripts/event-platform/fixtures/kafka-broker-harness.ts
          scripts/event-platform/test-broker-driver.ts
          scripts/event-platform/test-broker-postgres.ts
          src/__tests__/event-platform-worker-process.test.ts
          src/__tests__/event-platform-worker-session.test.ts
          src/__tests__/event-platform-worker-admission.test.ts
          src/__tests__/event-platform-worker-artifact.test.ts
      - name: Prove fixture isolation and actual transaction hook ordering
        run: npx vitest run src/__tests__/event-platform-fund-shadow-fixture.test.ts src/__tests__/event-platform-broker-fixture.test.ts src/__tests__/event-platform-worker-process.test.ts src/__tests__/event-platform-worker-session.test.ts src/__tests__/event-platform-worker-admission.test.ts src/__tests__/event-platform-worker-artifact.test.ts
      - name: Bootstrap and prove the existing disposable migration contract
        run: node scripts/ci/test-event-platform-migrations.mjs
        env:
          EVENT_PLATFORM_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:${{ job.services.fund-postgres.ports['5432'] }}/event_platform_test
      - name: Prove broker membership then real Kafka and restricted PostgreSQL together
        run: bash scripts/event-platform/test-stack.sh
        env:
          FUND_SHADOW_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:${{ job.services.fund-postgres.ports['5432'] }}/event_platform_test
          FUND_SHADOW_DB_GATE: required
      - name: Cleanup this run only
        if: always()
        run: docker compose -p "$LD_EVENT_STACK_PROJECT" -f ops/event-platform/test/compose.yml down --volumes --remove-orphans --timeout 10
      - name: Preserve the verified client-only candidate (not a production install)
        uses: actions/upload-artifact@v4
        with:
          name: fund-shadow-worker-candidate-${{ github.sha }}
          path: ${{ runner.temp }}/leaddrive-worker-artifact
          if-no-files-found: error
          retention-days: 7
