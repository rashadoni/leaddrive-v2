name: Secret scan

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: gitleaks-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_LINUX_X64_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"

jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout full history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Block client-data paths purged from history
        # Второй гейт утечки в этой же джобе — намеренно, и вот почему именно
        # здесь: `scan` уже обязателен в main и уже идёт на КАЖДОМ PR (у этого
        # workflow нет `paths`-фильтра). Отдельный workflow пришлось бы либо
        # делать обязательным без фильтра, либо он не гейтил бы ничего, а
        # path-фильтрованный обязательный чек навсегда вешает PR вне своих
        # путей на «Expected — waiting for status».
        #
        # Шаг стоит ДО установки gitleaks: он ничего не скачивает, а ответ
        # «в ветке данные клиентов» нужен сразу.
        #
        # Смотрим деревья, а не диф: ветка может принести файл коммитом,
        # которого в дифе к базе не видно (добавлен и тут же убран).
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            # HEAD здесь — merge-коммит PR, то есть ровно то дерево, которое
            # получит main; диапазон добавляет каждый коммит самой ветки.
            bash scripts/ci/check-forbidden-data-paths.sh HEAD --history "$BASE_SHA..$HEAD_SHA"
          elif [[ "$EVENT_NAME" == "push" && ! "$BEFORE_SHA" =~ ^0+$ ]]; then
            bash scripts/ci/check-forbidden-data-paths.sh HEAD --history "$BEFORE_SHA..$HEAD_SHA"
          else
            # Ручной прогон и первый пуш репозитория проверяют всё достижимое,
            # как и gitleaks ниже.
            bash scripts/ci/check-forbidden-data-paths.sh HEAD --history --all
          fi

      - name: Install verified Gitleaks binary
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl --fail --silent --show-error --location \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            --output "$archive"
          printf '%s  %s\n' "$GITLEAKS_LINUX_X64_SHA256" "$archive" | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" version

      - name: Select commit range
        id: range
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            log_opts="$BASE_SHA..$HEAD_SHA"
          elif [[ "$EVENT_NAME" == "push" && ! "$BEFORE_SHA" =~ ^0+$ ]]; then
            log_opts="$BEFORE_SHA..$HEAD_SHA"
          else
            # Manual runs and a repository's first push intentionally audit
            # every reachable commit.
            log_opts="--all"
          fi
          echo "Scanning git range: $log_opts"
          echo "log_opts=$log_opts" >> "$GITHUB_OUTPUT"

      - name: Block newly committed secrets
        shell: bash
        env:
          LOG_OPTS: ${{ steps.range.outputs.log_opts }}
        run: |
          "$RUNNER_TEMP/gitleaks" git \
            --config .gitleaks.toml \
            --log-opts="$LOG_OPTS" \
            --redact \
            --no-banner \
            --exit-code 1 \
            .
