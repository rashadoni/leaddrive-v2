name: Deploy to Production

# Staged production pipeline:
#
#   checks ─┐
#           ├─> deploy (ship artifact, then post-deploy smoke)
#   build ──┘
#
#   1. checks — quality/security/tests (PII lint, RLS context gaps, scoped suites)
#   2. build  — clean production Next.js standalone build on an ephemeral
#               GitHub-hosted Linux runner with bounded swap; starts immediately,
#               in parallel with checks, because the compile needs nothing the
#               gates produce
#   3.        — immutable deploy artifact bound to the commit SHA, retained
#               inside this workflow only; the build has no production SSH
#               credential and cannot write to production disk.
#   4. deploy — after both gates and protected-environment admission, downloads
#               and revalidates only that exact artifact, stages it on the
#               production host, and hands it to scripts/server-deploy.sh
#               (atomic swap + prisma migrate deploy + localhost health-check +
#               auto-rollback)
#   5.        — public /api/v1/ping + feature smoke run as the tail of the same
#               job so the production-deploy lock stays held until verification.
#
# WHY build off-box (2026-07-27, reaffirmed after the 2026-09 host move): a
# production or persistent development host must not compete with a Next.js
# compile. The private-repository Ubuntu runner has less RAM than this webpack
# graph's historic unconstrained peak, so a reviewed helper adds at most 4 GiB
# of swap, clamps webpack to one worker, and rejects non-GitHub-hosted runners.
# The build starts without a restored .next cache and never consumes persistent
# host RAM.
#
# WHY webpack again (2026-08-03): turbopack was adopted on 2026-08-02 on solid
# numbers — ~7 min faster, 1.6 GiB lower peak — but it silently stopped the
# service worker from being built. `@serwist/next` is webpack-only: under
# turbopack it prints a warning and never writes `swDest: public/sw.js`, so the
# artifact shipped without one and `/sw.js` answered 404 on every host. That
# killed Web Push (the `push`/`notificationclick` handlers live in src/sw.ts)
# and the /offline shell, and froze every already-registered worker because the
# update fetch 404s too. The build-time assertion further down now fails the
# deploy if sw.js goes missing again, so this cannot regress silently.
# Re-adopting turbopack means migrating to `@serwist/turbopack` first.
#
# Concurrency: the deploy job holds a single-slot production lock
# (cancel-in-progress: false) so a started deploy is never interrupted; the
# post-deploy smoke runs INSIDE the job so the lock is held until prod is
# verified. A newer push supersedes a still-pending (not yet started) deploy.

on:
  push:
    branches: [main]
  # Manual re-deploy from the Actions UI (no code change needed) — rebuilds
  # origin/main HEAD on the external runner and redeploys the same artifact.
  workflow_dispatch:
    inputs:
      deployment_mode:
        description: "normal deploys the application; recovery-bootstrap creates one genesis; recovery-bootstrap-resume finishes its exact interrupted genesis"
        required: false
        default: normal
        type: choice
        options:
          - normal
          - recovery-bootstrap
          - recovery-bootstrap-resume
      recovery_sha:
        description: "Verified SHA of a retained production artifact to promote without rebuilding"
        required: false
        type: string
      recovery_artifact_run_id:
        description: "Successful Deploy to Production run ID that retained leaddrive-prod-<recovery_sha>; required only with recovery_sha"
        required: false
        type: string
      bootstrap_resume_sha:
        description: "Exact historical main SHA from a durable interrupted genesis journal; only for recovery-bootstrap-resume"
        required: false
        type: string

permissions:
  contents: read

env:
  NODE_VERSION: "20"
  EXPECTED_PRODUCTION_HOST: "13.140.132.245"
  DEPLOY_TARGET_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.deployment_mode == 'recovery-bootstrap-resume' && inputs.bootstrap_resume_sha || github.sha }}
  # This is deliberately non-production material. Historical source is
  # compiled/tested only after protected admission and must never receive the
  # live runtime auth secret or URL.
  BUILD_ONLY_NEXTAUTH_SECRET: "leaddrive-ci-build-only-not-a-runtime-secret-8b7d4e7fb4da99da31d73e3c3e0c02a8"
  BUILD_ONLY_NEXTAUTH_URL: "https://build.invalid"

jobs:
  # ── Stage 0: dispatch input preflight ───────────────────────────────
  # This job intentionally checks no repository revision and receives no
  # secret. It turns malformed manual recovery input into a red run before a
  # reviewer is asked to approve historical code or a job is skipped.
  dispatch_input_preflight:
    name: Validate manual deployment inputs
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Reject ambiguous deployment input
        env:
          DEPLOYMENT_MODE: ${{ inputs.deployment_mode }}
          RECOVERY_SHA: ${{ inputs.recovery_sha }}
          RECOVERY_ARTIFACT_RUN_ID: ${{ inputs.recovery_artifact_run_id }}
          BOOTSTRAP_RESUME_SHA: ${{ inputs.bootstrap_resume_sha }}
        run: |
          set -euo pipefail
          case "$DEPLOYMENT_MODE" in
            normal)
              [ -z "$BOOTSTRAP_RESUME_SHA" ] || {
                echo "::error::bootstrap_resume_sha is valid only for recovery-bootstrap-resume"
                exit 1
              }
              if [ -n "$RECOVERY_SHA" ]; then
                [[ "$RECOVERY_SHA" =~ ^[0-9a-f]{40}$ ]] || {
                  echo "::error::recovery_sha must be a 40-character lowercase commit SHA"
                  exit 1
                }
                [[ "$RECOVERY_ARTIFACT_RUN_ID" =~ ^[1-9][0-9]*$ ]] || {
                  echo "::error::recovery_artifact_run_id must be a positive decimal Actions run ID"
                  exit 1
                }
              else
                [ -z "$RECOVERY_ARTIFACT_RUN_ID" ] || {
                  echo "::error::recovery_artifact_run_id is valid only with recovery_sha"
                  exit 1
                }
              fi
              ;;
            recovery-bootstrap)
              [ -z "$RECOVERY_SHA$RECOVERY_ARTIFACT_RUN_ID$BOOTSTRAP_RESUME_SHA" ] || {
                echo "::error::initial recovery-bootstrap cannot use recovery_sha, recovery_artifact_run_id, or bootstrap_resume_sha"
                exit 1
              }
              ;;
            recovery-bootstrap-resume)
              [ -z "$RECOVERY_SHA$RECOVERY_ARTIFACT_RUN_ID" ] || {
                echo "::error::bootstrap resume may not use recovery_sha or recovery_artifact_run_id"
                exit 1
              }
              [[ "$BOOTSTRAP_RESUME_SHA" =~ ^[0-9a-f]{40}$ ]] || {
                echo "::error::bootstrap_resume_sha must be a 40-character lowercase commit SHA"
                exit 1
              }
              ;;
            *)
              echo "::error::deployment_mode must be normal, recovery-bootstrap, or recovery-bootstrap-resume"
              exit 1
              ;;
          esac

  # ── Stage 1: quality / security / tests ─────────────────────────────
  checks:
    name: Quality & security gates
    # Recovery promotes an already verified, SHA-bound artifact. Running the
    # regular gates in that path only wastes runners and, more importantly,
    # must never create a concurrent build while production is being restored.
    if: ${{ always() && !(github.event_name == 'workflow_dispatch' && inputs.recovery_sha != '') && (github.event_name != 'workflow_dispatch' || needs.dispatch_input_preflight.result == 'success') && (inputs.deployment_mode != 'recovery-bootstrap-resume' || needs.resume_build_admission.result == 'success') }}
    needs: [dispatch_input_preflight, resume_build_admission]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      event-platform-postgres:
        image: postgres:16
        env:
          POSTGRES_DB: event_platform_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d event_platform_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    concurrency:
      # A newer main push supersedes a stale in-progress checks run. Safe to
      # cancel: read-only CI work, no production side effects.
      group: ${{ github.event_name == 'workflow_dispatch' && inputs.deployment_mode == 'recovery-bootstrap-resume' && format('prod-bootstrap-resume-checks-{0}', inputs.bootstrap_resume_sha) || format('prod-checks-{0}', github.ref) }}
      cancel-in-progress: ${{ !(github.event_name == 'workflow_dispatch' && inputs.deployment_mode == 'recovery-bootstrap-resume') }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ env.DEPLOY_TARGET_SHA }}
          # Use strings: numeric 0 is falsy in Actions expressions and would
          # silently fall through to shallow depth 1.
          fetch-depth: ${{ github.event_name == 'workflow_dispatch' && inputs.deployment_mode == 'recovery-bootstrap-resume' && '0' || '1' }}

      - name: Validate workflow-dispatch deployment mode
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          DEPLOYMENT_MODE: ${{ inputs.deployment_mode }}
        run: |
          set -euo pipefail
          case "$DEPLOYMENT_MODE" in
            normal|recovery-bootstrap|recovery-bootstrap-resume) ;;
            *)
              echo "::error::deployment_mode must be normal, recovery-bootstrap, or recovery-bootstrap-resume"
              exit 1
              ;;
          esac

      - name: Authorize manually dispatched normal target
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.deployment_mode == 'normal' }}
        env:
          BOOTSTRAP_RESUME_SHA: ${{ inputs.bootstrap_resume_sha }}
        run: |
          set -euo pipefail
          [ -z "$BOOTSTRAP_RESUME_SHA" ] || {
            echo "::error::bootstrap_resume_sha is valid only for recovery-bootstrap-resume"
            exit 1
          }
          [ "$GITHUB_REF" = "refs/heads/main" ] || {
            echo "::error::manual normal deployment may only be dispatched from main"
            exit 1
          }
          git fetch --no-tags --depth=1 origin refs/heads/main
          CURRENT_MAIN_SHA="$(git rev-parse FETCH_HEAD)"
          TARGET_SHA="$(git rev-parse HEAD)"
          [ "$GITHUB_SHA" = "$CURRENT_MAIN_SHA" ] \
            && [ "$TARGET_SHA" = "$CURRENT_MAIN_SHA" ] \
            && [ "$DEPLOY_TARGET_SHA" = "$CURRENT_MAIN_SHA" ] || {
            echo "::error::manual normal deployment must rebuild the exact current main artifact"
            exit 1
          }

      - name: Authorize recovery-bootstrap target
        if: ${{ github.event_name == 'workflow_dispatch' && (inputs.deployment_mode == 'recovery-bootstrap' || inputs.deployment_mode == 'recovery-bootstrap-resume') }}
        env:
          DEPLOYMENT_MODE: ${{ inputs.deployment_mode }}
          RECOVERY_SHA: ${{ inputs.recovery_sha }}
          BOOTSTRAP_RESUME_SHA: ${{ inputs.bootstrap_resume_sha }}
        run: |
          set -euo pipefail
          [ "$GITHUB_REF" = "refs/heads/main" ] || {
            echo "::error::recovery bootstrap may only be dispatched from main"
            exit 1
          }
          # A resume target may be an older main ancestor. Do not re-shallow
          # the full checkout here: that would make its true ancestry appear
          # unreachable and reject a legitimate exact-SHA continuation.
          if [ "$DEPLOYMENT_MODE" = recovery-bootstrap-resume ]; then
            git fetch --no-tags origin refs/heads/main
          else
            git fetch --no-tags --depth=1 origin refs/heads/main
          fi
          CURRENT_MAIN_SHA="$(git rev-parse FETCH_HEAD)"
          TARGET_SHA="$(git rev-parse HEAD)"
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]] \
            && [ "$TARGET_SHA" = "$DEPLOY_TARGET_SHA" ] || {
            echo "::error::checked-out recovery target does not match its requested SHA"
            exit 1
          }
          case "$DEPLOYMENT_MODE" in
            recovery-bootstrap)
              [ -z "$RECOVERY_SHA$BOOTSTRAP_RESUME_SHA" ] \
                && [ "$GITHUB_SHA" = "$CURRENT_MAIN_SHA" ] \
                && [ "$TARGET_SHA" = "$CURRENT_MAIN_SHA" ] || {
                  echo "::error::initial recovery-bootstrap must build the exact current main artifact without a resume SHA"
                  exit 1
                }
              ;;
            recovery-bootstrap-resume)
              [ -z "$RECOVERY_SHA" ] \
                && [[ "$BOOTSTRAP_RESUME_SHA" =~ ^[0-9a-f]{40}$ ]] \
                && [ "$TARGET_SHA" = "$BOOTSTRAP_RESUME_SHA" ] \
                && git merge-base --is-ancestor "$TARGET_SHA" "$CURRENT_MAIN_SHA" || {
                  echo "::error::bootstrap resume must rebuild an exact SHA reachable from current main and may not use recovery_sha"
                  exit 1
                }
              ;;
            *) echo "::error::unsupported recovery bootstrap mode"; exit 1 ;;
          esac

      - name: Remove checkout credential before repository code
        # checkout temporarily needs the read-only token for the ancestry fetch
        # above. No repository-controlled install, test, or build process may
        # inherit that credential afterward.
        run: |
          git config --local --unset-all http.https://github.com/.extraheader || true
          git config --local --unset-all credential.helper || true
          if git config --local --get-regexp '^(http\..*extraheader|credential\.helper)$' >/dev/null; then
            echo "::error::checkout credential remained after authorization"
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Cache node_modules
        uses: actions/cache@v5
        id: cache-deps
        with:
          path: node_modules
          key: deps-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            deps-${{ runner.os }}-

      - name: Install dependencies
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Generate frozen pre-pilot Prisma client
        run: npx prisma generate --schema scripts/ci/fixtures/event-platform-legacy-client/schema.prisma
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/event_platform_test

      - name: Event-platform Kafka and schema asset gate
        run: node scripts/ci/test-event-platform-assets.mjs

      - name: Event-platform migration and database invariant gate
        run: node scripts/ci/test-event-platform-migrations.mjs
        env:
          EVENT_PLATFORM_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/event_platform_test

      - name: Event-platform SDK PostgreSQL concurrency gate
        run: npx vitest run src/__tests__/lib-event-platform-postgres.test.ts
        env:
          EVENT_PLATFORM_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/event_platform_test

      - name: Previous Prisma client rollback-window gate
        run: node scripts/event-platform-legacy-client-probe.mjs
        env:
          LEGACY_PRISMA_CLIENT_MODULE: ${{ github.workspace }}/node_modules/.event-platform-legacy-client
          LEGACY_RUNTIME_DATABASE_URL: postgresql://event_app:event-app-password@127.0.0.1:5432/event_platform_test
          LEGACY_VERIFY_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/event_platform_test

      - name: Run security gates
        run: |
          npm run lint:pii-columns
          python3 scripts/rls/find-context-gaps.py
          npm test -- --run \
            src/__tests__/lib-tenant-pii-encryption.test.ts \
            src/__tests__/lib-secure-token.test.ts \
            src/__tests__/ai-pii-masker.test.ts \
            src/__tests__/ai-prompt-safety.test.ts \
            src/__tests__/no-bare-anthropic-constructor.test.ts \
            src/__tests__/api-build-info.test.ts \
            src/__tests__/lib-event-platform-catalog.test.ts \
            src/__tests__/lib-event-platform-foundation.test.ts \
            src/__tests__/api-finance-funds.test.ts \
            src/__tests__/workforce-retention-guard.test.ts
        env:
          NEXTAUTH_SECRET: ${{ env.BUILD_ONLY_NEXTAUTH_SECRET }}

      - name: Run MTM + auth + i18n tests
        # Scoped to MTM + auth + i18n suites this branch introduced/hardened.
        # Vitest --run treats each positional arg as a substring filter (not
        # regex), so we pass four args rather than a single `(a|b|c|d)` group
        # — that group form is matched literally and returns 0 files.
        # Pre-existing failures outside this scope (api-ai, projects-detail,
        # workflow-email-notifications) are tracked separately and shouldn't
        # block MTM deploys.
        run: npm test -- --run src/__tests__/api-mtm src/__tests__/lib-auth src/__tests__/lib-tenant-domain src/__tests__/lib-i18n
        env:
          NEXTAUTH_SECRET: ${{ env.BUILD_ONLY_NEXTAUTH_SECRET }}

      - name: Run Gemini-only browser voice regression gate
        run: |
          npm test -- --run \
            src/__tests__/gemini-live-voice.test.ts \
            src/__tests__/gemini-live-browser.test.ts \
            src/__tests__/gemini-live-worklets.test.ts \
            src/__tests__/api-ai-voice-token-lifecycle.test.ts \
            src/__tests__/api-ai-voice-connected-lifecycle.test.ts \
            src/__tests__/api-ai-voice-session-start.test.ts \
            src/__tests__/api-ai-voice-session-end.test.ts \
            src/__tests__/api-ai-voice-session-reaper.test.ts \
            src/__tests__/api-ai-voice-read-access.test.ts \
            src/__tests__/api-ai-voice-trace-privacy.test.ts \
            src/__tests__/voice-console-gemini-ui.test.ts \
            src/__tests__/voice-gate-budget.test.ts \
            src/__tests__/voice-gemini-provider-fence.test.ts \
            src/__tests__/csp.test.ts
        env:
          NEXTAUTH_SECRET: ${{ env.BUILD_ONLY_NEXTAUTH_SECRET }}

      - name: Unit tests vs baseline (BLOCKING)
        # Production must enforce the same file-level full-suite contract as
        # pull requests. A main push once deployed while this gate was red
        # because the deploy workflow ran only the scoped suites above.
        run: node scripts/check-test-baseline.mjs

  # ── Stage 2 + 3: external build + SHA-bound artifact publication ───
  # A main ancestor is operationally eligible for an exact resume but is not
  # automatically entitled to observe current CI secrets. The protected
  # admission runs no repository code; it must pass before that historical SHA
  # can reach the build runner. It intentionally uses the normal production
  # environment semantics so required reviewers and any custom protection rule
  # apply before historical code is executed.
  resume_build_admission:
    name: Approve historical bootstrap-resume build
    if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.deployment_mode == 'recovery-bootstrap-resume' && needs.dispatch_input_preflight.result == 'success' }}
    needs: [dispatch_input_preflight]
    runs-on: ubuntu-24.04
    permissions:
      actions: read
    environment:
      name: production
    concurrency:
      group: ${{ format('prod-bootstrap-resume-admission-{0}', inputs.bootstrap_resume_sha) }}
      cancel-in-progress: false
    steps:
      # The independent-reviewer requirement that used to stand here is gone:
      # GitHub only offers it for private repositories on Enterprise, so on this
      # plan it made production undeployable instead of protecting it. Its
      # replacement is layer 2 of docs/DELIVERY-ARCHITECTURE.md — every pull
      # request is read by an agent that did not write it. What survives here is
      # the part that does work on this plan and matters most: production is
      # only ever built from main.
      - name: Require historical build to come only from main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          branch_policies="$(gh api "repos/${GITHUB_REPOSITORY}/environments/production/deployment-branch-policies")" || {
            echo "::error::Cannot inspect GitHub production deployment branch policies; refusing historical build"
            exit 1
          }
          jq -e '
            (.branch_policies | length == 1)
            and (.branch_policies[0].name == "main")
          ' <<<"$branch_policies" >/dev/null || {
            echo "::error::GitHub production environment must allow exactly the main branch"
            exit 1
          }

      - name: Confirm protected historical-build admission
        run: |
          echo "Approved admission is required before the exact historical bootstrap artifact is built."

  build:
    name: Production build & publish artifact
    # A recovery dispatch is intentionally build-free: it promotes the staged
    # artifact below. Keep this guard in sync with `checks` so recovery cannot
    # accidentally spawn a second build alongside the atomic restore.
    if: ${{ always() && !(github.event_name == 'workflow_dispatch' && inputs.recovery_sha != '') && (github.event_name != 'workflow_dispatch' || needs.dispatch_input_preflight.result == 'success') && (inputs.deployment_mode != 'recovery-bootstrap-resume' || needs.resume_build_admission.result == 'success') }}
    needs: [dispatch_input_preflight, resume_build_admission]
    # Deliberately NOT `needs: [checks]`. The compile itself depends on nothing
    # the gates produce, and the gates (~2 min) used to sit on the critical path
    # ahead of a ~13 min build. The gate ordering that actually matters — no
    # production mutation until checks and protected deploy admission succeed.
    # A historical bootstrap resume has one extra protected admission above
    # before its exact ancestor is allowed to run a build.
    # Production artifacts must be built on an isolated, ephemeral Linux VM.
    # scripts/ci/prepare-hosted-build-runner.sh rejects self-hosted runners and
    # provisions a bounded RAM+swap budget for the one-worker webpack build.
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    concurrency:
      group: ${{ github.event_name == 'workflow_dispatch' && inputs.deployment_mode == 'recovery-bootstrap-resume' && format('prod-bootstrap-resume-build-{0}', inputs.bootstrap_resume_sha) || format('prod-build-{0}', github.ref) }}
      cancel-in-progress: ${{ !(github.event_name == 'workflow_dispatch' && inputs.deployment_mode == 'recovery-bootstrap-resume') }}

    steps:
      - name: Validate workflow-dispatch deployment mode
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          DEPLOYMENT_MODE: ${{ inputs.deployment_mode }}
        run: |
          set -euo pipefail
          case "$DEPLOYMENT_MODE" in
            normal|recovery-bootstrap|recovery-bootstrap-resume) ;;
            *)
              echo "::error::deployment_mode must be normal, recovery-bootstrap, or recovery-bootstrap-resume"
              exit 1
              ;;
          esac

      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ env.DEPLOY_TARGET_SHA }}
          # Use strings: numeric 0 is falsy in Actions expressions and would
          # silently fall through to shallow depth 1.
          fetch-depth: ${{ github.event_name == 'workflow_dispatch' && inputs.deployment_mode == 'recovery-bootstrap-resume' && '0' || '1' }}

      # Build begins in parallel with checks, so authorize a manually chosen
      # historical SHA before any repository-owned setup script, dependency
      # install, or build secret can be exposed to it.
      - name: Authorize workflow-dispatch build target
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          DEPLOYMENT_MODE: ${{ inputs.deployment_mode }}
          RECOVERY_SHA: ${{ inputs.recovery_sha }}
          BOOTSTRAP_RESUME_SHA: ${{ inputs.bootstrap_resume_sha }}
        run: |
          set -euo pipefail
          [ "$GITHUB_REF" = "refs/heads/main" ] || {
            echo "::error::manual deployment may only be dispatched from main"
            exit 1
          }
          if [ "$DEPLOYMENT_MODE" = recovery-bootstrap-resume ]; then
            git fetch --no-tags origin refs/heads/main
          else
            git fetch --no-tags --depth=1 origin refs/heads/main
          fi
          CURRENT_MAIN_SHA="$(git rev-parse FETCH_HEAD)"
          TARGET_SHA="$(git rev-parse HEAD)"
          case "$DEPLOYMENT_MODE" in
            normal)
              [ -z "$RECOVERY_SHA$BOOTSTRAP_RESUME_SHA" ] \
                && [ "$GITHUB_SHA" = "$CURRENT_MAIN_SHA" ] \
                && [ "$TARGET_SHA" = "$CURRENT_MAIN_SHA" ] \
                && [ "$DEPLOY_TARGET_SHA" = "$CURRENT_MAIN_SHA" ] || {
                echo "::error::manual normal build must use the exact current main artifact"
                exit 1
              }
              ;;
            recovery-bootstrap)
              [ -z "$RECOVERY_SHA$BOOTSTRAP_RESUME_SHA" ] \
                && [ "$GITHUB_SHA" = "$CURRENT_MAIN_SHA" ] \
                && [ "$TARGET_SHA" = "$CURRENT_MAIN_SHA" ] || {
                echo "::error::initial recovery-bootstrap build must use the exact current main artifact"
                exit 1
              }
              ;;
            recovery-bootstrap-resume)
              [ -z "$RECOVERY_SHA" ] \
                && [[ "$BOOTSTRAP_RESUME_SHA" =~ ^[0-9a-f]{40}$ ]] \
                && [ "$TARGET_SHA" = "$BOOTSTRAP_RESUME_SHA" ] \
                && git merge-base --is-ancestor "$TARGET_SHA" "$CURRENT_MAIN_SHA" || {
                echo "::error::bootstrap-resume build must use an exact SHA reachable from current main"
                exit 1
              }
              ;;
            *)
              echo "::error::unsupported deployment mode"
              exit 1
              ;;
          esac

      - name: Remove checkout credential before repository code
        # The checkout token is needed only for the exact-main/ancestor proof.
        # In particular, a historical resume must not inherit a live GitHub
        # credential into npm lifecycle hooks or the Next build.
        run: |
          git config --local --unset-all http.https://github.com/.extraheader || true
          git config --local --unset-all credential.helper || true
          if git config --local --get-regexp '^(http\..*extraheader|credential\.helper)$' >/dev/null; then
            echo "::error::checkout credential remained after authorization"
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Prepare bounded GitHub-hosted build memory
        run: bash scripts/ci/prepare-hosted-build-runner.sh

      - name: Install dependencies from lockfile
        # Intentionally do not restore node_modules or .next/cache here. A
        # previously interrupted webpack cache grew to 24 GiB on the server;
        # a clean external runner gives this build a deterministic footprint.
        run: |
          npm ci
          npm cache clean --force

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Stamp the revision into the bundle
        # Compiled in, not written beside the build: a marker file only proves
        # which files were unpacked, while this constant travels inside the
        # JavaScript the running process loads, so /api/v1/public/build-info
        # cannot report a revision the live process is not actually running.
        run: |
          printf 'export const DEPLOY_SHA = "%s"\nexport const BUILT_AT = "%s"\n' \
            "$DEPLOY_TARGET_SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > src/generated/build-sha.ts
          cat src/generated/build-sha.ts

      - name: Build Next.js standalone
        # @serwist requires webpack for sw.js. Next compiles server, edge and
        # client in sequential disposable workers; the 8 GiB heap leaves the
        # hosted runner's proven 12 GiB RAM+swap floor room for native code and
        # the runner service. The cold build disables its unconsumed cache.
        run: |
          test -n "${NEXT_PUBLIC_CARTO_BASEMAPS_API_KEY:-}" || {
            echo "::error::CARTO_BASEMAPS_API_KEY GitHub secret is required to build MTM maps"
            exit 1
          }
          ulimit -c 0
          npx next build --webpack
        env:
          NODE_OPTIONS: --max-old-space-size=8192
          NEXT_BUILD_CPUS: "1"
          NEXT_WEBPACK_PARALLELISM: "1"
          LEADDRIVE_COLD_PRODUCTION_BUILD: "1"
          NEXTAUTH_SECRET: ${{ env.BUILD_ONLY_NEXTAUTH_SECRET }}
          NEXTAUTH_URL: ${{ env.BUILD_ONLY_NEXTAUTH_URL }}
          # Next.js inlines NEXT_PUBLIC_* values into browser bundles. CARTO
          # raster tiles require this referrer-restricted key in their URL.
          NEXT_PUBLIC_CARTO_BASEMAPS_API_KEY: ${{ secrets.CARTO_BASEMAPS_API_KEY }}

      - name: Verify standalone build
        run: |
          test -f .next/standalone/server.js || { echo "::error::server.js missing"; exit 1; }
          test -d .next/static || { echo "::error::.next/static missing"; exit 1; }
          CSS_COUNT="$(find .next/static -name '*.css' | wc -l)"
          JS_COUNT="$(find .next/static -name '*.js' | wc -l)"
          echo "CSS files: $CSS_COUNT, JS files: $JS_COUNT"
          [ "$CSS_COUNT" -gt 0 ] || { echo "::error::No CSS files in build"; exit 1; }
          [ "$JS_COUNT" -gt 0 ] || { echo "::error::No JS files in build"; exit 1; }
          # zod@4 declares itself side-effect-free while its barrel registers the
          # English locale at import time, so a tree-shaken build silently loses
          # every validation message and answers a bare "Invalid input" instead
          # (2026-09-10: tenant provisioning, field unnamed). next.config.ts keeps
          # the barrel in the graph; this asserts the artifact actually has it.
          grep -rqs --include='*.js' 'Invalid input: expected' .next/server || {
            echo "::error::zod locale missing from the server bundle — validation errors would degrade to a bare \"Invalid input\""
            exit 1
          }
          # The cache is not deployable content. Reclaim its disk before the
          # standalone copy and tarball are created on the 14 GB runner disk.
          rm -rf -- .next/cache

      - name: Assemble standalone bundle
        run: |
          mkdir -p .next/standalone/.next
          cp -r .next/static .next/standalone/.next/static

          MANIFEST_COPIED=0
          while IFS= read -r src; do
            rel="${src#.next/server/}"
            dest=".next/standalone/.next/server/${rel}"
            mkdir -p "$(dirname "$dest")"
            cp "$src" "$dest"
            MANIFEST_COPIED=$((MANIFEST_COPIED + 1))
          done < <(find .next/server/app -name '*_client-reference-manifest.js')
          echo "::notice::Copied $MANIFEST_COPIED client-reference-manifest file(s)"
          if [ -f ".next/server/app/(dashboard)/social-monitoring/page_client-reference-manifest.js" ] \
             && [ ! -f ".next/standalone/.next/server/app/(dashboard)/social-monitoring/page_client-reference-manifest.js" ]; then
            echo "::error::social-monitoring client-reference-manifest missing from standalone"
            exit 1
          fi

          mkdir -p .next/standalone/node_modules
          cp -r node_modules/.prisma .next/standalone/node_modules/.prisma
          cp -r node_modules/@prisma .next/standalone/node_modules/@prisma

          mkdir -p .next/standalone/public
          cp -r public/. .next/standalone/public/

          # The service worker is GENERATED by @serwist/next during the build
          # (swDest: public/sw.js) and is gitignored, so a build that quietly
          # skips serwist — as the turbopack build did from 2026-08-02 — ships an
          # artifact with no worker at all and /sw.js starts answering 404
          # everywhere. That takes Web Push and the /offline shell down without
          # failing anything, which is exactly why it went unnoticed. Assert it.
          if [ ! -f .next/standalone/public/sw.js ]; then
            echo "::error::public/sw.js missing from the standalone artifact — @serwist/next did not run (webpack-only; check the build flags)"
            exit 1
          fi
          echo "::notice::Service worker staged ($(wc -c < .next/standalone/public/sw.js) bytes)"

          if [ -d video/player ]; then
            mkdir -p .next/standalone/help-videos/player
            cp -r video/player/. .next/standalone/help-videos/player/
            HELP_VIDEO_ASSET_VERSION="$(
              sed -nE 's/^const HELP_VIDEO_ASSET_VERSION = "([^"]+)"$/\1/p' \
                src/content/help/video-assets.ts
            )"
            [ -n "$HELP_VIDEO_ASSET_VERSION" ] || {
              echo "::error::Could not read HELP_VIDEO_ASSET_VERSION"
              exit 1
            }
            printf '%s\n' "$HELP_VIDEO_ASSET_VERSION" > .next/standalone/help-videos/asset-version
          fi

          cp -r prisma .next/standalone/prisma

          mkdir -p .next/standalone/scripts
          cp -r scripts/*.mjs .next/standalone/scripts/ 2>/dev/null || true
          cp -r scripts/*.ts  .next/standalone/scripts/ 2>/dev/null || true
          cp -r scripts/*.sh  .next/standalone/scripts/ 2>/dev/null || true
          cp scripts/event-platform-postconditions.sql .next/standalone/scripts/
          test -s .next/standalone/scripts/event-platform-postconditions.sql || {
            echo "::error::event-platform production postcondition missing from standalone artifact"
            exit 1
          }
          test -s .next/standalone/scripts/event-platform-legacy-client-probe.mjs || {
            echo "::error::event-platform legacy-client probe missing from standalone artifact"
            exit 1
          }
          CRON_SCRIPT_ALLOWLIST="ops/cron/release-script-allowlist.txt"
          test -s "$CRON_SCRIPT_ALLOWLIST" || {
            echo "::error::release cron-script allowlist is empty"
            exit 1
          }
          LC_ALL=C sort -cu "$CRON_SCRIPT_ALLOWLIST" || {
            echo "::error::release cron-script allowlist must be sorted and unique"
            exit 1
          }
          while IFS= read -r script; do
            [[ "$script" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*\.sh$ ]] || {
              echo "::error::unsafe cron script allowlist entry: $script"
              exit 1
            }
            test -x "scripts/$script" || {
              echo "::error::release cron script missing or not executable: $script"
              exit 1
            }
          done < "$CRON_SCRIPT_ALLOWLIST"
          cp "$CRON_SCRIPT_ALLOWLIST" .next/standalone/scripts/release-cron-script-manifest.txt
          mkdir -p .next/standalone/scripts/seeds
          cp -r scripts/seeds/*.mjs .next/standalone/scripts/seeds/ 2>/dev/null || true

          # Backup, log-shipping and secret-snapshot jobs are release-owned
          # operational code. They used to be scp'd into the stale checkout,
          # which both hid the reviewed version and made `git status` dirty on
          # every release. Bundle them beside the artifact instead.
          mkdir -p .next/standalone/scripts/backup
          cp -r scripts/backup/. .next/standalone/scripts/backup/
          for file in hash-recovery-db-contract.sh hash-recovery-program-set.sh postgres-backup.sh postgres-restore-canary.sh prove-source-database.sh ship-logs.sh snapshot-runtime-files.sh snapshot-secrets.sh; do
            test -x ".next/standalone/scripts/backup/$file" || {
              echo "::error::release-owned backup script missing: $file"
              exit 1
            }
          done
          scripts/backup/hash-recovery-db-contract.sh --manifest "$GITHUB_WORKSPACE" \
            >.next/standalone/scripts/backup/recovery-db-contract.tsv
          test "$(sha256sum .next/standalone/scripts/backup/recovery-db-contract.tsv | awk '{print $1}')" = \
            "$(.next/standalone/scripts/backup/hash-recovery-db-contract.sh .next/standalone)" || {
            echo "::error::release recovery DB contract manifest differs from Prisma schema/migrations"
            exit 1
          }

          # Unit/logrotate definitions are installed by server-deploy.sh only
          # after the app health check passes. Keeping them in the same
          # immutable artifact prevents a source-checkout copy from drifting.
          mkdir -p .next/standalone/ops/backup .next/standalone/ops/systemd .next/standalone/ops/logrotate
          cp -r ops/backup/. .next/standalone/ops/backup/
          cp -r ops/systemd/. .next/standalone/ops/systemd/
          cp -r ops/logrotate/. .next/standalone/ops/logrotate/
          for file in \
            leaddrive-log-ship.service \
            leaddrive-log-ship.timer \
            leaddrive-postgres-backup.service \
            leaddrive-postgres-backup.timer \
            leaddrive-runtime-files-snapshot.service \
            leaddrive-runtime-files-snapshot.timer \
            leaddrive-secrets-snapshot.service \
            leaddrive-secrets-snapshot.timer; do
            test -f ".next/standalone/ops/systemd/$file" || {
              echo "::error::release-owned systemd unit missing: $file"
              exit 1
            }
          done
          for file in leaddrive-v2 leaddrive-cron-logs; do
            test -f ".next/standalone/ops/logrotate/$file" || {
              echo "::error::release-owned logrotate definition missing: $file"
              exit 1
            }
          done
          test -f .next/standalone/ops/backup/backup.env.example
          test -f .next/standalone/ops/backup/recovery-program-set.files

          # The RLS maintenance scripts run ON PRODUCTION, against the live
          # database, as the BYPASSRLS migration role — `cleanup-orphan-tenant-rows.sql`
          # DELETEs rows. The globs above match only the top level of scripts/,
          # so this whole directory was missing from every release and had to be
          # scp'd by hand. That is the dangerous part: a deploy wipes and
          # re-extracts standalone, so hand-delivered copies disappear at the
          # next deploy and the runbook command silently resolves against
          # $APP_DIR's git checkout instead — on 2026-08-28 that checkout was 11
          # days stale, held a different enable-batch-4.sql, and did not contain
          # the cleanup script at all. Shipping the directory with the release
          # makes the copy on the box the copy that was reviewed.
          #
          # Whole subdirectory, not just *.sql: enable-one.sh and
          # verify-coverage.mjs are documented as server-side helpers too
          # (docs/rls-core-tables-runbook.md), and an extension list is exactly
          # what failed here. No secrets — these are DDL and catalog queries;
          # the credential stays in /etc/leaddrive/migration.env (root, 0600).
          #
          # Asserted rather than `|| true`, like the relay above: this can only
          # fail if the directory is renamed or removed, and that is a change
          # whose author should be told, in CI, before the artifact is staged.
          mkdir -p .next/standalone/scripts/rls
          cp -r scripts/rls/. .next/standalone/scripts/rls/
          if [ ! -f .next/standalone/scripts/rls/cleanup-orphan-tenant-rows.sql ]; then
            echo "::error::RLS maintenance scripts missing from the standalone artifact"
            exit 1
          fi

          # The softphone relay is a long-running pm2 app, not a maintenance
          # script, so unlike everything above it MUST be here or the deploy
          # fails outright: pm2 starts every app in the ecosystem file and a
          # missing script file is a non-zero exit for the whole start. That is
          # exactly what happened on 2026-08-24 - the globs above only match
          # scripts/ at the top level, the relay lives in a subdirectory, and
          # production rolled back after the swap.
          #
          # Staged with an explicit assertion rather than the `|| true` used for
          # optional helpers: a relay silently absent means every browser call
          # reaches an answered customer and then finds nobody to join them to.
          mkdir -p .next/standalone/scripts/softphone-relay
          cp -r scripts/softphone-relay/. .next/standalone/scripts/softphone-relay/
          if [ ! -f .next/standalone/scripts/softphone-relay/relay.mjs ]; then
            echo "::error::softphone relay missing from the standalone artifact"
            exit 1
          fi

          # `ws` is the relay's only non-builtin import, and Next traces only
          # what the WEB app imports - which is not this. Copied beside the
          # other hand-staged runtime deps so resolution cannot depend on the
          # server happening to still have a repo checkout at /opt.
          cp -r node_modules/ws .next/standalone/node_modules/ws
          if [ ! -d .next/standalone/node_modules/ws ]; then
            echo "::error::ws missing from the standalone artifact — the relay cannot start"
            exit 1
          fi

          cp ecosystem.config.cjs .next/standalone/ecosystem.config.cjs
          [[ "$DEPLOY_TARGET_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::DEPLOY_TARGET_SHA is not a full commit SHA"
            exit 1
          }
          printf '%s\n' "$DEPLOY_TARGET_SHA" > .next/standalone/.deploy-sha
          [ ! -e .next/standalone/.event-platform-fund-atomic-insert-first-v1 ] \
            && [ ! -L .next/standalone/.event-platform-fund-atomic-insert-first-v1 ] || {
            echo "::error::final artifact must not claim the one-release Fund atomic prerequisite contract"
            exit 1
          }

      - name: Create deployment tarball
        run: |
          cd .next/standalone
          test "$(tr -d '\r\n' < .deploy-sha)" = "$DEPLOY_TARGET_SHA"
          tar -czf "/tmp/leaddrive-prod-${DEPLOY_TARGET_SHA}.tar.gz" .
          echo "::notice::Tarball size: $(du -h "/tmp/leaddrive-prod-${DEPLOY_TARGET_SHA}.tar.gz" | cut -f1)"

      - name: Upload SHA-bound deploy artifact
        # The build job can create an immutable candidate but receives no
        # production SSH credential. Only the protected deploy job consumes it.
        # Thirty days covers the bounded emergency rollback horizon without
        # retaining runtime secrets (the artifact contains none).
        uses: actions/upload-artifact@v7
        with:
          name: leaddrive-prod-${{ env.DEPLOY_TARGET_SHA }}
          path: /tmp/leaddrive-prod-${{ env.DEPLOY_TARGET_SHA }}.tar.gz
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Cleanup bounded build swap
        if: always()
        run: bash scripts/ci/prepare-hosted-build-runner.sh cleanup

  # ── Stage 4 + 5: deploy external artifact, then smoke ───────────────
  deploy:
    name: Deploy to production & post-deploy smoke
    # `always()` is required because checks/build deliberately depend on
    # mode-specific jobs that are skipped during a normal push. Without it,
    # Actions propagates that upstream skip and silently skips production even
    # after both direct prerequisites succeeded.
    if: ${{ always() && needs.checks.result == 'success' && needs.build.result == 'success' && !(github.event_name == 'workflow_dispatch' && inputs.recovery_sha != '') }}
    needs: [checks, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    environment:
      name: production
    # The one-time Fund cutover may spend up to two hours producing a fresh,
    # restore-drilled encrypted backup and two hours on deep reconciliation.
    # Routine releases keep their short on-box deadlines and finish normally.
    timeout-minutes: 300
    concurrency:
      # Single-slot production lock (see header):
      #   - cancel-in-progress: false — a deploy that has started is NEVER
      #     interrupted by newer pushes.
      #   - default queue semantics — a newer push replaces the superseded
      #     pending deploy, so only the newest main deploys next.
      #   - the post-deploy smoke runs INSIDE this job, so the lock is held
      #     until the public probes pass.
      group: production-deploy
      cancel-in-progress: false
    env:
      # A bootstrap is intentionally not an application deployment: it may
      # install only the immutable recovery operations needed to create and
      # prove the first log-evidence anchor.  Keep the mode explicit all the
      # way to the SHA-bound server-side ceremony.
      DEPLOYMENT_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.deployment_mode || 'normal' }}

    steps:
      # See the note on the same check in the historical-build job: the
      # independent-reviewer rule is unavailable on this plan and is replaced by
      # the agent review on every pull request.
      - name: Require production to deploy only from main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          branch_policies="$(gh api "repos/${GITHUB_REPOSITORY}/environments/production/deployment-branch-policies")" || {
            echo "::error::Cannot inspect GitHub production deployment branch policies; refusing deployment"
            exit 1
          }
          jq -e '
            (.branch_policies | length == 1)
            and (.branch_policies[0].name == "main")
          ' <<<"$branch_policies" >/dev/null || {
            echo "::error::GitHub production environment must allow exactly the main branch"
            exit 1
          }

      - name: Checkout code
        # The app was built by the external build job; this checkout supplies
        # server-deploy.sh and the authenticated smoke script only.
        uses: actions/checkout@v6
        with:
          ref: ${{ env.DEPLOY_TARGET_SHA }}
          # Use strings: numeric 0 is falsy in Actions expressions and would
          # silently fall through to shallow depth 1.
          fetch-depth: ${{ github.event_name == 'workflow_dispatch' && inputs.deployment_mode == 'recovery-bootstrap-resume' && '0' || '1' }}

      - name: Validate workflow-dispatch deployment mode
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          set -euo pipefail
          case "$DEPLOYMENT_MODE" in
            normal|recovery-bootstrap|recovery-bootstrap-resume) ;;
            *)
              echo "::error::deployment_mode must be normal, recovery-bootstrap, or recovery-bootstrap-resume"
              exit 1
              ;;
          esac

      - name: Recheck manually dispatched normal target
        if: ${{ github.event_name == 'workflow_dispatch' && env.DEPLOYMENT_MODE == 'normal' }}
        env:
          BOOTSTRAP_RESUME_SHA: ${{ inputs.bootstrap_resume_sha }}
        run: |
          set -euo pipefail
          [ -z "$BOOTSTRAP_RESUME_SHA" ] || {
            echo "::error::bootstrap_resume_sha is valid only for recovery-bootstrap-resume"
            exit 1
          }
          [ "$GITHUB_REF" = "refs/heads/main" ] || {
            echo "::error::manual normal deployment may only be dispatched from main"
            exit 1
          }
          git fetch --no-tags --depth=1 origin refs/heads/main
          CURRENT_MAIN_SHA="$(git rev-parse FETCH_HEAD)"
          TARGET_SHA="$(git rev-parse HEAD)"
          [ "$GITHUB_SHA" = "$CURRENT_MAIN_SHA" ] \
            && [ "$TARGET_SHA" = "$CURRENT_MAIN_SHA" ] \
            && [ "$DEPLOY_TARGET_SHA" = "$CURRENT_MAIN_SHA" ] || {
            echo "::error::manual normal deployment must rebuild the exact current main artifact"
            exit 1
          }

      - name: Recheck recovery-bootstrap target
        if: ${{ env.DEPLOYMENT_MODE == 'recovery-bootstrap' || env.DEPLOYMENT_MODE == 'recovery-bootstrap-resume' }}
        env:
          RECOVERY_SHA: ${{ inputs.recovery_sha }}
          BOOTSTRAP_RESUME_SHA: ${{ inputs.bootstrap_resume_sha }}
        run: |
          set -euo pipefail
          [ "$GITHUB_REF" = "refs/heads/main" ] || {
            echo "::error::recovery bootstrap may only be dispatched from main"
            exit 1
          }
          # Preserve the complete history supplied for exact-SHA resume; a
          # shallow fetch of current main would falsely reject older ancestors.
          if [ "$DEPLOYMENT_MODE" = recovery-bootstrap-resume ]; then
            git fetch --no-tags origin refs/heads/main
          else
            git fetch --no-tags --depth=1 origin refs/heads/main
          fi
          CURRENT_MAIN_SHA="$(git rev-parse FETCH_HEAD)"
          TARGET_SHA="$(git rev-parse HEAD)"
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]] \
            && [ "$TARGET_SHA" = "$DEPLOY_TARGET_SHA" ] || {
            echo "::error::checked-out recovery target does not match its requested SHA"
            exit 1
          }
          case "$DEPLOYMENT_MODE" in
            recovery-bootstrap)
              [ -z "$RECOVERY_SHA$BOOTSTRAP_RESUME_SHA" ] \
                && [ "$GITHUB_SHA" = "$CURRENT_MAIN_SHA" ] \
                && [ "$TARGET_SHA" = "$CURRENT_MAIN_SHA" ] || {
                  echo "::error::initial recovery-bootstrap must build the exact current main artifact without a resume SHA"
                  exit 1
                }
              ;;
            recovery-bootstrap-resume)
              [ -z "$RECOVERY_SHA" ] \
                && [[ "$BOOTSTRAP_RESUME_SHA" =~ ^[0-9a-f]{40}$ ]] \
                && [ "$TARGET_SHA" = "$BOOTSTRAP_RESUME_SHA" ] \
                && git merge-base --is-ancestor "$TARGET_SHA" "$CURRENT_MAIN_SHA" || {
                  echo "::error::bootstrap resume must rebuild an exact SHA reachable from current main and may not use recovery_sha"
                  exit 1
                }
              ;;
            *) echo "::error::unsupported recovery bootstrap mode"; exit 1 ;;
          esac

      - name: Setup SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_SSH_KNOWN_HOSTS: ${{ secrets.SERVER_SSH_KNOWN_HOSTS }}
        run: |
          [ "$SERVER_HOST" = "$EXPECTED_PRODUCTION_HOST" ] || {
            echo "::error::SERVER_HOST is not the reviewed production host"
            exit 1
          }
          test -n "$DEPLOY_SSH_KEY" || { echo "::error::SSH_PRIVATE_KEY is empty"; exit 1; }
          test -n "$SERVER_SSH_KNOWN_HOSTS" || { echo "::error::SERVER_SSH_KNOWN_HOSTS is empty"; exit 1; }
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$SERVER_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/deploy_key ~/.ssh/known_hosts
          ssh-keygen -F "$SERVER_HOST" -f ~/.ssh/known_hosts >/dev/null || {
            echo "::error::Pinned known_hosts does not contain SERVER_HOST"
            exit 1
          }
          # Production sshd is internet-facing and permanently under brute-force
          # load. MaxStartups is a GLOBAL pre-auth limit, not a per-IP one, so
          # during a flood sshd silently refuses NEW connections whatever their
          # source — on 2026-08-18 that locked everyone out for ~55 minutes, and
          # a runner is refused exactly like anyone else. Multiplexing collapses
          # this job's ssh/scp calls onto ONE authenticated connection, so only
          # the first one can be refused, and it retries below.
          cat > ~/.ssh/config <<'SSHCFG'
          Host *
            StrictHostKeyChecking yes
            UserKnownHostsFile ~/.ssh/known_hosts
            ControlMaster auto
            ControlPath ~/.ssh/cm-%r@%h:%p
            ControlPersist 15m
            ConnectTimeout 30
            ConnectionAttempts 2
            ServerAliveInterval 15
            ServerAliveCountMax 4
          SSHCFG
          chmod 600 ~/.ssh/config
          # Open the master with backoff. If every attempt fails we do NOT abort:
          # the later steps still dial on their own, which is exactly today's
          # behaviour, so this can only add resilience, never remove it.
          for attempt in 1 2 3 4; do
            # stderr goes to a file: the backgrounded master keeps whatever fd
            # it inherits open for its whole life, and holding the step's pipe
            # can keep the step from returning.
            if ssh -f -N -i ~/.ssh/deploy_key \
              ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} 2>/tmp/ssh-master.log; then
              echo "ssh master established (attempt $attempt)"
              break
            fi
            if [ "$attempt" = 4 ]; then
              echo "::warning::ssh master could not be opened; falling back to per-command connections"
              cat /tmp/ssh-master.log || true
              break
            fi
            sleep $((attempt * 10))
          done

      - name: Pre-deploy AI-call safety preflight
        # This must run BEFORE the new artifact, migration and cron are
        # installed. A post-deploy assertion is too late: an accidentally
        # enabled queue could otherwise dispatch during that window.
        if: ${{ env.DEPLOYMENT_MODE == 'normal' }}
        run: |
          ssh -o ConnectTimeout=30 -o ServerAliveInterval=15 -i ~/.ssh/deploy_key \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} 'bash -s' <<'REMOTE'
          set -euo pipefail
          # The process may still serve a deleted standalone directory after a
          # historical interrupted release. This proof is read-only and needs
          # only Prisma plus dotenv, so resolve those dependencies from the
          # root-owned checkout instead of assuming the live runtime exists.
          cd /opt/leaddrive-v2
          node <<'NODE'
          const fs = require("node:fs")
          const preflightRuntime = "/opt/leaddrive-v2"
          const canonicalEnv = "/etc/leaddrive/app.env"
          const legacyEnv = "/opt/leaddrive-v2/.env"
          const hasPathOrSymlink = (candidate) => {
            try {
              fs.lstatSync(candidate)
              return true
            } catch (error) {
              if (error && error.code === "ENOENT") return false
              throw error
            }
          }
          const assertRootOwnedNonwritableDirectory = (label, candidate) => {
            const stat = fs.lstatSync(candidate)
            if (!stat.isDirectory() || stat.isSymbolicLink()) {
              throw new Error(`${label} must be a real directory`)
            }
            if (stat.uid !== 0 || stat.gid !== 0 || (stat.mode & 0o022) !== 0) {
              throw new Error(`${label} must be root:root and not group- or world-writable`)
            }
          }
          const assertRootOnlyEnvFile = (label, candidate) => {
            const stat = fs.lstatSync(candidate)
            if (!stat.isFile() || stat.isSymbolicLink()) {
              throw new Error(`${label} must be a regular file, not a symlink`)
            }
            if (stat.uid !== 0 || stat.gid !== 0 || (stat.mode & 0o777) !== 0o600) {
              throw new Error(`${label} must be root:root mode 0600`)
            }
          }
          assertRootOwnedNonwritableDirectory("preflight runtime checkout", preflightRuntime)
          assertRootOwnedNonwritableDirectory("preflight runtime dependencies", `${preflightRuntime}/node_modules`)
          const dotenv = require(`${preflightRuntime}/node_modules/dotenv`)
          // The first runtime-separation release creates the canonical file
          // inside server-deploy.sh. Keep this pre-deploy safety probe
          // read-only-compatible with that one transition only. Do not parse
          // either source until ownership, mode, and symlink boundaries pass.
          const envFile = hasPathOrSymlink(canonicalEnv) ? canonicalEnv : legacyEnv
          if (envFile === canonicalEnv) {
            assertRootOwnedNonwritableDirectory("canonical app-env parent", "/etc/leaddrive")
            assertRootOnlyEnvFile("canonical app env", canonicalEnv)
          } else {
            assertRootOwnedNonwritableDirectory("LeadDrive checkout", "/opt/leaddrive-v2")
            assertRootOnlyEnvFile("legacy checkout app env", legacyEnv)
          }
          dotenv.config({ path: envFile })
          const { PrismaClient } = require(`${preflightRuntime}/node_modules/@prisma/client`)
          const prisma = new PrismaClient()

          ;(async () => {
            const organizationId = (process.env.VOICE_AGENT_ORGANIZATION_ID || "").trim()
            if (!organizationId) throw new Error("AI-call pilot organization is not configured")
            // The third of three fences that together made enabling the queue
            // impossible rather than deliberate. The other two were lifted in
            // #837; this one was missed, so the first deploy after the owner
            // set the flag failed here — which is precisely the trap #837
            // existed to remove. Reported, not fatal.
            if (process.env.VOICE_CALL_QUEUE_EXECUTION_ENABLED === "true") {
              console.log("AI-call queue server gate is ENABLED (owner decision, 2026-08-13).")
            }

            const proof = await prisma.$transaction(async (tx) => {
              await tx.$executeRawUnsafe(
                "SELECT set_config('app.org_id', $1, true)",
                organizationId,
              )
              const [config] = await tx.$queryRawUnsafe(`
                SELECT
                  count(*) FILTER (
                    WHERE lower(coalesce(settings->>'voiceQueueEnabled', 'false')) = 'true'
                  )::int AS "queueEnabledCount",
                  count(*) FILTER (
                    WHERE "isActive" = true
                      AND lower(coalesce(settings->>'voiceAgentEnabled', 'false')) = 'true'
                  )::int AS "voiceAgentConfigCount",
                  count(*) FILTER (
                    WHERE "isActive" = true
                      AND lower(coalesce(settings->>'voiceAgentEnabled', 'false')) = 'true'
                      AND coalesce(btrim(settings->>'voiceAgentPrompt'), '') = ''
                  )::int AS "emptyPromptCount"
                FROM channel_configs
                WHERE "organizationId" = $1 AND "channelType" = 'voip'
              `, organizationId)
              const [active] = await tx.$queryRawUnsafe(`
                SELECT count(*)::int AS count
                FROM voice_call_sessions
                WHERE "organizationId" = $1
                  AND "endedAt" IS NULL
                  AND status IN ('prepared', 'dispatching', 'dispatch_uncertain')
              `, organizationId)
              const [callLogMigrationRisk] = await tx.$queryRawUnsafe(`
                SELECT
                  EXISTS (
                    SELECT 1
                    FROM information_schema.columns
                    WHERE table_schema = 'public'
                      AND table_name = 'call_logs'
                      AND column_name = 'targetPhoneE164'
                  ) AS "canonicalColumnPresent",
                  pg_total_relation_size('public.call_logs')::text AS "tableBytes",
                  EXISTS (
                    SELECT 1 FROM pg_index i
                    JOIN pg_class idx ON idx.oid = i.indexrelid
                    JOIN pg_class r ON r.oid = i.indrelid
                    JOIN pg_namespace n ON n.oid = r.relnamespace
                    WHERE n.nspname = 'public' AND r.relname = 'audit_logs'
                      AND idx.relname = 'audit_logs_voice_permission_request_key'
                      AND i.indisvalid AND i.indisready AND i.indislive AND i.indisunique
                      AND pg_get_expr(i.indpred, i.indrelid) = '(("entityType" = ''lead_voice_permission''::text) AND ("entityId" IS NOT NULL))'
                  ) AS "voicePermissionIndexPresent",
                  pg_total_relation_size('public.audit_logs')::text AS "auditTableBytes",
                  (
                    SELECT count(*)::int FROM (
                      SELECT 1 FROM pg_constraint c
                      JOIN pg_class r ON r.oid = c.conrelid
                      JOIN pg_namespace n ON n.oid = r.relnamespace
                      WHERE n.nspname = 'public' AND r.relname = 'call_logs'
                        AND c.conname = 'call_logs_target_phone_e164_check'
                      UNION ALL
                      SELECT 1 WHERE to_regclass('public.call_logs_org_target_phone_e164_idx') IS NOT NULL
                    ) artifacts
                  ) AS "callTargetArtifactCount",
                  (
                    SELECT count(*)::int FROM (
                      SELECT 1 WHERE to_regclass('public.audit_logs_voice_permission_request_key') IS NOT NULL
                      UNION ALL
                      SELECT 1 WHERE to_regprocedure('public.protect_voice_permission_audit_row()') IS NOT NULL
                      UNION ALL
                      SELECT 1 FROM pg_trigger t
                      JOIN pg_class r ON r.oid = t.tgrelid
                      JOIN pg_namespace n ON n.oid = r.relnamespace
                      WHERE n.nspname = 'public' AND r.relname = 'audit_logs'
                        AND t.tgname = 'audit_logs_voice_permission_append_only'
                    ) artifacts
                  ) AS "voicePermissionArtifactCount",
                  (
                    SELECT count(*)::int FROM audit_logs
                    WHERE "entityType" = 'lead_voice_permission'
                  ) AS "voicePermissionReservedRowCount",
                  (
                    SELECT count(*)::int FROM (
                      SELECT 1 FROM audit_logs
                      WHERE "entityType" = 'lead_voice_permission' AND "entityId" IS NOT NULL
                      GROUP BY "organizationId", "entityType", "entityId"
                      HAVING count(*) > 1
                    ) duplicate_groups
                  ) AS "voicePermissionDuplicateGroupCount"
              `)
              return { config, active, callLogMigrationRisk }
            })

            // This fence was absolute while the AI-call contour was being built.
            // The owner turned the queue on on 2026-08-13, so an enabled tenant
            // is now a fact to report rather than a deploy to fail. The fence
            // below stays: a deploy must not cut off a call in progress.
            if (proof.config.queueEnabledCount !== 0) {
              console.log(`AI-call queue is enabled for ${proof.config.queueEnabledCount} tenant(s).`)
            }
            if (proof.active.count !== 0) {
              throw new Error("Active AI-call sessions must drain before the queue migration")
            }
            // The pending migration performs a deterministic one-time canonical
            // phone backfill. Fail before staging or migrating if the live table
            // is too large for this bounded foundation rollout. Once the column
            // exists, later deploys do not repeat this gate.
            const maxBackfillBytes = 256n * 1024n * 1024n
            if (
              !proof.callLogMigrationRisk.canonicalColumnPresent
              && BigInt(proof.callLogMigrationRisk.tableBytes) > maxBackfillBytes
            ) {
              throw new Error("Call history table requires a staged backfill before this deployment")
            }
            if (
              !proof.callLogMigrationRisk.canonicalColumnPresent
              && proof.callLogMigrationRisk.callTargetArtifactCount !== 0
            ) {
              throw new Error("Call history migration has unexpected partial schema artifacts")
            }
            if (
              !proof.callLogMigrationRisk.voicePermissionIndexPresent
              && BigInt(proof.callLogMigrationRisk.auditTableBytes) > maxBackfillBytes
            ) {
              throw new Error("Audit history table requires a staged index build before this deployment")
            }
            if (
              !proof.callLogMigrationRisk.voicePermissionIndexPresent
              && (
                proof.callLogMigrationRisk.voicePermissionArtifactCount !== 0
                || proof.callLogMigrationRisk.voicePermissionReservedRowCount !== 0
                || proof.callLogMigrationRisk.voicePermissionDuplicateGroupCount !== 0
              )
            ) {
              throw new Error("Voice-permission audit namespace is not clean for its first migration")
            }
            if (
              proof.config.voiceAgentConfigCount < 1
              || proof.config.emptyPromptCount !== 0
            ) {
              throw new Error("CRM-managed voice prompt must be present before deployment")
            }
            console.log("AI-call pre-deploy safety proof passed")
          })().finally(() => prisma.$disconnect())
          NODE
          REMOTE

      - name: Download SHA-bound deploy artifact
        uses: actions/download-artifact@v4
        with:
          name: leaddrive-prod-${{ env.DEPLOY_TARGET_SHA }}
          path: /tmp/leaddrive-deploy-artifact

      - name: Verify downloaded SHA-bound artifact
        run: |
          artifact="/tmp/leaddrive-deploy-artifact/leaddrive-prod-${DEPLOY_TARGET_SHA}.tar.gz"
          [ -s "$artifact" ] || {
            echo "::error::workflow artifact is missing or empty for $DEPLOY_TARGET_SHA"
            exit 1
          }
          test "$(tar -xOzf "$artifact" ./.deploy-sha | tr -d '\r\n')" = "$DEPLOY_TARGET_SHA" || {
            echo "::error::workflow artifact marker does not match DEPLOY_TARGET_SHA"
            exit 1
          }

      - name: Stage immutable artifact on production disk
        # This copies bytes only; it does not stop PM2, run migrations, unpack
        # into the live tree, or consume production build memory. The SHA in
        # both the filename and tarball is revalidated by the remote ceremony.
        run: |
          artifact="/tmp/leaddrive-deploy-artifact/leaddrive-prod-${DEPLOY_TARGET_SHA}.tar.gz"
          staged=0
          for attempt in 1 2 3; do
            if scp -o ConnectTimeout=30 -i ~/.ssh/deploy_key \
              "$artifact" \
              ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:"/tmp/leaddrive-deploy-${DEPLOY_TARGET_SHA}.tar.gz"; then
              staged=1
              break
            fi
            echo "::warning::artifact staging attempt $attempt failed"
            [ "$attempt" = 3 ] || sleep $((attempt * 20))
          done
          if [ "$staged" != 1 ]; then
            echo "FATAL: could not stage the artifact on production disk"
            exit 1
          fi

      - name: Upload deploy script
        run: |
          scp -o ConnectTimeout=30 -i ~/.ssh/deploy_key \
            scripts/server-deploy.sh \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/tmp/server-deploy.sh

      - name: Deploy atomically on production
        id: deploy_atomic
        # Promote only the artifact named for this workflow SHA. Validate its
        # embedded marker before moving it to the fixed path consumed by
        # server-deploy.sh, which validates the same marker again.
        run: |
          ssh -o ConnectTimeout=30 -o ServerAliveInterval=15 -i ~/.ssh/deploy_key \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} \
            "bash -s -- '${DEPLOY_TARGET_SHA}' '${DEPLOYMENT_MODE}'" <<'REMOTE'
          set -euo pipefail
          DEPLOY_SHA="$1"
          DEPLOY_MODE="$2"
          case "$DEPLOY_MODE" in
            normal|recovery-bootstrap|recovery-bootstrap-resume) ;;
            *) echo "FATAL: unsupported deployment mode" >&2; exit 1 ;;
          esac
          CANDIDATE="/tmp/leaddrive-deploy-${DEPLOY_SHA}.tar.gz"
          [ -s "$CANDIDATE" ] || {
            echo "FATAL: exact SHA-named staged artifact is missing for $DEPLOY_SHA" >&2
            exit 1
          }
          test "$(tar -xOzf "$CANDIDATE" ./.deploy-sha | tr -d '\r\n')" = "$DEPLOY_SHA"
          mv "$CANDIDATE" /tmp/leaddrive-deploy.tar.gz
          bash /tmp/server-deploy.sh "$DEPLOY_MODE" "$DEPLOY_SHA"
          REMOTE

      # Every post-deploy check below carries the same guard, and it is doing
      # two different jobs. `steps.deploy_atomic.outcome == 'success'` keeps the
      # probes from running against a release that never landed. `!cancelled()`
      # decouples them from EACH OTHER: by default a failed step skips the rest
      # of the job, so on 2026-08-31 one probe losing a race for a cron lock
      # silently dropped six unrelated checks — the Chatwoot backstop proof, the
      # tenant-isolation sweep, the MTM retention heartbeat, and all three public
      # smokes that answer "is production serving the new bundle at all?" — on a
      # deployment that was in fact healthy. These probes verify independent
      # things and none is a precondition for another, so each one now reports
      # its own verdict. A failure among them still marks the job red; it just no
      # longer decides what else gets to be measured.
      - name: Verify Social Monitoring queue scheduler
        if: ${{ !cancelled() && steps.deploy_atomic.outcome == 'success' && env.DEPLOYMENT_MODE == 'normal' }}
        run: |
          ssh -o ConnectTimeout=30 -o ServerAliveInterval=15 -i ~/.ssh/deploy_key \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} \
            'set -euo pipefail
             CRONTAB="$(crontab -l 2>/dev/null)"
             ACTIVE_COUNT="$(printf "%s\n" "$CRONTAB" | awk '\''
               $0 !~ /^[[:space:]]*#/ &&
               $0 ~ /cron-trigger\.sh \/api\/cron\/social-monitoring-run-jobs/ { count++ }
               END { print count + 0 }
             '\'')"
             if [ "$ACTIVE_COUNT" -ne 1 ]; then
               echo "FATAL: expected exactly one active Social Monitoring queue cron; found $ACTIVE_COUNT"
               exit 1
             fi
             if ! systemctl is-active --quiet cron.service; then
               echo "FATAL: cron.service is not active"
               exit 1
             fi
             SMOKE_ENDPOINT="/api/cron/social-monitoring-run-jobs?organizationId=codex-prod-smoke-no-such-org&limit=1&maxItemsPerJob=1"
             SMOKE_OUTPUT="$(CRON_TRIGGER_LOCK_WAIT_SECONDS=120 /usr/local/lib/leaddrive-v2/ops/current/cron-scripts/cron-trigger.sh "$SMOKE_ENDPOINT")"
             printf "%s\n" "$SMOKE_OUTPUT"
             if ! printf "%s\n" "$SMOKE_OUTPUT" | grep -Fq "\"selected\":0,\"claimed\":0"; then
               echo "FATAL: Social Monitoring queue smoke did not return an empty successful drain"
               exit 1
             fi'

      - name: Verify callback commitment scheduler
        if: ${{ !cancelled() && steps.deploy_atomic.outcome == 'success' && env.DEPLOYMENT_MODE == 'normal' }}
        run: |
          ssh -o ConnectTimeout=30 -o ServerAliveInterval=15 -i ~/.ssh/deploy_key \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} \
            'set -euo pipefail
             CRONTAB="$(crontab -l 2>/dev/null)"
             ACTIVE_COUNT="$(printf "%s\n" "$CRONTAB" | awk '\''
               $0 !~ /^[[:space:]]*#/ &&
               $0 ~ /cron-trigger\.sh \/api\/cron\/commitment-escalation/ { count++ }
               END { print count + 0 }
             '\'')"
             if [ "$ACTIVE_COUNT" -ne 1 ]; then
               echo "FATAL: expected exactly one active callback commitment cron; found $ACTIVE_COUNT"
               exit 1
             fi
             if ! systemctl is-active --quiet cron.service; then
               echo "FATAL: cron.service is not active"
               exit 1
             fi
             SMOKE_OUTPUT="$(CRON_TRIGGER_LOCK_WAIT_SECONDS=120 /usr/local/lib/leaddrive-v2/ops/current/cron-scripts/cron-trigger.sh "/api/cron/commitment-escalation?smoke=1")"
             printf "%s\n" "$SMOKE_OUTPUT"
             if ! printf "%s\n" "$SMOKE_OUTPUT" | grep -Fq '\''"smoke":true'\''; then
               echo "FATAL: callback commitment cron smoke was not side-effect-free and successful"
               exit 1
             fi'

      - name: Verify the MTM route day-close scheduler
        if: ${{ !cancelled() && steps.deploy_atomic.outcome == 'success' }}
        run: |
          ssh -o ConnectTimeout=30 -o ServerAliveInterval=15 -i ~/.ssh/deploy_key \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} \
            'set -euo pipefail
             CRONTAB="$(crontab -l 2>/dev/null)"
             ACTIVE_COUNT="$(printf "%s\n" "$CRONTAB" | awk '\''
               $0 !~ /^[[:space:]]*#/ &&
               $0 ~ /cron-trigger\.sh \/api\/cron\/mtm-route-day-close/ { count++ }
               END { print count + 0 }
             '\'')"
             if [ "$ACTIVE_COUNT" -ne 1 ]; then
               echo "FATAL: expected exactly one active MTM route day-close cron; found $ACTIVE_COUNT"
               exit 1
             fi
             if ! systemctl is-active --quiet cron.service; then
               echo "FATAL: cron.service is not active"
               exit 1
             fi
             SMOKE_OUTPUT="$(CRON_TRIGGER_LOCK_WAIT_SECONDS=120 /usr/local/lib/leaddrive-v2/ops/current/cron-scripts/cron-trigger.sh "/api/cron/mtm-route-day-close?smoke=1")"
             printf "%s\n" "$SMOKE_OUTPUT"
             if ! printf "%s\n" "$SMOKE_OUTPUT" | grep -Fq '\''"smoke":true'\''; then
               echo "FATAL: MTM route day-close cron smoke was not side-effect-free and successful"
               exit 1
             fi'

      - name: Verify missed inbound reconciliation scheduler
        if: ${{ !cancelled() && steps.deploy_atomic.outcome == 'success' && env.DEPLOYMENT_MODE == 'normal' }}
        run: |
          ssh -o ConnectTimeout=30 -o ServerAliveInterval=15 -i ~/.ssh/deploy_key \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} \
            'set -euo pipefail
             CRONTAB="$(crontab -l 2>/dev/null)"
             ACTIVE_COUNT="$(printf "%s\n" "$CRONTAB" | awk '\''
               $0 !~ /^[[:space:]]*#/ &&
               $0 ~ /cron-trigger\.sh \/api\/cron\/missed-inbound-reconciliation/ { count++ }
               END { print count + 0 }
             '\'')"
             if [ "$ACTIVE_COUNT" -ne 1 ]; then
               echo "FATAL: expected exactly one active missed inbound reconciliation cron; found $ACTIVE_COUNT"
               exit 1
             fi
             if ! systemctl is-active --quiet cron.service; then
               echo "FATAL: cron.service is not active"
               exit 1
             fi
             SMOKE_OUTPUT="$(CRON_TRIGGER_LOCK_WAIT_SECONDS=120 /usr/local/lib/leaddrive-v2/ops/current/cron-scripts/cron-trigger.sh "/api/cron/missed-inbound-reconciliation?smoke=1")"
             printf "%s\n" "$SMOKE_OUTPUT"
             if ! printf "%s\n" "$SMOKE_OUTPUT" | grep -Fq '\''"smoke":true'\''; then
               echo "FATAL: missed inbound reconciliation cron smoke was not side-effect-free and successful"
               exit 1
             fi'

      - name: Verify the AI-call queue scheduler
        if: ${{ !cancelled() && steps.deploy_atomic.outcome == 'success' && env.DEPLOYMENT_MODE == 'normal' }}
        run: |
          ssh -o ConnectTimeout=30 -o ServerAliveInterval=15 -i ~/.ssh/deploy_key \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} \
            'set -euo pipefail
             CRONTAB="$(crontab -l 2>/dev/null)"
             ACTIVE_COUNT="$(printf "%s\n" "$CRONTAB" | awk '\''
               $0 !~ /^[[:space:]]*#/ &&
               $0 ~ /cron-trigger\.sh \/api\/cron\/voice-call-queues/ { count++ }
               END { print count + 0 }
             '\'')"
             if [ "$ACTIVE_COUNT" -ne 1 ]; then
               echo "FATAL: expected exactly one active AI-call queue cron; found $ACTIVE_COUNT"
               exit 1
             fi
             APP_ENV_FILE="${APP_ENV_FILE:-/etc/leaddrive/app.env}"
             [ -f "$APP_ENV_FILE" ] || { echo "FATAL: canonical app environment missing"; exit 1; }
             QUEUE_FLAG="$(sed -nE '\''s/^[[:space:]]*VOICE_CALL_QUEUE_EXECUTION_ENABLED[[:space:]]*=[[:space:]]*(.*)$/\1/p'\'' "$APP_ENV_FILE" | tail -1 | tr -d '\''\r"'\'')"
             SMOKE_OUTPUT="$(CRON_TRIGGER_LOCK_WAIT_SECONDS=120 /usr/local/lib/leaddrive-v2/ops/current/cron-scripts/cron-trigger.sh /api/cron/voice-call-queues)"
             printf "%s\n" "$SMOKE_OUTPUT"
             # The cron must answer, whichever side of the fence it is on: a
             # scheduler that errors is a scheduler nobody notices is broken.
             if ! printf "%s\n" "$SMOKE_OUTPUT" | grep -Fq '\''"success":true'\''; then
               echo "FATAL: AI-call queue cron did not return success"
               exit 1
             fi
             if [ "$QUEUE_FLAG" = "true" ]; then
               echo "AI-call queue execution is ENABLED for this deployment (owner decision, 2026-08-13)."
             else
               # Still disabled: the cron must be a strict no-op, or something is
               # dispatching calls the fence was supposed to be holding back.
               if ! printf "%s\n" "$SMOKE_OUTPUT" | grep -Fq '\''"dispatching":0'\''; then
                 echo "FATAL: disabled AI-call queue cron was not a successful no-op"
                 exit 1
               fi
             fi'

      - name: Verify the Chatwoot inbound backstop scheduler
        if: ${{ !cancelled() && steps.deploy_atomic.outcome == 'success' && env.DEPLOYMENT_MODE == 'normal' }}
        run: |
          ssh -o ConnectTimeout=30 -o ServerAliveInterval=15 -i ~/.ssh/deploy_key \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} \
            'set -euo pipefail
             CRONTAB="$(crontab -l 2>/dev/null)"
             ACTIVE_COUNT="$(printf "%s\n" "$CRONTAB" | awk '\''
               $0 !~ /^[[:space:]]*#/ &&
               $0 ~ /cron-trigger\.sh \/api\/cron\/chatwoot-inbound-poll/ { count++ }
               END { print count + 0 }
             '\'')"
             if [ "$ACTIVE_COUNT" -ne 1 ]; then
               echo "FATAL: expected exactly one active Chatwoot inbound poll cron; found $ACTIVE_COUNT"
               exit 1
             fi
             if ! systemctl is-active --quiet cron.service; then
               echo "FATAL: cron.service is not active"
               exit 1
             fi
             echo "Chatwoot inbound backstop scheduler proof passed"'

      # F-25/F-38: `prisma migrate deploy` ran a few steps ago and can add a
      # tenant table. A table with an organizationId and no RLS does not fail —
      # it silently starts returning other tenants' rows, which is the failure
      # mode this whole control exists for. So the check runs AFTER migrations,
      # on the server, against the real role the application connects as.
      #
      # Deliberately fails the run without rolling back, matching the Chatwoot
      # scheduler proof above: the app is already live and healthy, and rolling
      # production back would not close the hole the migration opened. A red run
      # says "deployed, and now go add the policy".
      - name: Verify tenant isolation coverage
        if: ${{ !cancelled() && steps.deploy_atomic.outcome == 'success' && env.DEPLOYMENT_MODE == 'normal' }}
        run: |
          ssh -o ConnectTimeout=30 -o ServerAliveInterval=15 -i ~/.ssh/deploy_key \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} \
            'set -euo pipefail
             cd /opt/leaddrive-v2/.next/standalone
             APP_ENV_FILE="${APP_ENV_FILE:-/etc/leaddrive/app.env}"
             DATABASE_URL="$(sed -nE "s/^[[:space:]]*DATABASE_URL[[:space:]]*=[[:space:]]*(.*)$/\1/p" "$APP_ENV_FILE" | tail -1)"
             DATABASE_URL="${DATABASE_URL%\"}"; DATABASE_URL="${DATABASE_URL#\"}"
             [ -n "$DATABASE_URL" ] || { echo "FATAL: DATABASE_URL not found in canonical app environment"; exit 1; }
             export DATABASE_URL
             node scripts/rls/verify-coverage.mjs'

      # v2 cursors and snapshots are rebuildable, but retention is still a
      # correctness fence: a stale cursor must receive a controlled resnapshot
      # rather than silently read past a tombstone. The managed cron is the
      # external heartbeat for this bounded job. Prove the exact schedule and
      # one authenticated completion without ever touching a v1 outbox or its
      # idempotency rows.
      - name: Verify MTM mobile sync retention scheduler
        if: ${{ !cancelled() && steps.deploy_atomic.outcome == 'success' && env.DEPLOYMENT_MODE == 'normal' }}
        run: |
          ssh -o ConnectTimeout=30 -o ServerAliveInterval=15 -i ~/.ssh/deploy_key \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} \
            'set -euo pipefail
             CRONTAB="$(crontab -l 2>/dev/null)"
             ACTIVE_COUNT="$(printf "%s\n" "$CRONTAB" | awk '\''
               $0 !~ /^[[:space:]]*#/ &&
               $0 ~ /cron-trigger\.sh \/api\/cron\/mtm-cleanup/ { count++ }
               END { print count + 0 }
             '\'')"
             if [ "$ACTIVE_COUNT" -ne 1 ]; then
               echo "FATAL: expected exactly one active MTM cleanup cron; found $ACTIVE_COUNT"
               exit 1
             fi
             if ! systemctl is-active --quiet cron.service; then
               echo "FATAL: cron.service is not active"
               exit 1
             fi
             SMOKE_OUTPUT="$(CRON_TRIGGER_LOCK_WAIT_SECONDS=120 /usr/local/lib/leaddrive-v2/ops/current/cron-scripts/cron-trigger.sh /api/cron/mtm-cleanup)"
             printf "%s\n" "$SMOKE_OUTPUT"
             if ! printf "%s\n" "$SMOKE_OUTPUT" | grep -Fq '\''"success":true'\''; then
               echo "FATAL: MTM cleanup trigger did not complete successfully"
               exit 1
             fi
             APP_ENV_FILE="${APP_ENV_FILE:-/etc/leaddrive/app.env}"
             DATABASE_URL="$(sed -nE "s/^[[:space:]]*DATABASE_URL[[:space:]]*=[[:space:]]*(.*)$/\1/p" "$APP_ENV_FILE" | tail -1)"
             DATABASE_URL="${DATABASE_URL%\"}"; DATABASE_URL="${DATABASE_URL#\"}"
             [ -n "$DATABASE_URL" ] || { echo "FATAL: DATABASE_URL not found in canonical app environment"; exit 1; }
             HEARTBEAT="$(psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -AtF "|" -c "
               SELECT \"name\", (\"lastCompletedAt\" >= now() - make_interval(mins => 5))
               FROM \"system_job_leases\"
               ORDER BY \"name\"")"
             printf "%s\n" "$HEARTBEAT"
             if ! printf "%s\n" "$HEARTBEAT" | grep -Fx mtm-cleanup\|t; then
               echo "FATAL: MTM cleanup lease is missing or lacks a fresh completed heartbeat"
               exit 1
             fi'

      - name: Cleanup SSH key
        if: always()
        run: |
          rm -f "/tmp/leaddrive-deploy-artifact/leaddrive-prod-${DEPLOY_TARGET_SHA}.tar.gz"
          rmdir /tmp/leaddrive-deploy-artifact 2>/dev/null || true
          rm -f ~/.ssh/deploy_key
          # After the key is gone, never before: -O exit talks to the mux socket
          # and ConnectTimeout does not apply there, so a wedged master could
          # otherwise block this always()-step and strand the private key.
          timeout 10 ssh -O exit ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} 2>/dev/null || true
          rm -f ~/.ssh/known_hosts ~/.ssh/config

      # ── Stage 3: post-deploy smoke over the public URL ────────────────
      # Same job as the deploy on purpose — see the concurrency note above.
      # A smoke failure marks this deploy run red for the operator; the
      # server-side localhost health-check + auto-rollback in server-deploy.sh
      # have already passed by this point, so prod keeps serving — these
      # probes verify the public path end-to-end.
      - name: Post-deploy ping (public DB-path probe)
        if: ${{ !cancelled() && steps.deploy_atomic.outcome == 'success' && env.DEPLOYMENT_MODE == 'normal' }}
        # /api/v1/ping runs a real Prisma query — a 200 proves the app booted,
        # the Prisma engine loaded, and the database is reachable through the
        # public Cloudflare → nginx → PM2 path (server-deploy.sh only checks
        # localhost). Retries cover PM2 warmup right after the swap.
        run: |
          BASE_URL="${{ secrets.NEXTAUTH_URL }}"
          BASE_URL="${BASE_URL%/}"
          [ -n "$BASE_URL" ] || { echo "::error::NEXTAUTH_URL secret is empty"; exit 1; }
          for i in 1 2 3 4 5; do
            CODE=$(curl -s -o /tmp/ping-body -w '%{http_code}' --max-time 15 "$BASE_URL/api/v1/ping" || echo "000")
            echo "attempt $i/5: /api/v1/ping -> $CODE"
            if [ "$CODE" = "200" ]; then
              cat /tmp/ping-body; echo
              exit 0
            fi
            [ "$i" -lt 5 ] && sleep 10
          done
          echo "::error::/api/v1/ping did not return 200 after 5 attempts"
          exit 1

      - name: Post-deploy revision check (is the new bundle actually serving?)
        if: ${{ !cancelled() && steps.deploy_atomic.outcome == 'success' && env.DEPLOYMENT_MODE == 'normal' }}
        # Every previous "is it deployed?" question needed an SSH session and a
        # grep of the compiled bundle, because the git checkout on the box does
        # not describe the artifact. The app now reports its compiled revision, so the
        # run can prove end-to-end — through Cloudflare, nginx and PM2 — that
        # the revision answering requests is the one this run built, not a
        # survivor of a half-finished swap.
        run: |
          BASE_URL="${{ secrets.NEXTAUTH_URL }}"
          BASE_URL="${BASE_URL%/}"
          [ -n "$BASE_URL" ] || { echo "::error::NEXTAUTH_URL secret is empty"; exit 1; }
          EXPECTED="$GITHUB_SHA"
          for i in 1 2 3; do
            LIVE=$(curl --fail --silent --show-error --max-time 15 \
              --header 'Cache-Control: no-cache' \
              "$BASE_URL/api/v1/public/build-info?deploy=$GITHUB_SHA" \
              | sed -n 's/.*"artifactSha":"\([0-9a-f]\{40\}\)".*/\1/p')
            echo "attempt $i/3: live revision '${LIVE:-none}', expected '$EXPECTED'"
            if [ "$LIVE" = "$EXPECTED" ]; then
              exit 0
            fi
            [ "$i" -lt 3 ] && sleep 15
          done
          echo "::error::production is not serving ${EXPECTED} — check for a failed swap or a stale process"
          exit 1

      - name: Post-deploy feature smoke (login page + hashed assets)
        if: ${{ !cancelled() && steps.deploy_atomic.outcome == 'success' && env.DEPLOYMENT_MODE == 'normal' }}
        # Guards the dead-webpack-hash regression: HTML that references
        # /_next/static assets which 404 on the origin → no hydration,
        # skeleton sidebar, infinite spinner. Fetch the real page HTML and
        # assert its first CSS and JS asset URLs actually resolve.
        run: |
          BASE_URL="${{ secrets.NEXTAUTH_URL }}"
          BASE_URL="${BASE_URL%/}"
          # Cache-busting query so a CDN can't serve pre-deploy cached HTML.
          PAGE_URL="$BASE_URL/login?smoke=${GITHUB_SHA:0:12}"
          CODE="000"
          for i in 1 2 3; do
            CODE=$(curl -s -o /tmp/login.html -w '%{http_code}' --max-time 15 "$PAGE_URL" || echo "000")
            echo "attempt $i/3: /login -> $CODE"
            [ "$CODE" = "200" ] && break
            [ "$i" -lt 3 ] && sleep 10
          done
          [ "$CODE" = "200" ] || { echo "::error::/login returned $CODE"; exit 1; }

          CSS_PATH=$(grep -o '/_next/static/[^"]*\.css' /tmp/login.html | head -1)
          JS_PATH=$(grep -o '/_next/static/[^"]*\.js' /tmp/login.html | head -1)
          [ -n "$CSS_PATH" ] || { echo "::error::no CSS asset URL found in login HTML"; exit 1; }
          [ -n "$JS_PATH" ] || { echo "::error::no JS asset URL found in login HTML"; exit 1; }

          for ASSET in "$CSS_PATH" "$JS_PATH"; do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 "$BASE_URL$ASSET" || echo "000")
            echo "asset $ASSET -> $CODE"
            if [ "$CODE" != "200" ]; then
              echo "::error::asset $ASSET returned $CODE — page HTML references assets the origin does not serve"
              exit 1
            fi
          done
          echo "Feature smoke passed: page 200, CSS + JS assets 200"

      - name: Authenticated Social Monitoring browser smoke
        if: ${{ !cancelled() && steps.deploy_atomic.outcome == 'success' && env.DEPLOYMENT_MODE == 'normal' }}
        # The account is supplied only through GitHub Actions secrets. Keep the
        # deploy green while the secret-managed account is being provisioned,
        # but make the missing gate explicit in the run log.
        env:
          SOCIAL_SMOKE_BASE_URL: ${{ secrets.NEXTAUTH_URL }}
          SOCIAL_SMOKE_EMAIL: ${{ secrets.SOCIAL_SMOKE_EMAIL }}
          SOCIAL_SMOKE_PASSWORD: ${{ secrets.SOCIAL_SMOKE_PASSWORD }}
          SOCIAL_SMOKE_ORG_SLUG: ${{ secrets.SOCIAL_SMOKE_ORG_SLUG }}
        run: |
          if [ -z "$SOCIAL_SMOKE_EMAIL" ] || [ -z "$SOCIAL_SMOKE_PASSWORD" ]; then
            echo "::warning::Authenticated Social Monitoring smoke skipped: configure SOCIAL_SMOKE_EMAIL and SOCIAL_SMOKE_PASSWORD repository secrets"
            exit 0
          fi
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium
          node scripts/social-monitoring-browser-smoke.mjs

      - name: Upload Social Monitoring browser evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: social-monitoring-browser-smoke-${{ github.sha }}
          path: social-monitoring-wizard-smoke.png
          if-no-files-found: ignore
          retention-days: 7

  recovery:
    name: Recover verified retained production artifact
    if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.recovery_sha != '' && needs.dispatch_input_preflight.result == 'success' }}
    needs: [dispatch_input_preflight]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    environment:
      name: production
    # A recovery may resume before the one-time Fund cutover committed, so it
    # must preserve the same verified-backup/deep-reconciliation window.
    timeout-minutes: 300
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    env:
      RECOVERY_SHA: ${{ inputs.recovery_sha }}
      RECOVERY_ARTIFACT_RUN_ID: ${{ inputs.recovery_artifact_run_id }}
      DEPLOYMENT_MODE: ${{ inputs.deployment_mode }}
      BOOTSTRAP_RESUME_SHA: ${{ inputs.bootstrap_resume_sha }}
    steps:
      # Same replacement as the two checks above.
      - name: Require recovery to deploy only from main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          branch_policies="$(gh api "repos/${GITHUB_REPOSITORY}/environments/production/deployment-branch-policies")" || {
            echo "::error::Cannot inspect GitHub production deployment branch policies; refusing recovery"
            exit 1
          }
          jq -e '
            (.branch_policies | length == 1)
            and (.branch_policies[0].name == "main")
          ' <<<"$branch_policies" >/dev/null || {
            echo "::error::GitHub production environment must allow exactly the main branch"
            exit 1
          }

      - name: Validate inputs
        run: |
          [[ "$RECOVERY_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::recovery_sha must be a 40-character lowercase commit SHA"
            exit 1
          }
          [[ "$RECOVERY_ARTIFACT_RUN_ID" =~ ^[1-9][0-9]*$ ]] || {
            echo "::error::recovery_artifact_run_id must be a positive decimal Actions run ID"
            exit 1
          }
          [ "$DEPLOYMENT_MODE" = normal ] || {
            echo "::error::recovery_sha promotion is an application recovery and requires deployment_mode=normal"
            exit 1
          }
          [ -z "$BOOTSTRAP_RESUME_SHA" ] || {
            echo "::error::recovery_sha promotion cannot be combined with bootstrap_resume_sha"
            exit 1
          }

      - name: Checkout deployment script from the recovered revision
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.recovery_sha }}
          fetch-depth: 0

      - name: Authorize recovery target
        run: |
          set -euo pipefail
          [ "$GITHUB_REF" = "refs/heads/main" ] || {
            echo "::error::recovery promotion may only be dispatched from main"
            exit 1
          }
          git fetch --no-tags origin refs/heads/main
          CURRENT_MAIN_SHA="$(git rev-parse FETCH_HEAD)"
          TARGET_SHA="$(git rev-parse HEAD)"
          [ "$TARGET_SHA" = "$RECOVERY_SHA" ] \
            && git merge-base --is-ancestor "$TARGET_SHA" "$CURRENT_MAIN_SHA" || {
            echo "::error::recovery_sha must be an exact SHA reachable from current main"
            exit 1
          }

      - name: Authorize retained recovery artifact source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RUN_STATUS="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RECOVERY_ARTIFACT_RUN_ID}" --jq '.status')"
          RUN_CONCLUSION="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RECOVERY_ARTIFACT_RUN_ID}" --jq '.conclusion')"
          RUN_REPOSITORY="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RECOVERY_ARTIFACT_RUN_ID}" --jq '.repository.full_name')"
          RUN_WORKFLOW_PATH="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RECOVERY_ARTIFACT_RUN_ID}" --jq '.path')"
          RUN_HEAD_REPOSITORY="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RECOVERY_ARTIFACT_RUN_ID}" --jq '.head_repository.full_name')"
          RUN_HEAD_BRANCH="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RECOVERY_ARTIFACT_RUN_ID}" --jq '.head_branch')"
          [ "$RUN_STATUS" = completed ] && [ "$RUN_CONCLUSION" = success ] || {
            echo "::error::recovery artifact source run must be completed successfully"
            exit 1
          }
          [ "$RUN_REPOSITORY" = "$GITHUB_REPOSITORY" ] || {
            echo "::error::recovery artifact source run is not in this repository"
            exit 1
          }
          [ "$RUN_HEAD_REPOSITORY" = "$GITHUB_REPOSITORY" ] \
            && [ "$RUN_HEAD_BRANCH" = main ] || {
            echo "::error::recovery artifact source must originate from this repository's main branch"
            exit 1
          }
          case "$RUN_WORKFLOW_PATH" in
            .github/workflows/deploy.yml@main|.github/workflows/deploy.yml@refs/heads/main) ;;
            *)
              echo "::error::recovery artifact source must be a Deploy to Production workflow run"
              exit 1
              ;;
          esac

      - name: Download exact retained recovery artifact
        uses: actions/download-artifact@v4
        with:
          name: leaddrive-prod-${{ env.RECOVERY_SHA }}
          path: /tmp/leaddrive-recovery-artifact
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          run-id: ${{ env.RECOVERY_ARTIFACT_RUN_ID }}

      - name: Verify downloaded retained recovery artifact
        run: |
          artifact="/tmp/leaddrive-recovery-artifact/leaddrive-prod-${RECOVERY_SHA}.tar.gz"
          [ -s "$artifact" ] || {
            echo "::error::retained recovery artifact is missing or empty"
            exit 1
          }
          test "$(tar -xOzf "$artifact" ./.deploy-sha | tr -d '\r\n')" = "$RECOVERY_SHA" || {
            echo "::error::retained recovery artifact marker does not match recovery_sha"
            exit 1
          }

      - name: Setup SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_SSH_KNOWN_HOSTS: ${{ secrets.SERVER_SSH_KNOWN_HOSTS }}
        run: |
          [ "$SERVER_HOST" = "$EXPECTED_PRODUCTION_HOST" ] || {
            echo "::error::SERVER_HOST is not the reviewed production host"
            exit 1
          }
          test -n "$DEPLOY_SSH_KEY" || { echo "::error::SSH_PRIVATE_KEY is empty"; exit 1; }
          test -n "$SERVER_SSH_KNOWN_HOSTS" || { echo "::error::SERVER_SSH_KNOWN_HOSTS is empty"; exit 1; }
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$SERVER_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/deploy_key ~/.ssh/known_hosts
          ssh-keygen -F "$SERVER_HOST" -f ~/.ssh/known_hosts >/dev/null || {
            echo "::error::Pinned known_hosts does not contain SERVER_HOST"
            exit 1
          }
          cat > ~/.ssh/config <<'SSHCFG'
          Host *
            StrictHostKeyChecking yes
            UserKnownHostsFile ~/.ssh/known_hosts
          SSHCFG
          chmod 600 ~/.ssh/config

      - name: Stage exact retained recovery artifact on production disk
        run: |
          artifact="/tmp/leaddrive-recovery-artifact/leaddrive-prod-${RECOVERY_SHA}.tar.gz"
          scp -o ConnectTimeout=30 -i ~/.ssh/deploy_key \
            "$artifact" \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:"/tmp/leaddrive-deploy-${RECOVERY_SHA}.tar.gz"

      - name: Promote retained artifact atomically
        run: |
          scp -o ConnectTimeout=30 -i ~/.ssh/deploy_key \
            scripts/server-deploy.sh \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/tmp/server-deploy.sh
          ssh -o ConnectTimeout=30 -o ServerAliveInterval=15 -i ~/.ssh/deploy_key \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} \
            "bash -s -- '$RECOVERY_SHA' 'normal'" <<'REMOTE'
          set -euo pipefail
          DEPLOY_SHA="$1"
          DEPLOY_MODE="$2"
          [ "$DEPLOY_MODE" = normal ] || { echo "FATAL: recovery must use normal mode" >&2; exit 1; }
          CANDIDATE="/tmp/leaddrive-deploy-${DEPLOY_SHA}.tar.gz"
          [ -s "$CANDIDATE" ] || {
            echo "FATAL: exact SHA-named retained artifact is missing for $DEPLOY_SHA" >&2
            exit 1
          }
          test "$(tar -xOzf "$CANDIDATE" ./.deploy-sha | tr -d '\r\n')" = "$DEPLOY_SHA"
          mv "$CANDIDATE" /tmp/leaddrive-deploy.tar.gz
          bash /tmp/server-deploy.sh "$DEPLOY_MODE" "$DEPLOY_SHA"
          REMOTE

      - name: Verify restored runtime
        run: |
          ssh -o ConnectTimeout=30 -o ServerAliveInterval=15 -i ~/.ssh/deploy_key \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} \
            "bash -s -- '$RECOVERY_SHA'" <<'REMOTE'
          set -euo pipefail
          EXPECTED_SHA="$1"
          DEPLOYED_SHA=$(tr -d '\r\n' < /opt/leaddrive-v2/.next/standalone/.deploy-sha)
          [ "$DEPLOYED_SHA" = "$EXPECTED_SHA" ]
          test -f /opt/leaddrive-v2/.next/standalone/.next/server/app/admin/page_client-reference-manifest.js
          curl -fsS --max-time 15 http://127.0.0.1:3001/api/v1/ping >/dev/null
          curl -fsS --max-time 15 http://127.0.0.1:3001/login >/dev/null
          LIVE_SHA=$(curl -fsS --max-time 15 \
            "http://127.0.0.1:3001/api/v1/public/build-info?recovery=$EXPECTED_SHA" \
            | sed -n 's/.*"artifactSha":"\([0-9a-f]\{40\}\)".*/\1/p')
          [ "$LIVE_SHA" = "$EXPECTED_SHA" ]
          REMOTE

      - name: Cleanup SSH key
        if: always()
        run: |
          rm -f "/tmp/leaddrive-recovery-artifact/leaddrive-prod-${RECOVERY_SHA}.tar.gz"
          rmdir /tmp/leaddrive-recovery-artifact 2>/dev/null || true
          rm -f ~/.ssh/deploy_key ~/.ssh/known_hosts ~/.ssh/config
