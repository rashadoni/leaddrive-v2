name: Check social OAuth env

# Read-only diagnostic: prints whether the shared social OAuth apps
# (Facebook/Meta, Instagram-Login, TikTok) are configured in the prod
# deployment's .env — app ids / client keys / redirect URIs only.
# Secrets are NEVER printed (presence reported as yes/no). Production access
# is dispatch-only: editing an operator workflow must never contact production.

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Setup pinned production SSH
        uses: ./.github/actions/setup-production-ssh
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
          server-host: ${{ secrets.SERVER_HOST }}
          known-hosts: ${{ secrets.SERVER_SSH_KNOWN_HOSTS }}
      - name: Read social OAuth env on server (read-only, secrets hidden)
        run: |
          ssh -o ConnectTimeout=30 -i ~/.ssh/deploy_key \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} 'bash -s' <<'REMOTE'
          set -euo pipefail
          ENV="${APP_ENV_FILE:-/etc/leaddrive/app.env}"
          [ -f "$ENV" ] || { echo "NO canonical app env FOUND"; exit 0; }

          # Tolerant KEY=VALUE reader: optional export prefix, strips quotes.
          read_env() {
            grep -E "^[[:space:]]*(export[[:space:]]+)?$1=" "$ENV" | head -1 \
              | sed -E 's/^[^=]*=//' | tr -d '"'"'"''
          }
          has_env() {
            grep -Eq "^[[:space:]]*(export[[:space:]]+)?$1=.+" "$ENV" && echo yes || echo no
          }

          echo "--- Facebook / Meta OAuth env (App Secret hidden) ---"
          echo "FACEBOOK_APP_ID        = $(read_env FACEBOOK_APP_ID)"
          echo "FACEBOOK_REDIRECT_URI  = $(read_env FACEBOOK_REDIRECT_URI)"
          echo "FACEBOOK_APP_SECRET set= $(has_env FACEBOOK_APP_SECRET)"
          echo ""
          echo "--- Instagram-Login OAuth env (App Secret hidden) ---"
          echo "INSTAGRAM_APP_ID        = $(read_env INSTAGRAM_APP_ID)"
          echo "INSTAGRAM_REDIRECT_URI  = $(read_env INSTAGRAM_REDIRECT_URI)"
          echo "INSTAGRAM_APP_SECRET set= $(has_env INSTAGRAM_APP_SECRET)"
          echo ""
          echo "--- TikTok Login Kit env (Client Secret hidden) ---"
          echo "TIKTOK_CLIENT_KEY       = $(read_env TIKTOK_CLIENT_KEY)"
          echo "TIKTOK_REDIRECT_URI     = $(read_env TIKTOK_REDIRECT_URI)"
          echo "TIKTOK_CLIENT_SECRET set= $(has_env TIKTOK_CLIENT_SECRET)"
          echo ""
          echo "--- Meta-review processor presence (credentials hidden) ---"
          echo "ANTHROPIC_API_KEY set   = $(has_env ANTHROPIC_API_KEY)"
          echo "OPENAI_API_KEY set      = $(has_env OPENAI_API_KEY)"
          echo "GOOGLE_AI_API_KEY set   = $(has_env GOOGLE_AI_API_KEY)"
          echo "GEMINI_API_KEY set      = $(has_env GEMINI_API_KEY)"
          echo "GOOGLE_VISION_API_KEY set= $(has_env GOOGLE_VISION_API_KEY)"
          echo "VISION_OCR_PROVIDER     = $(read_env VISION_OCR_PROVIDER)"
          echo "APIFY_API_TOKEN set     = $(has_env APIFY_API_TOKEN)"
          echo "BRIGHT_DATA_API_TOKEN set= $(has_env BRIGHT_DATA_API_TOKEN)"
          echo "BRIGHT_DATA live routing = $(read_env SOCIAL_BRIGHT_DATA_LIVE_ROUTING)"
          echo "AZURE_SPEECH_KEY set    = $(has_env AZURE_SPEECH_KEY)"
          sentry_dsn="$(read_env SENTRY_DSN)"
          sentry_host="$(printf '%s' "$sentry_dsn" | sed -E 's#^[a-zA-Z]+://([^@]+@)?##; s#/.*$##; s/:.*$//')"
          echo "SENTRY_DSN set          = $([ -n "$sentry_dsn" ] && echo yes || echo no)"
          echo "SENTRY ingest host      = ${sentry_host:-unset}"

          BACKUP_ENV="/etc/leaddrive/backup.env"
          if [ -f "$BACKUP_ENV" ]; then
            read_backup_env() {
              grep -E "^[[:space:]]*(export[[:space:]]+)?$1=" "$BACKUP_ENV" | head -1 \
                | sed -E 's/^[^=]*=//' | tr -d '"'"'"''
            }
            endpoint="$(read_backup_env BACKUP_S3_ENDPOINT)"
            endpoint_host="$(printf '%s' "$endpoint" | sed -E 's#^[a-zA-Z]+://##; s#/.*$##')"
            echo "BACKUP_S3_ENDPOINT host = ${endpoint_host:-unset}"
            echo "BACKUP_S3_REGION        = $(read_backup_env BACKUP_S3_REGION)"
            echo "BACKUP daily days       = $(read_backup_env BACKUP_RETENTION_DAILY_DAYS)"
            echo "BACKUP weekly days      = $(read_backup_env BACKUP_RETENTION_WEEKLY_DAYS)"
            echo "BACKUP monthly days     = $(read_backup_env BACKUP_RETENTION_MONTHLY_DAYS)"
          else
            echo "BACKUP_ENV present      = no"
          fi
          REMOTE
      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/deploy_key
