name: Rotate tenant user password

# Manually-triggered operator job: rotates an existing tenant user's password.
# The server generates a policy-compliant temporary password, hashes it with
# bcrypt cost 12, and writes it to a unique root-only file. No credential or
# password hash crosses GitHub Actions; the job log contains only the file path.

on:
  workflow_dispatch:
    inputs:
      slug:
        description: "Tenant slug"
        required: true
        default: "brandprotection"
      email:
        description: "User email inside the tenant"
        required: true
        default: "admin@brandprotection.leaddrivecrm.org"

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  set-password:
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # Inputs become part of a remote command line — reject anything outside
      # the strict shapes before they get near a shell.
      - name: Validate inputs
        env:
          IN_SLUG: ${{ inputs.slug }}
          IN_EMAIL: ${{ inputs.email }}
        run: |
          SLUG_RE='^[a-z0-9]([a-z0-9-]{0,78}[a-z0-9])?$'
          EMAIL_RE='^[A-Za-z0-9._+-]+@[A-Za-z0-9]([A-Za-z0-9-]{0,61}[A-Za-z0-9])?(\.[A-Za-z0-9]([A-Za-z0-9-]{0,61}[A-Za-z0-9])?)+$'
          [[ "$IN_SLUG" =~ $SLUG_RE ]] \
            || { echo "FATAL: slug has an unexpected shape"; exit 1; }
          [[ "$IN_EMAIL" =~ $EMAIL_RE ]] \
            || { echo "FATAL: email has an unexpected shape"; exit 1; }

      - name: Setup pinned production SSH
        uses: ./.github/actions/setup-production-ssh
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
          server-host: ${{ secrets.SERVER_HOST }}
          known-hosts: ${{ secrets.SERVER_SSH_KNOWN_HOSTS }}

      # The deploy tarball ships scripts/ too, but that copy is only as fresh
      # as the last deploy — upload the checked-out script so this workflow
      # never waits on a deploy to pick up fixes.
      - name: Upload script to server
        run: |
          ssh -o ConnectTimeout=30 -i ~/.ssh/deploy_key \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} \
            "mkdir -p /opt/leaddrive-v2/.next/standalone/scripts"
          scp -o ConnectTimeout=30 -i ~/.ssh/deploy_key \
            scripts/_rls.mjs scripts/password-policy.mjs scripts/set-user-password.mjs \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/opt/leaddrive-v2/.next/standalone/scripts/

      - name: Run on server
        env:
          SET_SLUG: ${{ inputs.slug }}
          SET_EMAIL: ${{ inputs.email }}
        run: |
          ssh -o ConnectTimeout=30 -o ServerAliveInterval=15 -i ~/.ssh/deploy_key \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} \
            "SET_SLUG='$SET_SLUG' SET_EMAIL='$SET_EMAIL' bash -s" <<'REMOTE'
          set -euo pipefail
          APP_DIR="/opt/leaddrive-v2"
          APP_ENV_FILE="${APP_ENV_FILE:-/etc/leaddrive/app.env}"
          SCRIPT="$APP_DIR/.next/standalone/scripts/set-user-password.mjs"
          [ -f "$SCRIPT" ] || { echo "FATAL: $SCRIPT missing"; exit 1; }
          [ -f "$APP_ENV_FILE" ] || { echo "FATAL: canonical app env missing"; exit 1; }

          # Tolerant KEY=VALUE reader (same semantics as server-deploy.sh):
          # strips optional export prefix and surrounding quotes.
          read_env() {
            sed -n "s/^[[:space:]]*\(export[[:space:]]\+\)\?$1[[:space:]]*=[[:space:]]*//p" "$APP_ENV_FILE" \
              | head -1 | sed -e 's/^"\(.*\)"$/\1/' -e "s/^'\(.*\)'\$/\1/"
          }
          DATABASE_URL="$(read_env DATABASE_URL)"
          [ -n "$DATABASE_URL" ] || { echo "FATAL: DATABASE_URL not found in canonical app env"; exit 1; }

          cd "$APP_DIR"
          DATABASE_URL="$DATABASE_URL" CONFIRM_PROD=1 \
          SET_SLUG="$SET_SLUG" SET_EMAIL="$SET_EMAIL" \
            node "$SCRIPT"
          REMOTE

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
