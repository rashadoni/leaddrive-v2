name: Owner recovery technical checks
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'scripts/backup/**'
      - 'ops/backup/owner-workstation*'
      - '.github/workflows/owner-recovery-*.yml'
      - 'scripts/server-deploy.sh'
  push:
    branches: [main]
    paths:
      - 'scripts/backup/**'
      - 'ops/backup/owner-workstation*'
      - '.github/workflows/owner-recovery-*.yml'
permissions:
  contents: read
concurrency:
  group: owner-recovery-checks-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
jobs:
  owner-proof:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Prepare pinned age for synthetic key test
        run: |
          set -euo pipefail
          STAGE="$RUNNER_TEMP/owner-age-test-tools"
          install -d -m 0700 "$STAGE"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location \
            --connect-timeout 15 --max-time 120 \
            https://github.com/FiloSottile/age/releases/download/v1.3.2/age-v1.3.2-linux-amd64.tar.gz \
            --output "$STAGE/age.tar.gz"
          printf '%s  %s\n' cbe24006683f8eb669266162894b9a522a1af52f2665fbc63a4bb032ed26ac10 "$STAGE/age.tar.gz" | sha256sum -c -
          tar -xzf "$STAGE/age.tar.gz" -C "$STAGE" age/age age/age-keygen
          printf '%s\n' "$STAGE/age" >>"$GITHUB_PATH"
      - name: Real synthetic crypto and owner/independent boundary tests
        env:
          LEADDRIVE_OWNER_AGE_INTEGRATION: '1'
        run: node --test scripts/backup/owner-recovery.test.mjs
      - name: Existing pinned helper consistency and shell syntax
        run: |
          node scripts/ci/test-event-platform-assets.mjs
          bash -n scripts/backup/commission-production-backup.sh scripts/backup/postgres-backup.sh scripts/backup/snapshot-secrets.sh scripts/backup/snapshot-runtime-files.sh scripts/backup/verify-offline-backup.sh
      - name: Executable code staging with a real noexec plaintext mount (synthetic only)
        run: |
          set -euo pipefail
          STAGE="$(mktemp -d "$RUNNER_TEMP/owner-noexec.XXXXXX")"
          trap 'sudo umount -- "$STAGE"; rmdir -- "$STAGE"' EXIT
          sudo mount -t tmpfs -o "noexec,nosuid,nodev,size=8m,mode=0700,uid=$(id -u),gid=$(id -g)" tmpfs "$STAGE"
          LEADDRIVE_TEST_NOEXEC_ROOT="$STAGE" node --test scripts/backup/commission-code-staging.test.mjs
      - name: Actual isolated transient database workspace (synthetic only)
        run: |
          set -euo pipefail
          NODE="$(command -v node)"
          sudo env "GITHUB_ACTIONS=$GITHUB_ACTIONS" "RUNNER_ENVIRONMENT=$RUNNER_ENVIRONMENT" \
            LEADDRIVE_TEST_REAL_WORKSPACE=1 "$NODE" --test scripts/backup/transient-workspace.test.mjs
      - name: Build isolated owner workbench (synthetic data only)
        run: docker build -f ops/backup/owner-workstation.Dockerfile -t owner-workbench-test .
      - name: Real bounded scratch lifecycle with separate PostgreSQL16 source (synthetic only)
        run: |
          set -euo pipefail
          test -x /usr/lib/postgresql/16/bin/postgres
          NODE="$(command -v node)"
          sudo env "GITHUB_ACTIONS=$GITHUB_ACTIONS" "RUNNER_ENVIRONMENT=$RUNNER_ENVIRONMENT" \
            LEADDRIVE_TEST_REAL_SCRATCH=1 "$NODE" --test scripts/backup/scratch-service.test.mjs
      - name: Real PostgreSQL canary authentication and cleanup (synthetic only)
        run: |
          docker run --rm --network none --read-only --memory 1g --memory-swap 1g --cpus 1 \
            --tmpfs /scratch:rw,noexec,nosuid,size=64m,mode=0700 \
            --tmpfs /database:rw,noexec,nosuid,size=256m,mode=0755 \
            --tmpfs /tmp:rw,noexec,nosuid,size=64m \
            --mount "type=bind,source=$GITHUB_WORKSPACE,target=/reviewed,readonly" \
            -e "GITHUB_ACTIONS=$GITHUB_ACTIONS" -e "RUNNER_ENVIRONMENT=$RUNNER_ENVIRONMENT" \
            -e LEADDRIVE_TEST_NATIVE_AUTH=1 --entrypoint node \
            owner-workbench-test --test /reviewed/scripts/backup/scratch-authentication.test.mjs
      - name: Check network isolation and disposable PostgreSQL
        run: |
          docker run --rm --network none --read-only --memory 1g --memory-swap 1g --cpus 1 \
            --tmpfs /scratch:rw,noexec,nosuid,size=128m,mode=0700 \
            --tmpfs /database:rw,noexec,nosuid,size=256m,mode=0700 \
            --tmpfs /tmp:rw,noexec,nosuid,size=64m \
            owner-workbench-test --self-test
      - name: Reject swap-enabled plaintext runtime
        run: |
          set -euo pipefail
          set +e
          RESULT="$(docker run --rm --network none --read-only --memory 1g --memory-swap 2g owner-workbench-test --self-test 2>&1)"
          STATUS=$?
          set -e
          [ "$STATUS" -eq 1 ]
          [ "$RESULT" = 'owner workbench: requires cgroup-v2 memory.swap.max=0; set --memory-swap equal to --memory' ]
