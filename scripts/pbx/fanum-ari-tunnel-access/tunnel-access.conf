# The CRM reaches the station's control port through the tunnel the station
# itself keeps to the CRM host (fanum-ari-tunnel.service:
# CRM 127.0.0.1:18088 → here 127.0.0.1:8088), so its requests arrive from
# loopback. Included in the fanum-pbx-control.internal server block right
# before the one-host source ACL, so it adds loopback and changes nothing else.
#
# Loopback gains nothing it did not have: Asterisk HTTP (127.0.0.1:8089) and the
# attempt registry (127.0.0.1:8091) already listen on loopback without an ACL.
# ARI still needs its password and TLS still presents the pinned certificate.
#
# Why the tunnel: on 2026-10-25 around 10:06 UTC the station's public address
# moved from 185.161.225.131 to 185.161.225.130 at Fanum's edge, and the
# forwarding of 8088 to the station did not move with it — the CRM host gets
# «No route to host». The tunnel reconnected by itself from the new address.
allow 127.0.0.1;
