; Fanum PBX — exact-DID inbound browser gate.
;
; One station-local exact selector enters this subroutine with a fixed alias.
; The caller hears ringing while LeadDrive waits for an atomically claimed,
; microphone-ready browser.  Answer() is deliberately after that proof;
; AudioSocket follows without an intervening network call.

[fanum-inbound-browser]
exten => s,1,NoOp(Fanum inbound browser gate)
 same => n,Set(__FANUM_SAFE_CALL_ID=)
 same => n,AGI(/usr/local/lib/fanum-voice/fanum-inbound-browser-agi.py,identify)
 same => n,GotoIf($["${AGISTATUS}" = "SUCCESS"]?agi-succeeded:invalid-id)
 same => n(agi-succeeded),GotoIf($[${LEN(${FANUM_SAFE_CALL_ID})} = 36]?identified:invalid-id)
 same => n(identified),Set(__FANUM_INBOUND_TERMINAL_STATE=no_answer)
 same => n,Set(CHANNEL(hangup_handler_push)=fanum-inbound-browser-terminal,s,1)
 same => n,Ringing()
 same => n,Set(FANUM_INBOUND_EVENT_OK=0)
 same => n,AGI(/usr/local/lib/fanum-voice/fanum-inbound-browser-agi.py,ringing,${FANUM_SAFE_CALL_ID},${ARG1})
 same => n,GotoIf($["${FANUM_INBOUND_EVENT_OK}" = "1"]?await-browser:registration-failed)
 same => n(await-browser),Set(FANUM_BROWSER_READY=0)
 same => n,AGI(/usr/local/lib/fanum-voice/fanum-inbound-browser-agi.py,ready,${FANUM_SAFE_CALL_ID})
 same => n,GotoIf($["${FANUM_BROWSER_READY}" = "1"]?answer:missed)
 same => n(answer),Answer()
 same => n,Set(__FANUM_INBOUND_TERMINAL_STATE=connected)
 ; This mode only fsyncs a local event.  It performs no network request in the
 ; answer-to-AudioSocket interval.
 same => n,AGI(/usr/local/lib/fanum-voice/fanum-inbound-browser-agi.py,answered,${FANUM_SAFE_CALL_ID})
 same => n,Set(CHANNEL(language)=az)
 same => n,Set(DENOISE(rx)=on)
 same => n,Set(AGC(rx)=5000)
 same => n,AudioSocket(${FANUM_SAFE_CALL_ID},127.0.0.1:9093)
 same => n,Hangup()
 same => n(missed),Hangup()
 same => n(registration-failed),Set(__FANUM_INBOUND_TERMINAL_STATE=failed)
 same => n,Hangup()
 same => n(invalid-id),Hangup()

[fanum-inbound-browser-terminal]
exten => s,1,NoOp(Fanum inbound browser terminal event)
 ; CDR(answer) closes the one-instruction race between Answer() succeeding and
 ; the state assignment immediately after it.
 same => n,ExecIf($["${CDR(answer)}" != ""]?Set(FANUM_INBOUND_TERMINAL_STATE=connected))
 same => n,Set(FANUM_INBOUND_DURATION=0)
 same => n,ExecIf($["${FANUM_INBOUND_TERMINAL_STATE}" = "connected"]?Set(FANUM_INBOUND_DURATION=${CDR(billsec)}))
 same => n,ExecIf($["${FANUM_INBOUND_DURATION}" = ""]?Set(FANUM_INBOUND_DURATION=0))
 same => n,AGI(/usr/local/lib/fanum-voice/fanum-inbound-browser-agi.py,terminal,${FANUM_SAFE_CALL_ID},${FANUM_INBOUND_TERMINAL_STATE},${FANUM_INBOUND_DURATION})
 same => n,Return()
