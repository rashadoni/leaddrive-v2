[transport-tls-wa-ip]
type=transport
protocol=tls
bind=0.0.0.0:5063
method=tlsv1_2
; Asterisk's own DNS lookup on this station answers 'no answer record' for wa-sip.leaddrivecrm.org
; (2026-11-12), so the relay is reached by its address; the certificate is then not
; matched to a name. Digest auth still guards the account.
verify_server=no
external_signaling_address=185.161.225.189
external_media_address=185.161.225.189
local_net=172.16.207.0/24

[wa-relay-auth]
type=auth
auth_type=userpass
username=zeytun-station
password=__STATION_PASSWORD__

[wa-relay-aor]
type=aor
contact=sip:13.140.132.245:5061;transport=tls
qualify_frequency=60

[wa-relay]
type=endpoint
transport=transport-tls-wa-ip
context=from-wa-relay
disallow=all
allow=alaw
media_encryption=sdes
media_encryption_optimistic=no
aors=wa-relay-aor
outbound_auth=wa-relay-auth
direct_media=no
force_rport=yes
rewrite_contact=yes
rtp_symmetric=yes
dtmf_mode=rfc4733
allow_subscribe=no

[wa-relay-identify]
type=identify
endpoint=wa-relay
match=13.140.132.245

[wa-relay-registration]
type=registration
transport=transport-tls-wa-ip
outbound_auth=wa-relay-auth
server_uri=sip:13.140.132.245:5061;transport=tls
client_uri=sip:zeytun-station@wa-sip.leaddrivecrm.org
contact_user=zeytun-station
retry_interval=60
fatal_retry_interval=600
forbidden_retry_interval=600
expiration=300
max_retries=1000000
auth_rejection_permanent=no
