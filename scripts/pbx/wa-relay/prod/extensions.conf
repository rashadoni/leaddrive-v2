; WhatsApp calls (Meta SIP) go on to Zeytun's station, which registers here and
; answers them with the same AI line as its operator DID. Nothing else is routed.
[general]
static=yes
writeprotect=yes

[globals]

[default]
exten => _X.,1,Hangup(21)
exten => _+X.,1,Hangup(21)

; Meta: Request-URI is the business number, From is the caller (+E.164 or a BSUID).
[from-meta]
exten => _+X.,1,NoOp(WhatsApp call to ${EXTEN} from ${CALLERID(num)} wacid ${PJSIP_HEADER(read,x-wa-meta-wacid)})
 same => n,Set(CALLERID(num)=${FILTER(0123456789,${CALLERID(num)})})
 same => n,Set(CALLERID(name)=)
 same => n,Set(WA_BUSINESS=${FILTER(0123456789,${EXTEN})})
 same => n,GotoIf($[${LEN(${CALLERID(num)})} < 8]?reject)
 same => n,Dial(PJSIP/${WA_BUSINESS}@zeytun-station,45)
 same => n,Hangup()
 same => n(reject),Hangup(21)
exten => _X.,1,Goto(from-meta,+${EXTEN},1)

; The station only receives here; it places nothing through this relay yet.
[from-station]
exten => _X.,1,Hangup(21)
exten => _+X.,1,Hangup(21)
