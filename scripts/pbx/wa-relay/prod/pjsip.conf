; WhatsApp SIP relay (2026-11-12). Two parties only, both over TLS with SRTP:
; Meta (wa.meta.vc) and Zeytun's station, which registers here from behind NAT.
[global]
type=global
user_agent=LeadDrive-WA
endpoint_identifier_order=ip,auth_username,username
max_forwards=20

[transport-tls]
type=transport
protocol=tls
bind=0.0.0.0:5061
cert_file=/etc/asterisk/keys/wa-sip.crt
priv_key_file=/etc/asterisk/keys/wa-sip.key
method=tlsv1_2
allow_reload=yes

; ---- Meta ----
[meta-auth]
type=auth
auth_type=userpass
username=994105313065
password=__SECRET__

[meta-aor]
type=aor
contact=sip:wa.meta.vc:5061;transport=tls

[meta]
type=endpoint
transport=transport-tls
context=from-meta
identify_by=ip
; Meta does not answer our digest challenge correctly (2026-11-12: Failed to authenticate with the
; right password); Meta calls it optional. Inbound is accepted only from Meta networks (meta-identify).
outbound_auth=meta-auth
aors=meta-aor
disallow=all
allow=opus,alaw
media_encryption=sdes
media_encryption_optimistic=no
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
dtmf_mode=rfc4733
send_pai=no
trust_id_inbound=no
allow_subscribe=no

[meta-identify]
type=identify
endpoint=meta
match=31.13.24.0/21
match=31.13.64.0/18
match=45.64.40.0/22
match=57.144.0.0/14
match=66.220.144.0/20
match=69.63.176.0/20
match=69.171.224.0/19
match=74.119.76.0/22
match=102.132.96.0/20
match=103.4.96.0/22
match=129.134.0.0/16
match=147.75.208.0/20
match=157.240.0.0/16
match=163.70.128.0/17
match=173.252.64.0/18
match=179.60.192.0/22
match=185.60.216.0/22
match=185.89.216.0/22
match=204.15.20.0/22

; ---- Zeytun's station ----
[zeytun-station-auth]
type=auth
auth_type=userpass
username=zeytun-station
password=__SECRET__

[zeytun-station]
type=aor
max_contacts=1
remove_existing=yes
qualify_frequency=30

[zeytun-station]
type=endpoint
transport=transport-tls
context=from-station
identify_by=auth_username
auth=zeytun-station-auth
aors=zeytun-station
disallow=all
allow=alaw
media_encryption=sdes
media_encryption_optimistic=no
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
dtmf_mode=rfc4733
allow_subscribe=no
