# Relay for the public State Tax Service registry lookup (Kommersiya
# qurumlarının dövlət reyestri məlumatları). The registry answers only
# Azerbaijani addresses and the CRM runs abroad, so the CRM asks through the
# station. Included inside the fanum-pbx-control.internal server block, so the
# block's TLS and its one-host source ACL already apply. One exact path, POST
# only; nothing of the caller's is forwarded but the JSON body.
location = /registry/az/find-taxpayer {
    # The CRM comes through the tunnel the station itself keeps to the CRM host
    # (fanum-ari-tunnel: CRM 127.0.0.1:18088 → here 127.0.0.1:8088), so it
    # arrives from loopback; on 2026-10-25 the public 8088 answered the CRM
    # host «EHOSTUNREACH». Access rules here replace the server block's, so
    # its one-host list is included again for the public path.
    allow 127.0.0.1;
    include /etc/nginx/fanum-pbx-control/crm-source-access.conf;

    limit_except POST { deny all; }
    limit_req zone=az_taxpayer_registry burst=10 nodelay;
    limit_req_status 429;
    client_max_body_size 1k;

    # The name is looked up per request (a variable in proxy_pass), not when
    # nginx starts: a literal host that DNS cannot resolve at a reload or a
    # reboot stops the whole nginx — and with it the station's call control.
    # This way a DNS failure fails only this location (502).
    resolver 127.0.0.53 valid=300s ipv6=off;
    resolver_timeout 5s;
    set $az_taxpayer_registry_host "new.e-taxes.gov.az";
    proxy_pass https://$az_taxpayer_registry_host/api/po/authless/public/v1/authless/findTaxpayer;
    proxy_http_version 1.1;
    proxy_ssl_server_name on;
    proxy_ssl_name new.e-taxes.gov.az;
    proxy_ssl_verify on;
    proxy_ssl_verify_depth 3;
    proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    proxy_set_header Host new.e-taxes.gov.az;
    proxy_set_header Content-Type application/json;
    proxy_set_header Accept application/json;
    proxy_set_header Authorization "";
    proxy_set_header Cookie "";
    proxy_set_header X-Forwarded-For "";
    proxy_set_header X-Real-IP "";
    proxy_set_header Connection "";
    proxy_hide_header Set-Cookie;
    proxy_buffering on;
    proxy_intercept_errors off;
    proxy_connect_timeout 5s;
    proxy_read_timeout 15s;
    proxy_send_timeout 5s;
}
