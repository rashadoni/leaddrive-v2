# Full TLS-only cutover site. Install only after the Asterisk HTTP listener is
# prepared for loopback port 8089, the pinned private CA is installed in CRM,
# and the root-only exact-host source ACL is staged. There is deliberately no
# plaintext listener or redirect on the control port.
map $http_upgrade $fanum_ari_connection_upgrade {
    default upgrade;
    ''      close;
}

upstream fanum_asterisk_http {
    server 127.0.0.1:8089;
    keepalive 16;
}

upstream fanum_voice_attempt_registry {
    server 127.0.0.1:8091;
    keepalive 8;
}

# Refuse unknown/missing SNI without presenting the control certificate.
server {
    listen 8088 ssl default_server;
    server_name _;
    server_tokens off;
    ssl_reject_handshake on;
    access_log off;
    error_log /dev/null crit;
}

server {
    listen 8088 ssl;
    server_name fanum-pbx-control.internal;
    server_tokens off;
    access_log off;
    error_log /dev/null crit;
    client_max_body_size 64k;

    # Authoritative ingress restriction. The root-only included file contains
    # exactly one host-sized `allow` followed by `deny all`; the installer
    # validates and snapshots it without printing the address.
    include /etc/nginx/fanum-pbx-control/crm-source-access.conf;

    ssl_certificate /etc/nginx/fanum-pbx-control/server.pem;
    ssl_certificate_key /etc/nginx/fanum-pbx-control/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256';
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:FANUM_TLS:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;

    # Signed durable call-attempt registry. No URI rewrite is allowed because
    # the HMAC covers the exact canonical pathname and raw request body.
    # The regex is quoted because nginx reads an unquoted { as the start of a
    # block, so the {8}, {4}, {3} and {12} quantifiers below make the whole
    # configuration unparseable without quotes.
    location ~ "^/ari/fanum/voice-attempts/[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[1-8][0-9A-Fa-f]{3}-[89AaBb][0-9A-Fa-f]{3}-[0-9A-Fa-f]{12}(?:/cancel)?$" {
        proxy_pass http://fanum_voice_attempt_registry;
        proxy_http_version 1.1;
        proxy_set_header Host 127.0.0.1:8091;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Fanum-Voice-Signature $http_x_fanum_voice_signature;
        proxy_set_header Connection "";
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Real-IP "";
        proxy_request_buffering on;
        proxy_pass_request_body on;
        proxy_buffering off;
        proxy_intercept_errors off;
        proxy_connect_timeout 2s;
        proxy_read_timeout 20s;
        proxy_send_timeout 20s;
    }

    # Preserve the complete Asterisk HTTP surface, including ARI REST and any
    # current/future WebSocket Upgrade endpoint, on the existing external port.
    location / {
        proxy_pass http://fanum_asterisk_http;
        proxy_http_version 1.1;
        proxy_set_header Host 127.0.0.1:8089;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $fanum_ari_connection_upgrade;
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Real-IP "";
        proxy_request_buffering on;
        proxy_pass_request_body on;
        proxy_buffering off;
        proxy_intercept_errors off;
        proxy_connect_timeout 2s;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
