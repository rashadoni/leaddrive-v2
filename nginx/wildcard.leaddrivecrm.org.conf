# Wildcard tenant subdomains — *.leaddrivecrm.org
# ─────────────────────────────────────────────────────────────────────────────
# Canonical config for tenant subdomains (mars, zeytunpharm, afigroup, ...).
# Drift between this file and the running prod config caused the F-41
# /uploads/ bypass that lived from 2026-04 to 2026-05 — see
# `docs/security/nginx-uploads-drift.md` and
# `scripts/nginx-fix-uploads-bypass.sh`.
#
# Install on prod:
#   sudo cp nginx/wildcard.leaddrivecrm.org.conf /etc/nginx/sites-available/wildcard.leaddrivecrm.org
#   sudo cp nginx/wildcard.leaddrivecrm.org.conf /etc/nginx/sites-enabled/wildcard.leaddrivecrm.org
#   sudo nginx -t && sudo systemctl reload nginx
#
# Note: sites-enabled is a regular file (not a symlink) on this host —
# the script that fixed the /uploads/ bypass edited it in place. Copy
# to BOTH paths to keep them in sync.
#
# IMPORTANT — DO NOT add a `location /uploads/` filesystem-alias block
# here. All /uploads/* traffic MUST proxy_pass through to Next.js so the
# F-41 application policy runs: private files stay session/tenant-gated, while
# only exact hardened email-image/logo names are anonymously readable. Uploads
# are served via the API route, never directly off disk.

# Wildcard subdomains for tenant routing
server {
    listen 443 ssl;
    server_name *.leaddrivecrm.org;
    server_tokens off;
    include snippets/leaddrive-error-pages.conf;

    # Cloudflare Origin Certificate (covers *.leaddrivecrm.org).
    ssl_certificate /etc/ssl/cloudflare/leaddrivecrm.org.pem;
    ssl_certificate_key /etc/ssl/cloudflare/leaddrivecrm.org.key;

    # Public static assets — safe to serve off disk (not user-uploaded,
    # not tenant-scoped, no auth gate needed). Performance optimization
    # that avoids round-tripping through the Node.js standalone proxy.
    # Served out of the DEPLOYED ARTIFACT, like /_next/static/ below — not out
    # of /opt/leaddrive-v2/public/, which is the old on-box checkout that no
    # deploy writes to any more. Pointing here at the checkout is silent: the
    # deploy succeeds, the file is in the artifact, `curl localhost:3001` finds
    # it, and nginx still answers 404 forever, with Cloudflare caching that 404.
    # That is how the watermark-free wallpaper stayed invisible on 2026-09-07.
    location /wallpapers/ {
        alias /opt/leaddrive-v2/.next/standalone/public/wallpapers/;
        expires 1h;
        add_header Cache-Control "public, must-revalidate";
    }

    location /_next/static/ {
        alias /opt/leaddrive-v2/.next/standalone/.next/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Single proxy block — middleware detects subdomain and routes to the
    # appropriate tenant. NO `location /uploads/` override — F-41 must
    # authorize every uploads request.
    location / {
        proxy_pass http://127.0.0.1:3001;
        client_max_body_size 20m;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 86400;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }
}

# HTTP redirect for wildcard
server {
    listen 80;
    server_name *.leaddrivecrm.org;
    server_tokens off;
    include snippets/leaddrive-error-pages.conf;
    return 301 https://$host$request_uri;
}
