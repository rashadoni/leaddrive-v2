# Disposable CI fixture only. RF=1 and plaintext are never production defaults.
# Start postgres/kafka, explicitly create Connect internal topics, then start
# connect/registry through scripts/event-platform/test-stack.sh.
services:
  postgres:
    image: postgres:16.13-alpine@sha256:4941ef97aaa2633ce9808f7766f8b8d746dd039ce8c51ca6da185c3dc63ab579
    platform: linux/amd64
    restart: "no"
    mem_limit: 384m
    memswap_limit: 384m
    pids_limit: 128
    environment:
      POSTGRES_USER: event_test
      POSTGRES_PASSWORD: synthetic-fixture-only
      POSTGRES_DB: event_platform_test
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_replication_slots=4
      - -c
      - max_wal_senders=4
      - -c
      - max_slot_wal_keep_size=64MB
      - -c
      - shared_buffers=32MB
      - -c
      - max_connections=30
    healthcheck:
      test: [CMD, pg_isready, -U, event_test, -d, event_platform_test]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "2"

  kafka:
    image: apache/kafka:4.3.1@sha256:ccd1314e47ec76909e01f86308b4dcf2064f19f7c89759234322314b0e319e26
    platform: linux/amd64
    restart: "no"
    mem_limit: 1024m
    memswap_limit: 1024m
    pids_limit: 256
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_DEFAULT_REPLICATION_FACTOR: "1"
      KAFKA_MIN_INSYNC_REPLICAS: "1"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_NUM_PARTITIONS: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_LOG_RETENTION_HOURS: "1"
      KAFKA_LOG_SEGMENT_BYTES: "16777216"
      KAFKA_HEAP_OPTS: -Xms256m -Xmx384m
    healthcheck:
      test:
        - CMD-SHELL
        - KAFKA_HEAP_OPTS='-Xms32m -Xmx128m' /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:9092 >/dev/null 2>&1
      interval: 10s
      timeout: 8s
      retries: 20
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "2"

  connect:
    image: ghcr.io/rashadoni/debezium-connect:3.7.0.Final-8107474c18d5@sha256:8107474c18d56317c007dd930f2782c9636198a895144a0c1dddd6d6a7536d6e
    platform: linux/amd64
    restart: "no"
    mem_limit: 1024m
    memswap_limit: 1024m
    pids_limit: 256
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: ld-test-connect
      CONFIG_STORAGE_TOPIC: ld.test.connect.config
      OFFSET_STORAGE_TOPIC: ld.test.connect.offset
      STATUS_STORAGE_TOPIC: ld.test.connect.status
      CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: "1"
      CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: "1"
      CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: "1"
      CONNECT_OFFSET_STORAGE_PARTITIONS: "1"
      CONNECT_STATUS_STORAGE_PARTITIONS: "1"
      CONNECT_TOPIC_CREATION_ENABLE: "false"
      CONNECT_PRODUCER_ACKS: all
      CONNECT_PRODUCER_ENABLE_IDEMPOTENCE: "true"
      KEY_CONVERTER: org.apache.kafka.connect.storage.StringConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_VALUE_CONVERTER_SCHEMAS_ENABLE: "false"
      HOST_NAME: connect
      REST_HOST_NAME: 0.0.0.0
      ADVERTISED_HOST_NAME: connect
      OFFSET_FLUSH_INTERVAL_MS: "1000"
      HEAP_OPTS: -Xms256m -Xmx512m
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "2"

  registry:
    image: apicurio/apicurio-registry:3.3.0@sha256:25b302bc1ecf53cb01bda4f39749f175c94f3f6d27dcc57123d25714e4a0b117
    platform: linux/amd64
    restart: "no"
    mem_limit: 512m
    memswap_limit: 512m
    pids_limit: 128
    environment:
      APICURIO_STORAGE_KIND: sql
      APICURIO_STORAGE_SQL_KIND: h2
      APICURIO_DATASOURCE_URL: jdbc:h2:mem:event_test
      APICURIO_DATASOURCE_USERNAME: sa
      APICURIO_DATASOURCE_PASSWORD: synthetic-fixture-only
      APICURIO_DATASOURCE_JDBC_INITIAL_SIZE: "2"
      APICURIO_DATASOURCE_JDBC_MIN_SIZE: "2"
      APICURIO_DATASOURCE_JDBC_MAX_SIZE: "5"
      QUARKUS_OTEL_SDK_DISABLED: "true"
      JAVA_TOOL_OPTIONS: -Xms64m -Xmx256m
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "2"

networks:
  default:
    internal: true
