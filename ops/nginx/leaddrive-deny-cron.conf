# /api/cron/* authenticates with one shared secret and, on success, calls
# enterRlsBypass() — a single guessed string would therefore act across every
# tenant at once, not within one. On 2026-08-25 that secret was the literal
# string "leaddrive-cron-secret-2026" and these endpoints answered from the
# public internet on every hostname this server serves.
#
# Nothing outside this host has any reason to call them: every scheduled job
# runs from root's crontab against http://localhost:3001, which does not pass
# through nginx. Closing them at the edge means the secret alone is no longer
# enough — an attacker must already be on the box, where they have easier paths.
#
# 404, not 403: a 403 confirms the path exists.
location ^~ /api/cron/ {
    return 404;
}
