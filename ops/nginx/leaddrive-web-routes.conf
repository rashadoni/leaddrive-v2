# Installed as /etc/nginx/snippets/leaddrive-web-routes.conf and included in
# the app.leaddrivecrm.org TLS server block by scripts/nginx-install-station-routes.sh.
#
# The shell's event stream (src/app/api/v1/shell/events) goes to the web process
# only, never to the backup in leaddrive-web-upstream.conf: the web process keeps
# who has the CRM open (src/lib/shell-events/presence.ts), and the line asks it
# whether a manager can take a transfer. A tab connected to another process
# would stay there for hours, invisible. During a web restart the stream is
# refused and the tab reconnects by itself, polling meanwhile.
location = /api/v1/shell/events {
    proxy_pass http://127.0.0.1:3001;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 86400;
}
