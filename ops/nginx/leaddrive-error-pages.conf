# Replaces nginx's stock error pages.
#
# The 2026-08 penetration re-test reported "Web Server Version Disclosure via
# Default Error Pages". `server_tokens off` (already set in nginx.conf) removed
# the VERSION, but not the pages themselves: any request nginx answers on its
# own — an over-long URI (414), an oversized upload (413), the /api/cron/ deny
# (404) — still returned nginx's built-in HTML with `<hr><center>nginx</center>`
# in the footer, identifying the server to anyone who looked. Cloudflare masks
# the `Server:` header on proxied responses, but it forwards that body verbatim.
#
# Note the two directives have different scopes, which is why both live here and
# this file is included per server block rather than in `http {}`:
#   * `error_page` is inherited, so it could sit at http level;
#   * `location` is only valid inside `server` or `location` — placing it in
#     `http {}` makes `nginx -t` fail with "location directive is not allowed
#     here" and the reload is refused.
#
# No `=code` on error_page: the original status is preserved, so monitoring and
# clients still see the real 4xx/5xx. `proxy_intercept_errors` is off (the
# default) in every server block, so responses produced by the Next.js app pass
# through untouched — this only affects errors nginx itself generates.
error_page 400 401 402 403 404 405 406 408 409 410 411 412 413 414 415 416 421 429 431 /__leaddrive_error.html;
error_page 500 501 502 503 504 505 507 /__leaddrive_error.html;

location = /__leaddrive_error.html {
    internal;
    root /etc/nginx/errors;
    default_type text/html;
}

# The served file must be named for the URI, not for the snippet: `root` +
# `/__leaddrive_error.html` resolves to /etc/nginx/errors/__leaddrive_error.html.
# Get this wrong and nginx cannot find the page, detects error_page recursion,
# and falls back to the stock page — the config validates, the reload succeeds,
# and nothing actually changes. Source: ops/nginx/errors/__leaddrive_error.html.
