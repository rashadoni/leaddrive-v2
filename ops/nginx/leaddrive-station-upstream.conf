# Installed as /etc/nginx/conf.d/leaddrive-station-upstream.conf (http level)
# by scripts/nginx-install-station-routes.sh; used by
# ops/nginx/leaddrive-station-routes.conf.
#
# The phone station's questions go to its own process (pm2 leaddrive-v2-line,
# ecosystem.config.cjs), not to the web process that serves people's pages and
# was making the station wait 1–4 s (owner, 2026-10-28). When that process does
# not accept the connection — down after a failed deploy check, restarting, or
# an older release without it — nginx hands the same request to the web
# process, which answers exactly as it did before the line had a process.
upstream leaddrive_station {
    server 127.0.0.1:3003 max_fails=1 fail_timeout=5s;
    server 127.0.0.1:3001 backup;
    # Reused connections save the station a TCP handshake per question. Node
    # closes an idle one after 5 s (its keepAliveTimeout); nginx must drop it
    # first, or a POST could go out on a socket Node is closing — and a sent
    # POST is never retried (proxy_next_upstream error in the routes snippet).
    keepalive 8;
    keepalive_timeout 4s;
}
