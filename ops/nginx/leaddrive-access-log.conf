# Installed as /etc/nginx/snippets/leaddrive-access-log.conf and included in
# every server block of every site in /etc/nginx/sites-enabled by
# scripts/nginx-install-access-log.sh.
#
# Same file as nginx.conf's http-level `access_log`, in the timed format
# (ops/nginx/leaddrive-log-format.conf). An access_log in a server block
# replaces the inherited one rather than adding to it, so each request is still
# written once. It has to be here and not in nginx.conf: nginx resolves a
# format name when it parses the directive, and nginx.conf's access_log comes
# before the conf.d include that defines the format.
access_log /var/log/nginx/access.log leaddrive_timed;
