# Installed as /etc/nginx/snippets/leaddrive-station-routes.conf and included in
# the app.leaddrivecrm.org server block by scripts/nginx-install-station-routes.sh.
#
# Everything the PBX asks the CRM: call lifecycle, who answers an inbound call,
# the AI-to-manager handoff (asterisk/*), and the voice agent's runtime config,
# Zeytun's line (session, lookups, orders, transfer) and call results
# (voice-agent/*). Upstream and fallback: leaddrive-station-upstream.conf.
#
# X-Request-Start is when nginx received the request; src/lib/station-timing.ts
# logs how long the request then waited before the handler ran ("queuedMs").
#
# Only a refused or failed connection moves a request to the backup ("error"):
# a slow answer is not retried, because these are POSTs that save orders and
# call events, and a second copy must never be sent while the first may run.
location ^~ /api/internal/asterisk/ {
    proxy_pass http://leaddrive_station;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Start "t=${msec}";
    proxy_next_upstream error;
    proxy_connect_timeout 1s;
    proxy_read_timeout 300s;
    client_max_body_size 20m;
}

location ^~ /api/internal/voice-agent/ {
    proxy_pass http://leaddrive_station;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Start "t=${msec}";
    proxy_next_upstream error;
    proxy_connect_timeout 1s;
    proxy_read_timeout 300s;
    client_max_body_size 20m;
}
