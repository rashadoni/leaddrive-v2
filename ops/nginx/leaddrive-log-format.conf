# Installed as /etc/nginx/conf.d/leaddrive-log-format.conf (http level) by
# scripts/nginx-install-access-log.sh; used by ops/nginx/leaddrive-access-log.conf.
#
# nginx's own `combined` line, word for word, with four fields appended at the
# END, so anything that reads the access log as combined (logrotate, log
# shipping, fail2ban filters, an awk over $1/$7/$9) still reads it the same.
# Before 2026-11-09 the log had no timing at all, and every hunt for slow
# requests (the stalls of 2026-11-08/09) needed its own probe.
#
#   rt   $request_time           seconds from the first byte of the request to
#                                the last byte of the answer, as nginx saw it
#   urt  $upstream_response_time  seconds the app process took ("-": nginx
#                                answered itself, e.g. the /api/cron/ deny)
#   ua   $upstream_addr          which process answered: 127.0.0.1:3001 web,
#                                :3004/:3005 the line slot, :8095 softphone relay
#   us   $upstream_status        its status
#
# When nginx tried more than one upstream (a refused web process, then the
# line slot as backup) the upstream fields list each attempt, comma-separated:
# ua="127.0.0.1:3001, 127.0.0.1:3005". Hence the quotes.
#
# Slowest requests of the last hour, for example:
#   awk -v since="$(date -d '-1 hour' '+%d/%b/%Y:%H:%M:%S')" '
#     { t = substr($4, 2) } t >= since && match($0, / rt=[0-9.]+/) {
#       print substr($0, RSTART + 4, RLENGTH - 4), $7 }' /var/log/nginx/access.log |
#     sort -rn | head
# (string comparison of the timestamp holds within one day; the log rotates daily.)
log_format leaddrive_timed '$remote_addr - $remote_user [$time_local] '
                           '"$request" $status $body_bytes_sent '
                           '"$http_referer" "$http_user_agent" '
                           'rt=$request_time urt="$upstream_response_time" '
                           'ua="$upstream_addr" us="$upstream_status"';
