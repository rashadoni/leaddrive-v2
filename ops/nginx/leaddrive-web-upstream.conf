# Installed as /etc/nginx/conf.d/leaddrive-web-upstream.conf (http level) by
# scripts/nginx-install-station-routes.sh; used by `location /` of the
# app.leaddrivecrm.org TLS server block.
#
# People's pages and API go to the web process (pm2 leaddrive-v2, :3001). While
# a deploy restarts it, about three seconds every time (measured 2026-10-28:
# 12 answers 502 out of 5 a second), nothing listens there and nginx answered
# 502. Now a refused connection goes to the phone line's live slot instead: the
# same release bundle in its own process, idle between station questions. The
# deploy (Step 7c in scripts/server-deploy.sh) keeps the backup line on the
# slot it just made live, by the "# line slot" marker.
#
# The shell's event stream stays on the web process only
# (leaddrive-web-routes.conf): who is online lives in that process's memory.
upstream leaddrive_web {
    server 127.0.0.1:3001 max_fails=1 fail_timeout=3s;
    server 127.0.0.1:3004 backup; # line slot
}
